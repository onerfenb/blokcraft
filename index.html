  }
  function depthOf(list) {
    let d = 0;
    for (const n of list || []) {
      if (n && typeof n === 'object') d = Math.max(d, 1 + Math.max(depthOf(n.do), depthOf(n.else)));
    }
    return d;
  }
  // First empty container lane in pre-order ("fill the gap" levels): ['main', 0, 'do', 0, 'do'] or null.
  function firstEmptyLane(list, seq) {
    for (let i = 0; i < (list || []).length; i++) {
      const n = list[i];
      if (!n || typeof n !== 'object') continue;
      for (const lane of ['do', 'else']) {
        if (!Array.isArray(n[lane])) continue;
        const s = seq.concat(i, lane);
        if (!n[lane].length) return s;
        const deep = firstEmptyLane(n[lane], s);
        if (deep) return deep;
      }
    }
    return null;
  }
  function listAt(prog, seq) {
    let cur = prog[seq[0]];
    for (let i = 1; i < seq.length; i += 2) {
      const node = Array.isArray(cur) ? cur[seq[i]] : null;
      cur = node && typeof node === 'object' ? node[seq[i + 1]] : null;
    }
    return Array.isArray(cur) ? cur : null;
  }
  function nodeAt(prog, path) {
    const list = listAt(prog, path.slice(0, -1));
    return list ? list[path[path.length - 1]] : undefined;
  }
  const sizeOf = (node) => MC.size([node]);
  // Header icon of a container = its palette icon (cmd.ifelse is its own sprite); 'cmd.if' while that is missing.
  function headIcon(k) {
    const nm = (MC.paletteInfo[k] || {}).icon || 'cmd.' + k;
    return k === 'ifelse' && MC.art && MC.art.has && !MC.art.has(nm) ? 'cmd.if' : nm;
  }

  // Spoken label of a node (palette entries and placed blocks).
  function nodeSay(node) {
    const k = kindOf(node);
    if (typeof node === 'string') return (MC.paletteInfo[node] || {}).say || node;
    if (k === 'rep') return `Tekrarla, ${node.rep} kez`;
    if (k === 'until') return MC.condSay(node.until, 'until') + ' tekrarla';
    if (k === 'if') return 'Eğer ' + MC.condSay(node.if, 'if').toLowerCase();
    if (k === 'ifelse') return 'Eğer ' + MC.condSay(node.if, 'if').toLowerCase() + ', değilse';
    return '';
  }

  const PX = { lg: { icon: 32, arrow: 20, cond: 24, num: 21 }, md: { icon: 32, arrow: 16, cond: 24, num: 21 }, sm: { icon: 24, arrow: 16, cond: 16, num: 14 } };

  // ------------------------------------------------------------------ editor
  function create(root, opts) {
    const o = opts || {};
    const ro = !!o.readonly;
    const size = PX[o.size] ? o.size : ro ? 'md' : 'lg';
    const px = PX[size];
    const L = o.level ? MC.parse(o.level) : null;
    const conds = L && L.conds && L.conds.length ? L.conds.slice() : ['goal'];
    const max = L && L.max != null ? L.max : null;
    const funcs = ((L && L.funcs) || []).filter((f) => FUNCS.includes(f));
    const tag = ro ? 'div' : 'button';

    let prog = { main: [] };
    let active = 'main';
    let sel = null;
    let cur = {};
    let marks = { run: null, call: null, fail: null, hint: null };
    let locked = false;
    let dead = false;

    const el = h('div', { class: `ed ed--${size}${ro ? ' ed--ro' : ''}` });
    if (root) root.appendChild(el);

    function strips() {
      const s = ['main'];
      for (const f of FUNCS) {
        if (funcs.includes(f)) s.push(f);
        else if (ro && prog[f] && prog[f].length) s.push(f);
      }
      return s;
    }
    const total = () => MC.size(prog);
    const isFull = () => max != null && total() >= max;

    function resetCursors() {
      cur = {};
      for (const s of strips()) cur[s] = { seq: [s], index: (prog[s] || []).length };
    }
    function validCursor() {
      for (const s of strips()) {
        const c = cur[s];
        const list = c && listAt(prog, c.seq);
        if (!c || !list) cur[s] = { seq: [s], index: (prog[s] || []).length };
        else c.index = Math.max(0, Math.min(c.index, list.length));
      }
      if (!strips().includes(active)) active = 'main';
      if (sel && nodeAt(prog, sel) === undefined) sel = null;
    }

    function set(p) {
      prog = MC.norm(clone(p || []));
      prog.main = prog.main || [];
      if (!ro) for (const f of funcs) if (!prog[f]) prog[f] = [];
      active = 'main';
      sel = null;
      marks = { run: null, call: null, fail: null, hint: null };
      resetCursors();
      if (!ro) {
        // "fill the gap" levels: the frame starts in the first empty lane, not after the whole program
        const lane = firstEmptyLane(prog.main, ['main']);
        if (lane) cur.main = { seq: lane, index: 0 };
      }
      render();
    }

    function program() {
      const out = { main: clone(prog.main) };
      for (const f of FUNCS) if (prog[f] && (funcs.includes(f) || prog[f].length)) out[f] = clone(prog[f]);
      return out;
    }

    // --------------------------------------------------------------- rendering
    function frameAt(seq, i) {
      if (ro || sel || isFull()) return false;
      const c = cur[active];
      return seq[0] === active && c && sameSeq(c.seq, seq) && c.index === i;
    }
    const frameVisible = () => !ro && !sel && !isFull();

    function frameEl() {
      return h(tag, { class: 'ed-frame', 'data-act': 'frame', 'aria-label': 'Sıradaki blok buraya', type: ro ? null : 'button' });
    }
    function ghostEl(seq, kind) {
      return h(tag, { class: `ed-ghost ed-ghost--${kind}`, 'data-act': 'slot', 'data-seq': keyOf(seq), 'aria-label': 'Buraya ekle', type: ro ? null : 'button' });
    }

    function seqEl(list, seq) {
      const box = h('div', { class: 'ed-seq', 'data-seq': keyOf(seq) });
      const top = seq.length === 1;
      list.forEach((node, i) => {
        if (frameAt(seq, i)) box.append(frameEl());
        box.append(nodeEl(node, seq.concat(i)));
      });
      const endFrame = frameAt(seq, list.length);
      if (endFrame) box.append(frameEl());
      if (!ro) {
        if (top && seq[0] === 'main' && max != null) {
          // capacity: faint empty slots so he sees how many blocks still fit
          const remaining = Math.max(0, max - total());
          let ghosts = remaining - (frameVisible() ? 1 : 0);
          if (!endFrame && remaining > 0) ghosts = Math.max(ghosts, 1);
          const shown = Math.min(ghosts, 10);
          box.dataset.cap = String(Math.max(0, ghosts - (!endFrame && shown > 0 ? 1 : 0)));
          for (let g = 0; g < shown; g++) {
            box.append(g === 0 && !endFrame ? ghostEl(seq, 'end') : h('div', { class: 'ed-ghost ed-ghost--cap', 'aria-hidden': 'true' }));
          }
          if (ghosts > shown) box.append(h('div', { class: 'ed-more', 'aria-label': `${ghosts} boş yer` }, '+' + (ghosts - shown)));
        } else if (top) {
          if (!endFrame && !isFull()) box.append(ghostEl(seq, 'end'));
        } else if (!endFrame && !isFull()) {
          box.append(ghostEl(seq, list.length ? 'tail' : 'empty'));
        } else if (!endFrame && !list.length) {
          box.append(h('div', { class: 'ed-ghost ed-ghost--empty is-off', 'aria-hidden': 'true' }));
        }
      } else if (!list.length) {
        box.append(h('div', { class: 'ed-none', 'aria-hidden': 'true' }));
      }
      return box;
    }

    function condEl(cond, path, mode) {
      const c = MC.parseCond(cond) || { kind: 'goal', dir: null, neg: false };
      const b = h(tag, {
        class: 'ed-cond' + (c.neg ? ' is-neg' : ''),
        'data-act': 'cond',
        'data-path': keyOf(path),
        'aria-label': MC.condSay(cond, mode),
        title: MC.condSay(cond, mode),
        type: ro ? null : 'button',
      });
      if (c.dir) b.append(h('span', { class: 'ed-cond-dir' }, icon('cmd.' + c.dir, px.arrow)));
      b.append(h('span', { class: 'ed-cond-kind' }, icon('cond.' + c.kind, px.cond)));
      return b;
    }

    function nodeEl(node, path) {
      const k = kindOf(node);
      const pk = keyOf(path);
      if (typeof node === 'string') {
        const info = MC.paletteInfo[node] || {};
        return h(tag, {
          class: `ed-blk g-${info.group || 'move'}${sel && keyOf(sel) === pk ? ' is-sel' : ''}`,
          'data-act': 'blk',
          'data-path': pk,
          'aria-label': info.label || node,
          type: ro ? null : 'button',
        }, icon(info.icon || 'cmd.' + node, px.icon));
      }
      const selCls = sel && keyOf(sel) === pk ? ' is-sel' : '';
      const box = h('div', { class: `ed-box ed-box--${k}${selCls}`, 'data-path': pk });
      const head = h(tag, {
        class: 'ed-head',
        'data-act': 'head',
        'data-path': pk,
        'aria-label': (MC.paletteInfo[k] || {}).label || k,
        type: ro ? null : 'button',
      }, icon(headIcon(k), px.icon));
      const row = h('div', { class: 'ed-row' }, head);
      if (k === 'rep') {
        row.append(h(tag, { class: 'ed-count', 'data-act': 'count', 'data-path': pk, 'aria-label': `${node.rep} kez`, type: ro ? null : 'button' }, num(node.rep + '×', px.num, { color: '#1d1d22', shadow: null })));
      } else if (k === 'until') {
        row.append(condEl(node.until, path, 'until'));
      } else {
        row.append(condEl(node.if, path, 'if'));
      }
      row.append(seqEl(node.do || [], path.concat('do')));
      box.append(row);
      if (k === 'ifelse') {
        const eh = h(tag, { class: 'ed-head ed-head--else', 'data-act': 'head', 'data-path': pk, 'aria-label': 'Değilse', type: ro ? null : 'button' }, icon('cmd.else', px.icon));
        box.append(h('div', { class: 'ed-row ed-row--else' }, eh, seqEl(node.else || [], path.concat('else'))));
      }
      return box;
    }

    function stripHead(s) {
      const isMain = s === 'main';
      return h(tag, { class: 'ed-strip-head', 'data-act': 'strip', 'data-strip': s, type: ro ? null : 'button', 'aria-label': isMain ? 'Program' : 'Tarif ' + s },
        icon(isMain ? 'ui.play' : 'cmd.' + s, 24),
        h('span', { class: 'ed-strip-name' }, isMain ? 'Program' : 'Tarif ' + s));
    }

    function render() {
      if (dead) return;
      validCursor();
      el.textContent = '';
      const ss = strips();
      const multi = ss.length > 1;
      el.classList.toggle('ed--multi', multi);
      // deeply nested programs (a container inside a container) use a slightly smaller block so the board keeps room
      el.classList.toggle('ed--deep', !ro && size === 'lg' && ss.some((s) => depthOf(prog[s]) >= 2));
      for (const s of ss) {
        const st = h('div', {
          class: 'ed-strip' + (s !== 'main' ? ' ed-strip--fn' : '') + (multi && !ro && s === active ? ' is-active' : ''),
          'data-strip': s,
        });
        if (multi) st.append(stripHead(s));
        st.append(seqEl(prog[s] || [], [s]));
        el.append(st);
      }
      trimCapacity();
      applyMarks(false);
      if (o.onRender) o.onRender();
    }

    // Capacity slots only fill the row the program ends on; the rest is a "+N" count (no extra rows of empty slots).
    function trimCapacity() {
      if (ro || max == null) return;
      const box = el.querySelector('.ed-strip[data-strip="main"] > .ed-seq');
      if (!box || !box.dataset.cap || !box.clientWidth) return;
      const caps = [...box.querySelectorAll(':scope > .ed-ghost--cap')];
      let more = box.querySelector(':scope > .ed-more');
      if (!caps.length && !more) return;
      const first = caps[0] || more;
      const ref = first.previousElementSibling;
      const refTop = ref ? ref.offsetTop + ref.offsetHeight / 2 : null;
      const sameRow = (g) => refTop == null || (g.offsetTop <= refTop && g.offsetTop + g.offsetHeight >= refTop);
      let visible = caps.filter((g) => {
        if (sameRow(g)) return true;
        g.remove();
        return false;
      });
      const setMore = () => {
        const hidden = Number(box.dataset.cap) - visible.length;
        if (hidden <= 0) { if (more) more.remove(); more = null; return; }
        if (!more) { more = h('div', { class: 'ed-more' }); box.append(more); }
        more.textContent = '';
        more.append(num('+' + hidden, 21, { color: '#5a5a64', shadow: null }));
        more.setAttribute('aria-label', `${hidden} boş yer daha`);
      };
      setMore();
      while (more && visible.length && !sameRow(more)) {
        visible.pop().remove();
        setMore();
      }
    }

    // --------------------------------------------------------------- highlight
    function applyMarks(scroll) {
      el.querySelectorAll('.is-run,.is-call,.is-fail,.is-hint').forEach((n) => n.classList.remove('is-run', 'is-call', 'is-fail', 'is-hint'));
      let first = null;
      for (const kind of ['call', 'fail', 'hint', 'run']) {
        const k = marks[kind];
        if (!k) continue;
        const node = el.querySelector(`[data-path="${k}"]:not(.ed-count):not(.ed-cond):not(.ed-head)`) || el.querySelector(`[data-seq="${k}"]`);
        if (node) {
          node.classList.add('is-' + kind);
          if (kind !== 'call') first = node;
        }
      }
      if (scroll && first) {
        // a container (loop / check events): keep its head row in view, not the whole (maybe taller) box
        const row = first.classList.contains('ed-box') ? first.querySelector(':scope > .ed-row') : null;
        scrollNear(row || first);
      }
    }
    // Scroll the nearest scrolling ancestor so the target is fully visible, with a margin for the glow/outline.
    function scrollNear(target) {
      let sc = el.parentElement;
      while (sc && sc !== document.body) {
        const oy = getComputedStyle(sc).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && sc.scrollHeight > sc.clientHeight + 1) break;
        sc = sc.parentElement;
      }
      if (!sc || sc === document.body || !target.getBoundingClientRect) return;
      const M = 12;
      const r = target.getBoundingClientRect();
      const b = sc.getBoundingClientRect();
      if (r.height + 2 * M > b.height || r.top - M < b.top) sc.scrollTop += r.top - b.top - M;
      else if (r.bottom + M > b.bottom) sc.scrollTop += r.bottom - b.bottom + M;
    }
    function highlight(path, opt) {
      if (path == null && !opt) marks = { run: null, call: null, fail: null, hint: null };
      else {
        const kind = (opt && opt.kind) || 'run';
        marks[kind] = path ? keyOf(path) : null;
        if (kind === 'run') marks.call = opt && opt.call ? keyOf(opt.call) : null;
      }
      applyMarks(true);
    }

    // --------------------------------------------------------------- editing
    function changed(type) {
      marks = { run: null, call: null, fail: null, hint: null };
      render();
      const f = el.querySelector('.ed-frame');
      if (f) scrollNear(f);
      if (o.onChange) o.onChange(program(), { type });
    }

    function insertAtom(op) {
      if (ro || locked || dead) return false;
      if (!MC.paletteInfo[op]) return false;
      const node = makeNode(op, conds);
      const isCall = FUNCS.includes(op);
      if (isCall) {
        // calls live in main only (no calls inside a recipe)
        if (sel && sel[0] !== 'main') sel = null;
        active = 'main';
      }
      if (sel) {
        const old = nodeAt(prog, sel);
        const repl = replaceNode(node, old, conds);
        const after = total() - sizeOf(old) + sizeOf(repl);
        const emptyBox = !!COMPOUND[kindOf(repl)] && !repl.do.length;
        // a new empty container needs room for at least one block, or it could never be filled
        if (max != null && (after > max || (emptyBox && after >= max))) return 'full';
        const seq = sel.slice(0, -1);
        const i = sel[sel.length - 1];
        listAt(prog, seq)[i] = repl;
        active = sel[0];
        sel = null;
        // the frame goes back to the end of the strip (no "hole" mid-program); an empty new container is filled first
        cur[active] = emptyBox ? { seq: seq.concat(i, 'do'), index: 0 } : { seq: [active], index: (prog[active] || []).length };
        changed('replace');
        return true;
      }
      if (max != null && total() + sizeOf(node) > max) return 'full';
      const c = cur[active] || { seq: [active], index: (prog[active] || []).length };
      const list = listAt(prog, c.seq);
      if (!list) return false;
      list.splice(c.index, 0, node);
      if (COMPOUND[kindOf(node)]) cur[active] = { seq: c.seq.concat(c.index, 'do'), index: 0 };
      else cur[active] = { seq: c.seq, index: c.index + 1 };
      changed('insert');
      return true;
    }

    function del() {
      if (ro || locked || dead) return false;
      if (sel) {
        const seq = sel.slice(0, -1);
        const i = sel[sel.length - 1];
        listAt(prog, seq).splice(i, 1);
        active = sel[0];
        cur[active] = { seq, index: i };
        sel = null;
        changed('delete');
        return true;
      }
      const c = cur[active];
      const list = c && listAt(prog, c.seq);
      if (!list) return false;
      if (c.index > 0) {
        list.splice(c.index - 1, 1);
        c.index--;
      } else if (c.seq.length > 1) {
        const cpath = c.seq.slice(0, -1);
        const box = nodeAt(prog, cpath);
        const lanesEmpty = box && !(box.do || []).length && !(box.else || []).length;
        if (lanesEmpty) {
          listAt(prog, cpath.slice(0, -1)).splice(cpath[cpath.length - 1], 1);
          cur[active] = { seq: cpath.slice(0, -1), index: cpath[cpath.length - 1] };
        } else if (list.length) {
          list.splice(0, 1);
        } else {
          // empty "değilse" lane of a filled container: step out instead of deleting his work
          cur[active] = { seq: cpath.slice(0, -1), index: cpath[cpath.length - 1] + 1 };
          render();
          return false;
        }
      } else if (list.length) {
        list.splice(0, 1);
      } else return false;
      changed('delete');
      return true;
    }

    function select(path) {
      if (ro || dead) return;
      sel = path ? path.slice() : null;
      if (sel) {
        active = sel[0];
        cur[active] = { seq: sel.slice(0, -1), index: sel[sel.length - 1] + 1 };
      }
      render();
    }

    function activate(s, toEnd) {
      if (!strips().includes(s)) return;
      active = s;
      sel = null;
      if (toEnd || !cur[s]) cur[s] = { seq: [s], index: (prog[s] || []).length };
      render();
    }

    function cycleCount(path) {
      const node = nodeAt(prog, path);
      if (!node || node.rep == null) return;
      node.rep = node.rep >= 9 ? 2 : node.rep + 1;
      say(`${node.rep} kez`);
      sfx('tap');
      changed('count');
    }
    function cycleCond(path) {
      const node = nodeAt(prog, path);
      if (!node || typeof node !== 'object') return;
      const key = node.until != null ? 'until' : 'if';
      const list = condsFor(key, conds);
      const i = list.indexOf(node[key]);
      const next = list[(i + 1) % list.length];
      const didChange = next !== node[key];
      node[key] = next;
      say(MC.condSay(next, key === 'until' ? 'until' : 'if'));
      sfx('tap');
      if (didChange) changed('cond');
      else render();
    }

    // --------------------------------------------------------------- taps (event delegation)
    function onClick(e) {
      if (ro || locked || dead) return;
      const t = e.target.closest('[data-act]');
      if (!t || !el.contains(t)) {
        const st = e.target.closest('[data-strip]');
        if (st && el.contains(st) && st.dataset.strip !== active) {
          activate(st.dataset.strip, false);
          say(st.dataset.strip === 'main' ? 'Program' : 'Tarif ' + st.dataset.strip);
          if (o.onTap) o.onTap('strip', st.dataset.strip);
        }
        return;
      }
      const act = t.dataset.act;
      if (act === 'blk' || act === 'head') {
        const path = parseKey(t.dataset.path);
        if (sel && keyOf(sel) === keyOf(path)) { sel = null; render(); sfx('tap'); }
        else {
          select(path);
          sfx('tap');
          say(nodeSay(nodeAt(prog, path)));
        }
      } else if (act === 'count') cycleCount(parseKey(t.dataset.path));
      else if (act === 'cond') cycleCond(parseKey(t.dataset.path));
      else if (act === 'slot') {
        const seq = parseKey(t.dataset.seq);
        const list = listAt(prog, seq);
        active = seq[0];
        sel = null;
        cur[active] = { seq, index: list ? list.length : 0 };
        render();
        sfx('tap');
      } else if (act === 'frame') {
        if (sel) { sel = null; render(); }
      } else if (act === 'strip') {
        const s = t.dataset.strip;
        activate(s, false);
        say(s === 'main' ? 'Program' : 'Tarif ' + s);
        sfx('tap');
      }
      if (o.onTap) o.onTap(act, t.dataset.path || t.dataset.seq || t.dataset.strip || null);
    }
    el.addEventListener('click', onClick);

    function target(name) {
      if (name === 'count') return el.querySelector('.ed-count');
      if (name === 'cond') return el.querySelector('.ed-cond');
      if (name === 'frame') return el.querySelector('.ed-frame');
      if (name && name.startsWith('strip:')) {
        const s = name.slice(6);
        return el.querySelector(`.ed-strip-head[data-strip="${s}"]`) || el.querySelector(`.ed-strip[data-strip="${s}"]`);
      }
      if (name && name.startsWith('path:')) return el.querySelector(`[data-path="${name.slice(5)}"]`);
      return null;
    }

    set(o.program || []);

    return {
      el,
      program,
      set,
      highlight,
      insertAtom,
      del,
      remove: del,
      size: total,
      isFull,
      select,
      deselect() { sel = null; render(); },
      selected: () => (sel ? sel.slice() : null),
      activate,
      active: () => active,
      target,
      lock(v) { locked = !!v; el.classList.toggle('is-locked', locked); },
      nodeSay,
      destroy() {
        dead = true;
        el.removeEventListener('click', onClick);
        el.remove();
      },
    };
  }

  function render(program, opts) {
    const ed = create(null, { program, readonly: true, size: (opts && opts.size) || 'sm' });
    return ed.el;
  }

  // Pre-order reveal of a program, block by block: [{prog, path, node}] (used by "Çözümü göster").
  function revealSteps(program, funcs) {
    const sol = MC.norm(clone(program));
    const curP = { main: [] };
    for (const f of funcs || []) curP[f] = [];
    const out = [];
    const walk = (nodes, target, prefix) => {
      (nodes || []).forEach((n, i) => {
        if (typeof n === 'string') {
          target.push(n);
          out.push({ prog: clone(curP), path: prefix.concat(i), node: n });
        } else {
          const shell = Object.assign({}, n, { do: [] });
          if (n.else) shell.else = [];
          target.push(shell);
          out.push({ prog: clone(curP), path: prefix.concat(i), node: clone(n) });
          walk(n.do, shell.do, prefix.concat(i, 'do'));
          if (n.else) walk(n.else, shell.else, prefix.concat(i, 'else'));
        }
      });
    };
    for (const s of (funcs || []).concat('main')) {
      if (!curP[s]) curP[s] = [];
      walk(sol[s], curP[s], [s]);
    }
    return out;
  }

  MC.editor = { create, render, revealSteps, nodeSay: (n) => nodeSay(n), util: { h, icon, num, say, sfx, note, wait, keyOf, parseKey } };
})();

/* ==== app/60-meta.js ==== */
// Blokcraft — Win screen, Köyüm (village), Zırhlar (skins), Sandık (chest).
// Praise is always about the process ("Adım adım düşündün!"), never "zekisin". Nothing auto-advances.
(function () {
  const MC = globalThis.MC;
  MC.screens = MC.screens || {};

  const ITEM_NAME = {
    diamond: 'Elmas', emerald: 'Zümrüt', apple: 'Elma', gold: 'Altın', key: 'Anahtar', wood: 'Odun', cobble: 'Taş', coal: 'Kömür',

  // ================================================================== WIN
  // Process praise; a few variants per kind, picked by level number so it does not repeat on every level.
  const PRAISE = {
    shown: ['Birlikte başardık! İstersen kendin de dene.'],
    predict: ['Kafanda adım adım izledin!', 'Emir\'in yolunu önceden gördün!', 'Adımları tek tek saydın!'],
    choose: ['Programları dikkatle karşılaştırdın!', 'Her programı tek tek düşündün!', 'Doğru programı seçtin!'],
    order: ['Sırayı doğru düşündün!', 'Önce ne gelir, iyi düşündün!', 'Adımları sıraya koydun!'],
    fix: ['Hatayı buldun ve düzelttin!', 'Yanlış bloğu yakaladın!', 'Programı onardın!'],
    func: ['Tarif yazdın, işi böldün!', 'Tarifle işi kısalttın!', 'İşi parçalara ayırdın!'],
    cond: ['Doğru kararı verdin, çok temiz!', 'Emir\'e bakmayı öğrettin!', 'Koşulu doğru seçtin!'],
    rep: ['Tekrarla ile işi kısalttın!', 'Tekrarı fark ettin!', 'Döngüyle kısa yazdın!'],
    short: ['Kısa ve temiz bir program!', 'Her adımı doğru seçtin!', 'Yolu önceden düşündün!', 'Tam gereken kadar blok!'],
    longer: ['Başardın! Daha kısası da var, dener misin?', 'Bitti! Daha az blokla da olur, dener misin?'],
    plain: ['Adım adım düşündün!', 'Denedin ve başardın!', 'Sabırla çalıştın!'],
  };
  const pick = (list, n) => list[(Number(n) || 0) % list.length];
  function praiseFor(level, p, best) {
    const type = (level && level.type) || 'build';
    const n = p.n;
    const prog = best && best.program;
    const uses = prog ? MC.uses(prog) : new Set();
    if (p.solutionShown) return PRAISE.shown[0];
    if (type !== 'build' && PRAISE[type]) return pick(PRAISE[type], n);
    if (p.par != null && p.size != null && p.size <= p.par) {
      if (uses.has('A') || uses.has('B')) return pick(PRAISE.func, n);
      if (uses.has('until') || uses.has('if') || uses.has('ifelse')) return pick(PRAISE.cond, n);
      if (uses.has('rep')) return pick(PRAISE.rep, n);
      return pick(PRAISE.short, n);
    }
    if (p.par != null && p.size != null && p.size > p.par) return pick(PRAISE.longer, n);
    return pick(PRAISE.plain, n);
  }

  /** Which of the three stars (fixed meanings, CONTRACT §7) this run earned → [solved, ownWay, third]. */
  function starFlags(type, p, stars) {
    if (stars <= 0) return [false, false, false];
    const shortType = type === 'build' || type === 'fix';
    let own = p.solutionShown != null ? !p.solutionShown : null;
    let third = null;
    if (shortType && p.size != null && p.par != null) third = p.size <= p.par;
    else if (!shortType && p.firstTry != null) third = !!p.firstTry;
    const rest = stars - 1; // stars beyond "solved"
    if (own == null && third == null) {
      own = rest >= 1;
      third = rest >= 2;
    } else if (own == null) own = rest - (third ? 1 : 0) >= 1;
    else if (third == null) third = rest - (own ? 1 : 0) >= 1;
    return [true, own, third];
  }
  MC.winStarFlags = starFlags; // (tests / QA)

  // Confetti of tiny blocks over the whole screen (cosmetic; Math.random is fine in the app). Returns stop().
  function confetti(ms) {
    if (MC.gfx.reduceMotion() || typeof document === 'undefined') return () => {};
    const cv = h('canvas', { class: 'fx-confetti', 'aria-hidden': 'true' });
    document.body.appendChild(cv);
    const dpr = Math.min(2, Math.max(1, globalThis.devicePixelRatio || 1));
    const W = globalThis.innerWidth || 412, H = globalThis.innerHeight || 915;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    const x = cv.getContext('2d');
    const COLS = ['#ffd23f', '#5fd85f', '#3fc8e8', '#ff6a3d', '#b070f0', '#ffffff', '#2aa84a'];
    const bits = Array.from({ length: 90 }, () => ({
      x: Math.random() * W, y: -Math.random() * H * 0.9 - 10, vx: (Math.random() - 0.5) * 40, vy: 70 + Math.random() * 110,
      s: 5 + Math.round(Math.random() * 5), c: COLS[(Math.random() * COLS.length) | 0], r: Math.random() * 6, vr: (Math.random() - 0.5) * 5,
    }));
    const t0 = performance.now();
    let last = t0, raf = 0, dead = false;
    const stop = () => { if (dead) return; dead = true; cancelAnimationFrame(raf); cv.remove(); };
    const tick = (t) => {
      if (dead) return;
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      const age = t - t0;
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.clearRect(0, 0, W, H);
      x.globalAlpha = age > ms - 800 ? Math.max(0, (ms - age) / 800) : 1;
      for (const b of bits) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.r += b.vr * dt;
        if (b.y > H + 12 && age < ms - 1500) { b.y = -12; b.x = Math.random() * W; }
        x.save();
        x.translate(b.x, b.y);
        x.rotate(b.r);
        x.fillStyle = b.c;
        x.fillRect(-b.s / 2, -b.s / 2, b.s, b.s);
        x.fillStyle = 'rgba(0,0,0,0.25)';
        x.fillRect(-b.s / 2, b.s / 2 - 2, b.s, 2);
        x.restore();
      }
      if (age >= ms) stop();
      else raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return stop;
  }
  let fxStop = [];

  let winTimers = [];
  MC.screens.win = {
    mount(root, params) {
      const p = params || {};
      const n = Number(p.n) || 1;
      const lv = MC.getLevel(n);
      const L = lv ? MC.parse(lv) : null;
      const stars = clamp(Math.round(Number(p.stars) || 0), 0, 3);
      const prevStars = p.prev && typeof p.prev === 'object' ? p.prev.stars || 0 : Number(p.prev) || 0;
      const newStars = Math.max(0, stars - prevStars);
      const total = MC.store.totalStars();
      const before = Math.max(0, total - newStars);
      const w = Math.ceil(n / 10);
      const isBoss = n % 10 === 0;
      const best = MC.store.best(n);
      const par = p.par != null ? p.par : L ? L.par : null;
      const info = Object.assign({}, p, { n, stars, par });
      const reduce = MC.gfx.reduceMotion();
      MC.audio.setBiome(MC.gfx.biomeOf(w));
      // the ending: level 100 cleared for the first time
      const finale = n === 100 && !!p.firstClear;

      const body = h('div', { class: 'win-body' + (finale ? ' is-finale' : '') });
      root.appendChild(body);

      // head
      body.appendChild(h('div', { class: 'win-head' },
        h('h1', { class: 'win-title', 'data-autofocus': '' }, finale ? 'Ender Ejderhası yenildi!' : isBoss ? MC.gfx.mixed(`Dünya ${w} tamam!`, 35, { color: '#ffff55', shadow: '#3f3f15' }) : 'Bölüm tamam!'),
        h('p', { class: 'win-sub', 'aria-label': lv ? `${n}. ${lv.name}` : `Bölüm ${n}` }, MC.gfx.ptext(`${n}.`, 14, { shadow: '#000' }), h('span', null, lv ? lv.name : 'Bölüm'))));
      if (finale && MC.gfx.has('dragon')) {
        // the dragon flies off, beaten; Emir cheers below (win-reward)
        body.appendChild(h('div', { class: 'win-finale', 'aria-hidden': 'true' },
          h('span', { class: 'win-finale-dragon' }, MC.gfx.icon('dragon', 192, { fit: true, crisp: true, anim: !reduce }))));
      }

      // stars with fixed, visible meanings
      const type = (L && L.type) || 'build';
      const shortType = type === 'build' || type === 'fix';
      const lit = starFlags(type, info, stars);
      const caps = ['Bitirdin', 'Kendin çözdün', shortType ? 'En kısa program' : 'İlk denemede'];
      const says = ['Birinci yıldız: bölümü bitirdin.', 'İkinci yıldız: çözümü açmadan bitirdin.', shortType ? 'Üçüncü yıldız: en kısa programı yazdın.' : 'Üçüncü yıldız: ilk denemede buldun.'];
      const starRow = h('div', { class: 'win-stars' });
      const starEls = caps.map((c, i) => {
        const ic = MC.gfx.icon('ui.star.empty', i === 1 ? 88 : 72);
        const el = h('button', { class: 'win-star', type: 'button', 'aria-label': says[i] + (lit[i] ? '' : ' Bu sefer yok.') }, ic, h('span', { class: 'win-star-cap' }, c));
        MC.ui.tap(el, () => {
          MC.audio.sfx('tap');
          MC.ui.say(lit[i] ? says[i] : `${says[i]} Bu sefer yok.`);
        });
        starRow.appendChild(el);
        return { el, ic };
      });
      body.appendChild(starRow);

      // replay with fewer stars: the best is kept
      const keptBest = prevStars > stars;
      if (keptBest) {
        body.appendChild(h('div', { class: 'win-best', role: 'img', 'aria-label': `En iyin: ${prevStars} yıldız. Yıldızların duruyor.` },
          h('span', null, 'En iyin:'), MC.ui.stars(prevStars, 24)));
      }

      // unlock banners (built now, so their space is reserved from the start)
      const banners = [];
      const newSkins = MC.gfx.skins().filter((s) => (s.stars || 0) > 0 && s.stars > before && s.stars <= total);
      for (const s of newSkins) {
        const wear = MC.ui.button({ label: 'Giy', size: 'sm', variant: 'primary', onTap: () => {
          MC.store.setSkin(s.id);
          MC.ui.say(`${s.name} zırhını giydin!`);
          wear.disabled = true;
        } });
        banners.push({ icon: () => MC.gfx.icon('hero.D', 40, { overrides: s.map || {} }), text: `Yeni zırh: ${s.name}!`, short: s.name, extra: wear, say: `Yeni zırh açıldı: ${s.name}!` });
      }
      if (isBoss && p.firstClear) {
        const name = BUILDINGS[w - 1];
        banners.push({ icon: () => (MC.gfx.has('bld.' + w) ? MC.gfx.icon('bld.' + w, 48, { fit: true }) : MC.gfx.icon('ui.village', 40)), text: `Köyüne yeni yapı: ${name}!`, short: name, say: `Köyüne yeni yapı geldi: ${name}!` });
      }
      for (const d of DECOS) {
        if (d.stars > before && d.stars <= total) {
          const sp = MC.gfx.has(d.sprite) ? d.sprite : d.alt;
          banners.push({ icon: () => (sp && MC.gfx.has(sp) ? MC.gfx.icon(sp, 40, { fit: true }) : MC.gfx.icon('ui.village', 40)), text: `Köyüne süs: ${d.name}!`, short: d.name, say: `Köyüne süs geldi: ${d.name}!` });
        }
      }
      const compact = banners.length >= 2;

      // Emir cheering + the level's prize (it goes into the chest on the first clear)
      const rewardName = p.reward || (lv && lv.reward);
      const hasReward = !!rewardName && MC.gfx.has('it.' + rewardName);
      const heroName = MC.gfx.has('hero.cheer') ? 'hero.cheer' : 'hero.D';
      const hero = h('span', { class: 'win-hero', 'aria-hidden': 'true' }, MC.gfx.icon(heroName, compact ? 44 : 60, { crisp: true, anim: !reduce }));
      body.appendChild(h('div', { class: 'win-reward' + (compact ? ' is-compact' : ''), role: hasReward ? 'img' : null, 'aria-label': hasReward ? `Ödül: ${ITEM_NAME[rewardName] || rewardName}` : null },
        hero,
        hasReward ? h('span', { class: 'win-prize' }, h('span', { class: 'win-rays' }), MC.gfx.icon('it.' + rewardName, compact ? 56 : 80, { crisp: true })) : null));

      // praise
      const praise = finale ? '100 bölümü adım adım bitirdin!' : praiseFor(lv, info, best);
      const listen = MC.ui.button({ icon: 'ui.listen', size: 'sm', title: 'Dinle', fallback: '♪', className: 'needs-speech', sfx: false, onTap: () => MC.ui.say(praise) });
      body.appendChild(h('div', { class: 'panel panel-paper win-praise' }, h('p', { class: 'say-text' }, praise), listen));

      // items that went into the chest on this first clear (collected items + the level's prize)
      const lastRec = MC.store.lastRecord && MC.store.lastRecord.n === n ? MC.store.lastRecord : null;
      const itemSrc = Object.assign({}, p.items && typeof p.items === 'object' ? p.items : lastRec ? lastRec.added : {});
      if (hasReward && lastRec && lastRec.added && lastRec.added[rewardName] && !itemSrc[rewardName]) itemSrc[rewardName] = lastRec.added[rewardName];
      const items = Object.entries(itemSrc).filter(([, c]) => c > 0);
      if (p.firstClear && items.length) {
        const row = h('div', { class: 'panel panel-stone win-items' }, h('span', { class: 'hint-line' }, 'Sandığa eklendi:'));
        for (const [k, c] of items) row.appendChild(h('span', { class: 'chip', title: ITEM_NAME[k] || k, 'aria-label': `${ITEM_NAME[k] || k} ${c}` }, MC.gfx.icon('it.' + k, 32), MC.gfx.ptext('×' + c, 21, { shadow: '#000' })));
        body.appendChild(row);
      }

      // banners: laid out now but invisible, revealed one by one → nothing below them moves
      const bannerWrap = h('div', { class: 'win-banners' + (compact ? ' is-compact' : '') });
      for (const b of banners) {
        b.el = compact
          ? h('div', { class: 'panel panel-wood win-unlock win-tile is-waiting', 'aria-label': b.text }, b.icon(), h('span', { class: 'win-tile-name' }, b.short), b.extra || null)
          : h('div', { class: 'panel panel-wood win-unlock is-waiting' }, b.icon(), h('p', { class: 'say-text' }, b.text), b.extra || null);
        bannerWrap.appendChild(b.el);
      }
      if (banners.length) body.appendChild(bannerWrap);

      // actions (never auto-advance)
      const next = n + 1;
      const nextExists = next <= 100 && !!MC.getLevel(next);
      const goNext = () => {
        if (isBoss && p.firstClear) return MC.ui.show('village', { built: w, next: nextExists ? next : null, finale });
        if (nextExists) return MC.ui.show('level', { n: next });
        MC.ui.show('map', { focus: n, from: n });
      };
      const devam = MC.ui.button({ icon: 'ui.next', label: 'Devam', size: 'lg', variant: 'primary', sfx: 'door', onTap: goNext });
      const again = MC.ui.button({ icon: 'ui.reset', label: 'Tekrar', size: 'md', variant: 'stone', onTap: () => MC.ui.show('level', { n }) });
      const toMap = MC.ui.button({ icon: 'ui.home', label: 'Harita', size: 'md', variant: 'wood', onTap: () => MC.ui.show('map', { focus: n, from: n }) });
      // the finale stays calm: Devam (to the finished village) and Harita only
      const actions = h('div', { class: 'win-actions' }, devam, finale ? h('div', { class: 'win-row win-row--one' }, toMap) : h('div', { class: 'win-row' }, again, toMap));
      body.appendChild(actions);

      // choreography: fanfare → earned stars one by one → praise → unlocks
      const T = (ms, fn) => winTimers.push(setTimeout(fn, ms));
      const gap = reduce ? 120 : 480;
      T(80, () => MC.audio.sfx('win'));
      if (finale) {
        T(60, () => fxStop.push(confetti(9000)));
        T(300, () => MC.ui.say('Ender Ejderhası yenildi!'));
      }
      let k = 0;
      for (let i = 0; i < 3; i++) {
        if (!lit[i]) continue;
        const j = k++;
        T(500 + j * gap, () => {
          MC.gfx.repaint(starEls[i].ic, 'ui.star');
          starEls[i].el.classList.add('lit');
          MC.audio.sfx('star', { i: j });
        });
      }
      const afterStars = 500 + k * gap + 150;
      T(afterStars, () => {
        if (finale) MC.speech.say(praise, { interrupt: false });
        else MC.ui.say(praise);
        if (keptBest) MC.speech.say('Yıldızların duruyor.', { interrupt: false });
      });
      banners.forEach((b, i) => {
        T(afterStars + 300 + i * 500, () => {
          b.el.classList.remove('is-waiting');
          // scroll only when the banner hides behind the sticky buttons, and never so far that the title leaves
          try {
            const r = b.el.getBoundingClientRect();
            const limit = actions.getBoundingClientRect().top - 8;
            const room = Math.max(0, body.querySelector('.win-title').getBoundingClientRect().top - 8);
            const dy = Math.min(r.bottom - limit, room);
            if (dy > 4) globalThis.scrollBy({ top: dy, behavior: reduce ? 'auto' : 'smooth' });
          } catch (e) {
            /* old browsers */
          }
          MC.audio.sfx('unlock');
          MC.speech.say(b.say, { interrupt: false });
        });
      });
    },
    unmount() {
      winTimers.forEach(clearTimeout);
      winTimers = [];
      fxStop.forEach((f) => f());
      fxStop = [];
    },
  };

  // ================================================================== VILLAGE
  const VW = 144;
  const VH = 306;
  const SLOT = [[36, 284], [108, 284], [36, 232], [108, 232], [36, 180], [108, 180], [36, 128], [108, 128], [36, 76], [108, 76]];

  function drawVillage(cv, total, doneWorlds) {
    cv.width = VW;
    cv.height = VH;
    const x = cv.getContext('2d');
    x.imageSmoothingEnabled = false;
    // sky
    const sky = ['#62aee8', '#78bcef', '#90caf4'];
    sky.forEach((c, i) => {
      x.fillStyle = c;
      x.fillRect(0, i * 8, VW, 8);
    });
    x.fillStyle = '#fff6b0';
    x.fillRect(118, 5, 12, 12);
    x.fillStyle = '#ffffff';
    x.fillRect(14, 8, 26, 5);
    x.fillRect(20, 5, 12, 3);
    x.fillRect(70, 12, 20, 4);
    // grass
    const floorName = ['floor.village', 'floor.plains'].find((n) => MC.gfx.has(n));
    x.fillStyle = '#6aad3d';
    x.fillRect(0, 24, VW, VH - 24);
    if (floorName) {
      x.fillStyle = x.createPattern(MC.gfx.canvas(floorName, 0, null), 'repeat');
      x.fillRect(0, 24, VW, VH - 24);
    }
    x.fillStyle = '#4f8a2f';
    x.fillRect(0, 24, VW, 2);
    // roads
    const pathName = ['path.village', 'path.plains'].find((n) => MC.gfx.has(n));
    const road = (rx, ry, rw, rh) => {
      x.fillStyle = 'rgba(0,0,0,0.25)';
      x.fillRect(rx - 1, ry - 1, rw + 2, rh + 2);
      x.fillStyle = '#b89a5e';
      x.fillRect(rx, ry, rw, rh);
      if (pathName) {
        x.fillStyle = x.createPattern(MC.gfx.canvas(pathName, 0, null), 'repeat');
        x.fillRect(rx, ry, rw, rh);
      }
    };
    road(66, 28, 12, VH - 28);
    for (const [, by] of SLOT.filter((_, i) => i % 2 === 0)) road(8, by + 2, VW - 16, 6);

    // everything that stands: buildings + decorations, drawn by their bottom line
    const things = [];
    SLOT.forEach(([cx, by], i) => {
      const w = i + 1;
      const name = 'bld.' + w;
      const def = MC.gfx.def(name);
      if (doneWorlds[w]) {
        if (def) things.push({ by, draw: () => MC.gfx.draw(x, name, Math.round(cx - def.w / 2), by - def.h, 1, 0, null) });
        else things.push({ by, draw: () => { x.fillStyle = '#b08850'; x.fillRect(cx - 16, by - 24, 32, 24); x.fillStyle = '#7a5230'; x.fillRect(cx - 18, by - 30, 36, 8); } });
      } else {
        const ghost = def ? MC.gfx.ghost(name, { line: 'rgba(255,255,255,0.55)', fill: 'rgba(255,255,255,0.07)' }) : null;
        things.push({ by: by - 1000, draw: () => {
          if (ghost) x.drawImage(ghost, Math.round(cx - def.w / 2), by - def.h);
          else {
            x.strokeStyle = 'rgba(255,255,255,0.8)';
            x.setLineDash([2, 2]);
            x.strokeRect(cx - 17.5, by - 29.5, 35, 29);
            x.setLineDash([]);
          }
        } });
      }
    });
    for (const d of DECOS) {
      if (total < d.stars) continue;
      const sp = MC.gfx.has(d.sprite) ? d.sprite : d.alt && MC.gfx.has(d.alt) ? d.alt : null;
      if (!sp) continue;
      const def = MC.gfx.def(sp);
      if (d.row) {
        for (let fx = 0; fx < VW; fx += def.w) if (fx + def.w <= 60 || fx >= 84) things.push({ by: d.row, draw: () => MC.gfx.draw(x, sp, fx, d.row - def.h, 1, 0, null) });
        continue;
      }
      for (const [sx, sy] of d.spots) {
        const big = def.w > 16 || def.h > 24;
        const sc = big ? 1 : 1;
        things.push({ by: sy, draw: () => {
          x.fillStyle = 'rgba(0,0,0,0.2)';
          x.fillRect(Math.round(sx - 6), sy - 2, 12, 2);
          MC.gfx.draw(x, sp, Math.round(sx - (def.w * sc) / 2) + (def.ax || 0), sy - def.h + (def.ay || 0), sc, 0, null);
        } });
      }
    }
    things.sort((a, b) => a.by - b.by).forEach((t) => t.draw());
  }

  let villageTimers = [];
  let villageFx = [];
  MC.screens.village = {
    mount(root, params) {
      const p = params || {};
      const total = MC.store.totalStars();
      const done = {};
      for (let w = 1; w <= 10; w++) done[w] = MC.store.worldDone(w);
      const allDone = Object.values(done).every(Boolean);
      MC.audio.setBiome('village');
      root.appendChild(barWithBack('Köyüm'));
      const body = h('div', { class: 'sub-body' });
      root.appendChild(body);

      // celebration after a world boss
      let celebrate = null;
      if (p.built) {
        const name = BUILDINGS[p.built - 1];
        const next = p.next;
        const go = MC.ui.button({
          icon: 'ui.next', label: next ? 'Devam' : 'Haritaya dön', size: 'lg', variant: 'primary', sfx: 'door',
          // back to the map first: Emir walks on, the new world's sign lights up and is introduced
          onTap: () => MC.ui.show('map', next ? { focus: next, from: p.built * 10, newWorld: p.built + 1 } : { focus: p.built * 10, from: p.built * 10 }),
        });
        // after the scene in the DOM so it sticks to the bottom while the new building is in view
        celebrate = p.finale
          ? h('div', { class: 'panel panel-wood v-celebrate v-finale' }, h('p', { class: 'say-text' }, 'Köyün tamamlandı!'), h('p', { class: 'v-finale-sub' }, `${name} geldi. Her dünyayı adım adım bitirdin!`), go)
          : h('div', { class: 'panel panel-wood v-celebrate' }, h('p', { class: 'say-text' }, `Yeni yapı: ${name}!`), go);
        villageTimers.push(setTimeout(() => {
          MC.audio.sfx('unlock');
          MC.ui.say(p.finale ? `${name} geldi! Köyün tamamlandı! Her dünyayı adım adım bitirdin!` : `Köyüne yeni yapı geldi: ${name}!`);
          if (p.finale) villageFx.push(confetti(8000));
        }, 400));
      } else {
        villageTimers.push(setTimeout(() => MC.ui.say(allDone ? 'Köyüm. Köyün tamamlandı!' : 'Köyüm'), 150));
      }

      // scene
      const avail = Math.min((root.clientWidth || 412) - 32, 520);
      const scale = avail / VW;
      const scene = h('div', { class: 'village-scene', style: { width: Math.round(VW * scale) + 'px', height: Math.round(VH * scale) + 'px' } });
      const cv = h('canvas', { class: 'village-cv', 'aria-hidden': 'true' });
      drawVillage(cv, total, done);
      if (allDone) {
        // the finished village: a banner over the sky
        scene.appendChild(h('div', { class: 'v-done-banner', role: 'img', 'aria-label': 'Köyün tamamlandı!' }, MC.gfx.icon('ui.star', 22), h('span', null, 'Köy tamam!'), MC.gfx.icon('ui.star', 22)));
      }
      cv.style.width = Math.round(VW * scale) + 'px';
      cv.style.height = Math.round(VH * scale) + 'px';
      scene.appendChild(cv);
      SLOT.forEach(([cx, by], i) => {
        const w = i + 1;
        const name = BUILDINGS[i];
        const world = MC.getWorld(w);
        const cond = `${world ? world.name : 'Dünya ' + w} bitince gelir.`;
        const el = h('button', {
          class: 'vslot' + (done[w] ? '' : ' locked') + (p.built === w ? ' new' : ''),
          type: 'button',
          'aria-label': done[w] ? name : `${name}: ${cond}`,
          style: { left: Math.round((cx - 26) * scale) + 'px', top: Math.round((by - 44) * scale) + 'px', width: Math.round(52 * scale) + 'px', height: Math.round(44 * scale) + 'px' },
        }, h('span', { class: 'vslot-tag' }, done[w] ? name : MC.gfx.ptext(`? ${w}`, 14)));
        MC.ui.tap(el, () => {
          MC.audio.sfx('tap');
          MC.ui.say(done[w] ? name : `${name}. ${cond}`);
        });
        scene.appendChild(el);
      });
      body.appendChild(scene);
      if (celebrate) {
        body.appendChild(celebrate);
        const fresh = scene.querySelector('.vslot.new');
        if (fresh) requestAnimationFrame(() => {
          const r = fresh.getBoundingClientRect();
          const y = r.top + (globalThis.scrollY || 0) - ((globalThis.innerHeight || 800) - r.height) / 2 + 60;
          globalThis.scrollTo(0, Math.max(0, y));
        });
      }

      // visible conditions
      const bList = h('div', { class: 'v-list v-one' });
      BUILDINGS.forEach((name, i) => {
        const w = i + 1;
        const world = MC.getWorld(w);
        const cond = done[w] ? 'Yapıldı' : `${world ? world.name : 'Dünya ' + w} bitince`;
        const ic = MC.gfx.has('bld.' + w) ? MC.gfx.icon('bld.' + w, 40, { fit: true }) : MC.gfx.icon('ui.village', 36);
        const el = h('button', { class: 'v-item' + (done[w] ? '' : ' locked'), type: 'button' }, ic, h('span', { class: 'v-item-text' }, h('span', { class: 'v-name' }, name), h('span', { class: 'v-cond' }, cond)));
        MC.ui.tap(el, () => MC.ui.say(done[w] ? name : `${name}. ${cond} gelir.`));
        bList.appendChild(el);
      });
      body.appendChild(h('div', { class: 'panel' }, h('h2', null, 'Yapılar'), bList));

      const dList = h('div', { class: 'v-list' });
      for (const d of DECOS) {
        const got = total >= d.stars;
        const sp = MC.gfx.has(d.sprite) ? d.sprite : d.alt && MC.gfx.has(d.alt) ? d.alt : 'ui.star';
        const el = h('button', { class: 'v-item' + (got ? '' : ' locked'), type: 'button' }, MC.gfx.icon(sp, 36, { fit: true }),
          h('span', { class: 'v-item-text' }, h('span', { class: 'v-name' }, d.name), h('span', { class: 'v-cond' }, got ? 'Geldi' : MC.gfx.mixed(`${d.stars} yıldızda`, 14, { color: '#5a5a64', shadow: null }))));
        MC.ui.tap(el, () => MC.ui.say(got ? d.name : `${d.name}: ${d.stars} yıldızda gelir.`));
        dList.appendChild(el);
      }
      body.appendChild(h('div', { class: 'panel' }, h('h2', null, 'Süsler'), dList));
    },
    unmount() {
      villageTimers.forEach(clearTimeout);
      villageTimers = [];
      villageFx.forEach((f) => f());
      villageFx = [];
    },
  };

  // ================================================================== SKINS
  let skinTimer = 0;
  let sayTimer = 0; // screen name spoken shortly after opening Zırhlar / Sandık
  MC.screens.skins = {
    mount(root) {
      root.appendChild(barWithBack('Zırhlar'));
      const body = h('div', { class: 'sub-body' });
      root.appendChild(body);
      clearTimeout(sayTimer);
      sayTimer = setTimeout(() => MC.ui.say('Zırhlar'), 150);
      const render = () => {
        body.replaceChildren();
        const total = MC.store.totalStars();
        const worn = MC.store.skin();
        const skin = MC.gfx.skin(worn);
        // preview: Emir turns around
        const dirs = ['D', 'R', 'U', 'L'];
        const pic = MC.gfx.icon('hero.D', 88, { overrides: skin.map || {}, crisp: true });
        let k = 0;
        clearInterval(skinTimer);
        if (!MC.gfx.reduceMotion()) {
          skinTimer = setInterval(() => {
            k = (k + 1) % 8;
            const d = dirs[Math.floor(k / 2)];
            if (MC.gfx.has('hero.' + d)) MC.gfx.repaint(pic, 'hero.' + d, k % 2, skin.map || {});
          }, 450);
        }
        body.appendChild(h('div', { class: 'panel skin-hero' },
          h('div', { class: 'skin-hero-stage' }, pic),
          h('div', { class: 'skin-hero-info' },
            h('h2', { class: 'skin-hero-name' }, skin.name),
            h('p', { class: 'small-text' }, 'Şu an giydiğin zırh.'),
            h('span', { class: 'chip chip-light', style: 'align-self:flex-start;cursor:default', 'aria-label': `${total} yıldız` }, MC.gfx.icon('ui.star', 26), MC.gfx.ptext(String(total), 21, { color: '#1d1d22', shadow: null })))));

        const grid = h('div', { class: 'skin-grid' });
        for (const s of MC.gfx.skins()) {
          const open = total >= (s.stars || 0);
          const isWorn = s.id === worn;
          const state = isWorn
            ? h('span', { class: 'skin-state' }, MC.gfx.icon('ui.check', 22), 'Giyildi')
            : open
              ? h('span', { class: 'skin-state' }, 'Giy')
              : h('span', { class: 'skin-state' }, MC.gfx.icon('ui.star', 20), MC.gfx.mixed(`${s.stars} yıldızda`, 14, { color: '#1d1d22', shadow: null }));
          const card = h('button', {
            class: 'skin-card' + (isWorn ? ' is-worn' : '') + (open ? '' : ' is-locked'),
            type: 'button',
            'aria-label': open ? `${s.name}${isWorn ? ', giyildi' : ''}` : `${s.name}: ${s.stars} yıldızda açılır`,
          },
          h('span', { class: 'skin-pic' }, MC.gfx.icon('hero.D', 56, { overrides: s.map || {} })),
          h('span', { class: 'skin-name' }, s.name),
          state,
          open ? null : MC.gfx.icon('ui.lock', 28, { className: 'skin-lock' }));
          MC.ui.tap(card, () => {
            if (!open) {
              card.classList.remove('shake');
              void card.offsetWidth;
              card.classList.add('shake');
              MC.audio.sfx('tap');
              MC.ui.say(`${s.name}: ${s.stars} yıldızda açılır. Sende ${total} yıldız var.`);
              return;
            }
            if (isWorn) {
              MC.ui.say(`${s.name} zırhı üstünde.`);
              return;
            }
            MC.store.setSkin(s.id);
            MC.audio.sfx('unlock');
            MC.ui.say(`${s.name} zırhını giydin!`);
            render();
          });
          grid.appendChild(card);
        }
        body.appendChild(grid);
      };
      render();
    },
    unmount() {
      clearInterval(skinTimer);
      clearTimeout(sayTimer);
    },
  };

  // ================================================================== CHEST
  MC.screens.chest = {
    mount(root) {
      root.appendChild(barWithBack('Sandık'));
      const body = h('div', { class: 'sub-body' });
      root.appendChild(body);
      clearTimeout(sayTimer);
      sayTimer = setTimeout(() => MC.ui.say('Sandık'), 150);
      const chest = MC.store.chest;
      const keys = ITEM_ORDER.concat(Object.keys(chest).filter((k) => !ITEM_ORDER.includes(k)));
      const totalItems = Object.values(chest).reduce((a, b) => a + b, 0);
      const grid = h('div', { class: 'chest-grid' });
      for (const k of keys) {
        const c = chest[k] || 0;
        const name = ITEM_NAME[k] || k;
        const slot = h('button', { class: 'slot chest-slot' + (c ? '' : ' empty'), type: 'button', 'aria-label': c ? `${name}: ${c}` : `${name}: henüz yok` },
          MC.gfx.icon('it.' + k, 48),
          c ? h('span', { class: 'chest-count' }, MC.gfx.ptext(String(c), 21)) : null);
        MC.ui.tap(slot, () => {
          MC.audio.sfx(c ? 'pickup' : 'tap');
          MC.ui.say(c ? `${name}: ${c}` : `${name}: henüz yok.`);
        });
        grid.appendChild(slot);
      }
      const chestIc = MC.gfx.icon('ui.chest', 64);
      body.appendChild(h('div', { class: 'panel chest-panel' },
        h('div', { class: 'chest-total', 'aria-label': `Sandık: ${totalItems}` }, chestIc, h('h2', { style: 'margin:0' }, 'Sandık'), h('span', { class: 'chip', style: 'cursor:default' }, MC.gfx.ptext(String(totalItems), 21))),
        h('p', { class: 'small-text', style: 'margin:6px 0 12px' }, 'Bir bölümü ilk kez bitirince topladıkların buraya gelir.'),
        grid));
    },
    unmount() {
      clearTimeout(sayTimer);
    },
  };
})();

/* ==== app/70-parent.js ==== */
// Blokcraft — Anne-Baba köşesi: gate "7 × 8 = ?" on an on-screen keypad (no native keyboard), then
// progress per world, the answer key (board thumbnail + solution rendered as icons + hint) and settings.
(function () {
  const MC = globalThis.MC;
  MC.screens = MC.screens || {};
  const h = (...a) => MC.ui.h(...a);

  const GATE_ANSWER = '56';
  const GATE_MINUTES = 10;
  let openUntil = 0; // gate stays open for a few minutes in this session

  const CONCEPT = [
    'Sıralama: okları doğru sırayla dizmek',
    'Kazma, toplama ve tarif sırası',
    'Hata ayıklama, tahmin, doğruyu seçme',
    'Döngüler: Tekrarla bloğu',
    'Blok koyma, köprü ve iç içe döngü',
    'Fonksiyonlar: Tarif A ve B',
    'Göreli hareket: ileri, sola/sağa dön',
    'Koşullar: Eğer / değilse',
    'Olana kadar tekrarla, genelleme',
    'Karma ustalık ve en kısa program',
  ];
  const TYPE_LABEL = { build: 'Program yaz', fix: 'Hatayı düzelt', predict: 'Tahmin et', choose: 'Doğruyu seç', order: 'Sırala' };
  const INTRO_LABEL = {
    move: 'Hareket', predict: 'Tahmin', mine: 'Kazma', order: 'Sıralama', fix: 'Hata ayıklama', choose: 'Doğruyu seçme',
    rep: 'Tekrarla', rep2: 'Tekrarla (2 blok)', place: 'Blok koyma', nested: 'İç içe döngü', func: 'Tarif (fonksiyon)',
    funcB: 'İkinci tarif', rel: 'Göreli hareket', if: 'Eğer', ifelse: 'Eğer / değilse', multimap: 'Birden çok harita', until: 'Olana kadar',
  };
  const SHAPES = [['mark.circle', 'Daire'], ['mark.square', 'Kare'], ['mark.triangle', 'Üçgen']];

  // ------------------------------------------------------------------ program rendering (fallback for MC.editor.render)
  function atomEl(a) {
    const meta = (MC.paletteInfo && MC.paletteInfo[a]) || (MC.atoms && MC.atoms[a]) || { label: a };
    const icon = 'cmd.' + a;
    if (MC.gfx.has(icon)) return h('span', { class: 'prog-atom', title: meta.label, role: 'img', 'aria-label': meta.label }, MC.gfx.icon(icon, 26));
    return h('span', { class: 'prog-atom txt' }, meta.label);
  }
  function nodesEl(nodes) {
    const out = [];
    for (const n of nodes || []) {
      if (typeof n === 'string') out.push(atomEl(n));
      else if (n && n.rep != null) {
        out.push(h('span', { class: 'prog-box kind-rep' }, h('span', { class: 'prog-head' }, MC.gfx.has('cmd.rep') ? MC.gfx.icon('cmd.rep', 22) : null, `Tekrarla ${n.rep}×`), nodesEl(n.do)));
      } else if (n && n.until != null) {
        out.push(h('span', { class: 'prog-box kind-until' }, h('span', { class: 'prog-head' }, MC.gfx.has('cmd.until') ? MC.gfx.icon('cmd.until', 22) : null, MC.condSay(n.until, 'until') + ':'), nodesEl(n.do)));
      } else if (n && n.if != null) {
        out.push(h('span', { class: 'prog-box kind-if' },
          h('span', { class: 'prog-head' }, MC.gfx.has('cmd.if') ? MC.gfx.icon('cmd.if', 22) : null, MC.condSay(n.if, 'if') + ':'),
          nodesEl(n.do),
          n.else ? [h('span', { class: 'prog-else' }, 'Değilse:'), nodesEl(n.else)] : null));
      }
    }
    return out;
  }
  function renderProgram(prog) {
    if (MC.editor && typeof MC.editor.render === 'function') {
      try {
        const el = MC.editor.render(prog, { size: 'sm' });
        if (el) return el;
      } catch (e) {
        console.error(e);
      }
    }
    const q = MC.norm(prog);
    const wrap = h('div', { class: 'prog' });
    const rows = [['main', q.main]];
    if (q.A) rows.push(['A', q.A]);
    if (q.B) rows.push(['B', q.B]);
    for (const [name, nodes] of rows) {
      wrap.appendChild(h('div', { class: 'prog-row' }, name !== 'main' ? h('span', { class: 'prog-fn' }, `Tarif ${name}:`) : null, nodesEl(nodes), nodes.length ? null : h('span', { class: 'small-text' }, '(boş)')));
    }
    return wrap;
  }
  MC.renderProgramFallback = renderProgram;

  // ------------------------------------------------------------------ gate
  function mountGate(root, onPass) {
    const body = h('div', { class: 'sub-body' });
    root.appendChild(body);
    let value = '';
    const display = h('div', { class: 'gate-display', 'aria-live': 'polite', 'aria-label': 'Cevap' });
    const refresh = () => {
      display.replaceChildren(MC.gfx.ptext(value || '_', 35, { color: '#7df09a', shadow: null, label: value || 'boş' }));
    };
    refresh();
    const check = () => {
      if (value === GATE_ANSWER) {
        MC.audio.sfx('unlock');
        openUntil = Date.now() + GATE_MINUTES * 60000;
        onPass();
        return;
      }
      display.classList.remove('shake');
      void display.offsetWidth;
      display.classList.add('shake');
      value = '';
      refresh();
      MC.ui.say('Bu köşe büyükler için.');
    };
    const pad = h('div', { class: 'keypad' });
    for (const d of ['1', '2', '3', '4', '5', '6', '7', '8', '9']) {
      pad.appendChild(MC.ui.button({ label: d, size: 'md', variant: 'stone', onTap: () => { if (value.length < 3) { value += d; refresh(); } } }));
    }
    pad.appendChild(MC.ui.button({ icon: 'ui.delete', size: 'md', variant: 'wood', title: 'Sil', fallback: '←', onTap: () => { value = value.slice(0, -1); refresh(); } }));
    pad.appendChild(MC.ui.button({ label: '0', size: 'md', variant: 'stone', onTap: () => { if (value.length < 3) { value += '0'; refresh(); } } }));
    pad.appendChild(MC.ui.button({ icon: 'ui.check', size: 'md', variant: 'primary', title: 'Tamam', fallback: 'OK', onTap: check }));
    body.appendChild(h('div', { class: 'panel gate' },
      h('h2', { 'data-autofocus': '' }, 'Anne-Baba Köşesi'),
      h('p', { class: 'gate-q', 'aria-label': '7 çarpı 8 kaç?' }, MC.gfx.ptext('7 × 8 = ?', 42, { color: '#1d1d22', shadow: null })),
      display,
      pad,
      h('p', { class: 'gate-note' }, 'Bu bölüm yetişkinler için: ilerleme, cevap anahtarı ve ayarlar.')));
  }

  // ------------------------------------------------------------------ progress
  function progressView() {
    const s = MC.store;
    const wrap = h('div', { class: 'panel' });
    wrap.appendChild(h('div', { class: 'pp-summary' },
      h('div', { class: 'pp-stat' }, h('b', null, MC.gfx.ptext(`${s.totalStars()}`, 28, { color: '#1d1d22', shadow: null, label: `${s.totalStars()}` })), h('span', null, '/ 300 yıldız')),
      h('div', { class: 'pp-stat' }, h('b', null, MC.gfx.ptext(`${s.levelsDone()}`, 28, { color: '#1d1d22', shadow: null, label: `${s.levelsDone()}` })), h('span', null, '/ 100 bölüm')),
      h('div', { class: 'pp-stat' }, h('b', null, MC.gfx.ptext(`${s.currentLevel()}`, 28, { color: '#1d1d22', shadow: null, label: `${s.currentLevel()}` })), h('span', null, 'şu anki bölüm'))));
    const list = h('div', { style: 'margin-top:12px' });
    for (let w = 1; w <= 10; w++) {
      const world = MC.getWorld(w);
      const wp = s.worldProgress(w);
      const cells = h('div', { class: 'pp-cells' });
      for (let n = (w - 1) * 10 + 1; n <= w * 10; n++) {
        const b = s.best(n);
        cells.appendChild(h('span', { class: 'pp-cell' + (b ? ' s' + b.stars : ''), title: `${n}: ${b ? b.stars + ' yıldız' : 'yok'}` }));
      }
      list.appendChild(h('div', { class: 'pp-world' },
        h('div', { class: 'pp-wname' }, MC.gfx.mixed(`${w}. ${world ? world.name : 'Dünya ' + w}`, 14, { color: '#1d1d22', shadow: null }), h('small', null, CONCEPT[w - 1])),
        h('div', { class: 'pp-wstars' }, MC.gfx.icon('ui.star', 22), MC.gfx.mixed(`${wp.stars}/30 · ${wp.done}/10`, 14, { color: '#1d1d22', shadow: null })),
        cells));
    }
    wrap.appendChild(list);
    return wrap;
  }

  // ------------------------------------------------------------------ answer key
  let akWorld = 1;
  let akLevel = null;
  function answersView() {
    const wrap = h('div', { class: 'ak', style: 'display:flex;flex-direction:column;gap:12px' });
    const worldChips = h('div', { class: 'ak-chips' });
    const levelChips = h('div', { class: 'ak-chips' });
    const detail = h('div');
    const renderLevels = () => {
      levelChips.replaceChildren();
      for (let n = (akWorld - 1) * 10 + 1; n <= akWorld * 10; n++) {
        const lv = MC.getLevel(n);
        const b = MC.ui.button({
          label: String(n), size: 'sm', variant: n % 10 === 0 ? 'wood' : 'stone',
          className: (akLevel === n ? 'is-active' : '') + (lv ? '' : ' is-missing'),
          onTap: () => {
            akLevel = n;
            renderLevels();
            renderDetail();
          },
        });
        levelChips.appendChild(b);
      }
    };
    const renderWorlds = () => {
      worldChips.replaceChildren();
      for (let w = 1; w <= 10; w++) {
        worldChips.appendChild(MC.ui.button({
          label: String(w), size: 'sm', variant: 'wood', className: akWorld === w ? 'is-active' : '', title: `Dünya ${w}`,
          onTap: () => {
            akWorld = w;
            akLevel = (w - 1) * 10 + 1;
            renderWorlds();
            renderLevels();
            renderDetail();
          },
        }));
      }
    };
    const renderDetail = () => {
      detail.replaceChildren(levelDetail(akLevel || (akWorld - 1) * 10 + 1));
    };
    if (!akLevel) akLevel = (akWorld - 1) * 10 + 1;
    renderWorlds();
    renderLevels();
    renderDetail();
    wrap.appendChild(h('div', { class: 'panel' }, h('h3', null, 'Dünya'), worldChips, h('h3', { style: 'margin-top:12px' }, 'Bölüm'), levelChips));
    wrap.appendChild(detail);
    return wrap;
  }

  function levelDetail(n) {
    const lv = MC.getLevel(n);
    const box = h('div', { class: 'panel panel-paper ak-detail' });
    if (!lv) {

  // ------------------------------------------------------------------ screen
  let tab = 'progress';
  let cleanup = null;
  MC.screens.parent = {
    mount(root) {
      const bar = MC.ui.topbar({
        left: [MC.ui.button({ icon: 'ui.back', size: 'sm', title: 'Haritaya dön', fallback: '<', onTap: () => MC.ui.show('map') })],
        title: 'Anne-Baba',
        right: [MC.ui.soundToggle({ size: 'sm' })],
      });
      root.appendChild(bar);
      const inside = () => {
        [...root.children].forEach((c) => c !== bar && c.remove());
        const body = h('div', { class: 'sub-body' });
        root.appendChild(body);
        const tabs = h('div', { class: 'tabs', role: 'tablist' });
        const view = h('div');
        const TABS = [['progress', 'İlerleme'], ['answers', 'Cevaplar'], ['settings', 'Ayarlar']];
        const render = () => {
          if (cleanup) cleanup();
          cleanup = null;
          tabs.replaceChildren();
          for (const [id, label] of TABS) {
            const b = MC.ui.button({ label, size: 'sm', variant: 'wood', className: tab === id ? 'is-active' : '', onTap: () => { tab = id; render(); } });
            b.setAttribute('role', 'tab');
            b.setAttribute('aria-selected', tab === id ? 'true' : 'false');
            tabs.appendChild(b);
          }
          let v;
          if (tab === 'answers') v = answersView();
          else if (tab === 'settings') v = settingsView(render);
          else v = progressView();
          if (v._cleanup) cleanup = v._cleanup;
          view.replaceChildren(v);
        };
        body.appendChild(tabs);
        body.appendChild(view);
        render();
      };
      if (Date.now() < openUntil) inside();
      else mountGate(root, inside);
    },
    unmount() {
      if (cleanup) cleanup();
      cleanup = null;
    },
  };
})();

/* ==== app/90-boot.js ==== */
// Blokcraft — MC.ui router + DOM helpers, and the app start (CONTRACT §9b).
// Screens register MC.screens[name] = { mount(root, params), unmount?() }; MC.ui.show(name, params) swaps them.
// Starts on DOMContentLoaded (or at once if the document is already parsed) on the title screen.
(function () {
  const MC = globalThis.MC;
  MC.screens = MC.screens || {};

  const $ = (id) => document.getElementById(id);
  let current = null; // { name, screen, root, params }
  let started = false;

  // ------------------------------------------------------------------ DOM builder
  /** h(tag, attrs, ...children). attrs: class, on:{event: fn}, style (string|object), aria-*, data-*, any attribute; children: nodes, strings, arrays, null. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class' || k === 'className') el.className = v;
        else if (k === 'on') {
          for (const [ev, fn] of Object.entries(v)) {
            if (ev === 'tap') tap(el, fn);
            else el.addEventListener(ev, fn);
          }
        } else if (k === 'style') {
          if (typeof v === 'string') el.style.cssText = v;
          else for (const [p, val] of Object.entries(v)) {
            if (p.startsWith('--')) el.style.setProperty(p, val);
            else el.style[p] = val;
          }
        } else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, String(v));
      }
    }
    append(el, kids);
    return el;
  }
  function append(el, kids) {
    for (const c of kids) {
      if (c == null || c === false) continue;
      if (Array.isArray(c)) append(el, c);
      else if (c instanceof Node) el.appendChild(c);
      else el.appendChild(document.createTextNode(String(c)));
    }
  }

  // ------------------------------------------------------------------ fast tap
  /**
   * Fast tap: fires on pointerup (no 300 ms wait), ignores taps that turned into a scroll, never double-fires,
   * and still works from the keyboard (Enter/Space → click). Adds .is-pressed while held.
   */
  function tap(el, fn) {
    let id = null, sx = 0, sy = 0, lastFire = 0;
    const clear = () => {
      id = null;
      el.classList.remove('is-pressed');
    };
    const fire = (e) => {
      if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
      lastFire = Date.now();
      try {
        fn(e);
      } catch (err) {
        console.error(err);
      }
    };
    el.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      id = e.pointerId;
      sx = e.clientX;
      sy = e.clientY;
      el.classList.add('is-pressed');
    });
    el.addEventListener('pointerup', (e) => {
      if (e.pointerId !== id) return;
      const moved = Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy);
      clear();
      if (moved > 18) return;
      fire(e);
    });
    el.addEventListener('pointercancel', clear);
    el.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') clear();
    });
    el.addEventListener('click', (e) => {
      if (Date.now() - lastFire < 700) {
        e.preventDefault();
        return;
      }
      fire(e); // keyboard / assistive tech activation
    });
    return el;
  }

  // ------------------------------------------------------------------ ghost-click guard
  // tap() fires on pointerup; when that handler swaps the screen, the browser's follow-up `click` would land on
  // whatever now sits under the finger (a palette button, a star chip …). After a screen change that happens
  // during/just after a pointer gesture, the next click is swallowed in the capture phase — until a new finger
  // goes down (a real tap always starts with a pointerdown; the ghost click has none) or ~1 s has passed.
  let lastPointerUp = -1e9;
  let pointerIsDown = false;
  let ghostUntil = 0;
  document.addEventListener('pointerdown', () => { pointerIsDown = true; ghostUntil = 0; }, { capture: true });
  document.addEventListener('pointerup', () => { pointerIsDown = false; lastPointerUp = Date.now(); }, { capture: true });
  document.addEventListener('pointercancel', () => { pointerIsDown = false; }, { capture: true });
  const swallowGhost = (e) => {
    if (Date.now() > ghostUntil) return;
    ghostUntil = 0;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  };
  window.addEventListener('click', swallowGhost, { capture: true });
  /** Arm the guard when the UI changed under a finger (called by show(); also usable by screens). */
  function guardGhostClick(ms) {
    if (pointerIsDown || Date.now() - lastPointerUp < 120) ghostUntil = Date.now() + (ms || 1000);
  }

  // ------------------------------------------------------------------ speech helper
  function say(text, opts) {
    if (!text) return Promise.resolve();
    const live = $('live');
    if (live) live.textContent = text;
    return MC.speech ? MC.speech.say(text, opts) : Promise.resolve();
  }

  // ------------------------------------------------------------------ buttons
  /**
   * Blocky Minecraft-style button.
   * { icon (sprite name), label, size: 'lg'|'md'|'sm', variant: 'primary'|'stone'|'wood'|'danger'|'ghost',
   *   onTap(e), say (spoken on tap), title (accessible name for icon-only), iconPx, sfx ('tap' default, false = none), className, disabled }
   */
  function button(o) {
    o = o || {};
    const size = o.size || 'md';
    const variant = o.variant || 'stone';
    const iconPx = o.iconPx || (size === 'lg' ? 40 : size === 'sm' ? 28 : 32);
    const iconOnly = !o.label;
    const el = h('button', {
      type: 'button',
      class: `btn btn-${variant} btn-${size}${iconOnly ? ' btn-icon' : ''}${o.className ? ' ' + o.className : ''}`,
      'aria-label': iconOnly ? o.title || o.say || o.icon : o.title || null,
      title: o.title || (iconOnly ? o.say : null) || null,
      disabled: o.disabled || null,
    });
    if (o.icon) {
      const ic = MC.gfx.icon(o.icon, iconPx);
      if (ic.dataset.missing && o.fallback) el.appendChild(h('span', { class: 'btn-glyph', 'aria-hidden': 'true' }, o.fallback));
      else el.appendChild(ic);
    }
    if (o.label != null && o.label !== '') {
      const lab = String(o.label);
      if (MC.gfx.PIXEL_TEXT.test(lab)) {
        const px = size === 'lg' ? 35 : size === 'md' ? 28 : 21;
        el.appendChild(h('span', { class: 'btn-label btn-num' }, MC.gfx.ptext(lab, px)));
        if (!el.hasAttribute('aria-label')) el.setAttribute('aria-label', lab);
      } else el.appendChild(h('span', { class: 'btn-label' }, lab));
    }
    tap(el, (e) => {
      if (o.sfx !== false && MC.audio) MC.audio.sfx(o.sfx || 'tap');
      if (o.say) say(o.say);
      if (o.onTap) o.onTap(e);
    });
    return el;
  }

  /** Three star icons (n filled). px = size of each. */
  function stars(n, px, opts) {
    const o = opts || {};
    const wrap = h('span', { class: 'stars' + (o.className ? ' ' + o.className : ''), role: 'img', 'aria-label': `${n || 0} yıldız` });
    for (let i = 0; i < 3; i++) wrap.appendChild(MC.gfx.icon(i < (n || 0) ? 'ui.star' : 'ui.star.empty', px || 20));

  }

  /** Top bar: { left: [els], title: string|el, right: [els], className }. Sticky, plank-textured. */
  function topbar(o) {
    o = o || {};
    return h(
      'header',
      { class: 'bar' + (o.className ? ' ' + o.className : '') },
      h('div', { class: 'bar-side bar-left' }, o.left || []),
      o.title != null ? h('div', { class: 'bar-title' }, o.title) : h('div', { class: 'bar-spacer' }),
      h('div', { class: 'bar-side bar-right' }, o.right || [])
    );

  /** Star-count chip (live: updates when the store changes while connected). */
  function starChip() {
    const num = h('span', { class: 'chip-num' }, MC.gfx.ptext(String(MC.store.totalStars()), 21));
    const el = h('span', { class: 'chip chip-stars', role: 'img', 'aria-label': `${MC.store.totalStars()} yıldız` }, MC.gfx.icon('ui.star', 28), num);
    tap(el, () => say(`${MC.store.totalStars()} yıldızın var.`));

  /** Sound on/off toggle button (icon-only). */
  function soundToggle(opts) {
    const o = opts || {};
    const on = () => MC.store.settings.sound;
    const btn = button({
      icon: on() ? 'ui.sound' : 'ui.mute',
      size: o.size || 'sm',
      variant: o.variant || 'stone',
      title: 'Ses',
      fallback: '♪',
      sfx: false,
      onTap: () => {
        MC.store.toggle('sound');
        if (MC.store.settings.sound) {
          MC.audio.unlock();
          MC.audio.sfx('tap');
        }
        refresh();
        say(on() ? 'Ses açık.' : 'Ses kapalı.');
      },
    });
    const refresh = () => {
      const ic = btn.querySelector('canvas');
      if (ic) MC.gfx.repaint(ic, on() ? 'ui.sound' : 'ui.mute');
      btn.setAttribute('aria-pressed', on() ? 'true' : 'false');
      btn.classList.toggle('is-off', !on());
    };

    // stay in sync with other sound switches (parent corner settings); drop the listener once the button is gone
    let wasIn = false;
    const off = MC.store.onChange((what) => {
      if (what !== 'settings' && what !== 'reset' && what !== 'reload') return;
      if (!btn.isConnected) {
        if (wasIn) off();
        return;
      }
      wasIn = true;
      refresh();
    });

      if (btn.isConnected) wasIn = true;
      else if (wasIn) off();

  // ------------------------------------------------------------------ overlay + toast
  const openOverlays = [];
  /** Modal layer. Returns { close(), el }. opts: { onClose, closable = true (backdrop/Escape close), className, label } */
  function overlay(content, opts) {
    const o = opts || {};
    const layer = $('overlay');
    const box = h('div', { class: 'ov-box' + (o.className ? ' ' + o.className : '') }, content);
    const wrap = h('div', { class: 'ov', role: 'dialog', 'aria-modal': 'true', 'aria-label': o.label || null }, box);
    const prevFocus = document.activeElement;
    let closed = false;
    const api = {
      el: wrap,
      close() {
        if (closed) return;
        closed = true;
        wrap.classList.add('ov-out');
        const i = openOverlays.indexOf(api);
        if (i >= 0) openOverlays.splice(i, 1);
        setTimeout(() => {
          wrap.remove();
          if (!layer.children.length) layer.classList.remove('open');
        }, 120);
        if (prevFocus && prevFocus.focus && prevFocus.isConnected) try { prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
        if (o.onClose) o.onClose();
      },
      closable: o.closable !== false,
    };
    wrap.addEventListener('pointerdown', (e) => {
      if (e.target === wrap && api.closable) api.close();
    });
    layer.appendChild(wrap);
    layer.classList.add('open');
    openOverlays.push(api);
    requestAnimationFrame(() => {
      const f = box.querySelector('button, [href], input, [tabindex]:not([tabindex="-1"])');
      if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    });
    return api;
  }
  function closeOverlays() {
    for (const o of openOverlays.slice()) o.close();
  }

  let toastTimer = 0;
  /** Short message at the bottom. opts: { say: true → also spoken, ms } */
  function toast(text, opts) {

    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), o.ms || 2600);
    if (o.say) say(text);
  }

  // ------------------------------------------------------------------ placeholder level screen
  // Used only while src/app/50-level.js has not registered MC.screens.level.
  const placeholderLevel = {
    mount(root, p) {

      root.appendChild(topbar({ left: [button({ icon: 'ui.home', size: 'sm', title: 'Harita', fallback: '⌂', onTap: () => show('map', { focus: p.n }) })], title: MC.gfx.mixed(lv ? `${p.n}. ${lv.name}` : `Bölüm ${p.n}`, 21, { shadow: '#4e3620' }) }));
      const body = h('div', { class: 'ph-body' });
