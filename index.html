<noscript><p class="noscript">Blokcraft için tarayıcıda JavaScript açık olmalı.</p></noscript>
<script>/* ==== core/00-ns.js ==== */
// Blokcraft namespace + small shared helpers. Runs in the browser and under node:vm (no DOM).
(function () {
  const MC = (globalThis.MC = globalThis.MC || {});

  MC.version = 1;

  // Deterministic PRNG (mulberry32) for anything content-side that needs a fixed shuffle.
  MC.rng = function (seed) {
    let a = seed >>> 0 || 1;
    const next = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      shuffle(arr) {
        const out = arr.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      },
    };
  };

  MC.hash = function (...parts) {
    let h = 2166136261 >>> 0;
    const s = parts.join('|');
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  MC.clone = (x) => JSON.parse(JSON.stringify(x));
  MC.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // Turkish word count used for say/hint limits.
  MC.words = (s) => String(s || '').trim().split(/\s+/).filter(Boolean).length;
})();

/* ==== core/10-engine.js ==== */
// Blokcraft engine: the rules of the world (CONTRACT.md §4). Pure data + logic, no DOM.
// Public API: MC.world, MC.level, MC.worlds, MC.levels, MC.parse, MC.run, MC.runAll, MC.size, MC.norm,
// MC.atoms, MC.paletteInfo, MC.condKinds, MC.condSay, MC.stars, MC.kindOf, MC.legend, MC.flatten.
(function () {
  const MC = globalThis.MC;

  // ---------------------------------------------------------------- directions
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const TURN_L = { U: 'L', L: 'D', D: 'R', R: 'U' };
  const TURN_R = { U: 'R', R: 'D', D: 'L', L: 'U' };
  MC.DIRS = DIRS;
  MC.TURN_L = TURN_L;
  MC.TURN_R = TURN_R;

  // ---------------------------------------------------------------- legend
  const LEGEND = {
    '.': 'floor', ',': 'path', '=': 'bridge', '@': 'start', H: 'goal', '+': 'target', P: 'portal',
    '#': 'wall', B: 'bedrock',
    S: 'stone', T: 'log', K: 'coal', I: 'iron', G: 'gold', D: 'diamond', E: 'emerald', R: 'redstone', Q: 'dirt',
    '~': 'water', L: 'lava', C: 'cactus', V: 'void',
    d: 'item_diamond', e: 'item_emerald', a: 'item_apple', g: 'item_gold', k: 'item_key',
    c: 'creeper', z: 'zombie', x: 'skeleton', s: 'spider',
    p: 'pig', w: 'sheep', v: 'villager',
    // engine-internal (never used by level authors)
    X: 'placed', Y: 'filled', _: 'lavabridge',
  };
  const RESERVED = new Set(['X', 'Y', '_']);
  MC.legend = LEGEND;

  const WALK = new Set(['floor', 'path', 'bridge', 'lavabridge', 'start', 'goal', 'target', 'portal']);
  const GOALK = new Set(['goal', 'portal']);
  const BLOCK_DROP = {
    stone: 'cobble', log: 'wood', coal: 'coal', iron: 'iron', gold: 'gold', diamond: 'diamond',
    emerald: 'emerald', redstone: 'redstone', dirt: 'dirt', placed: 'cobble',
  };
  const ORES = new Set(['coal', 'iron', 'gold', 'diamond', 'emerald', 'redstone']);
  const ITEM_DROP = { item_diamond: 'diamond', item_emerald: 'emerald', item_apple: 'apple', item_gold: 'gold', item_key: 'key' };
  const HOSTILE = new Set(['creeper', 'zombie', 'skeleton', 'spider', 'enderman', 'blaze']);
  const ANIMALS = new Set(['pig', 'sheep', 'villager', 'cow', 'chicken', 'wolf', 'irongolem']);
  const ENTER_FAIL = { water: 'splash', lava: 'burn', cactus: 'ouch', creeper: 'boom', void: 'fall' };
  const KNOWN_KINDS = new Set([
    ...WALK, 'wall', 'bedrock', ...Object.keys(BLOCK_DROP), 'filled', 'water', 'lava', 'cactus', 'void',
    ...Object.keys(ITEM_DROP), ...HOSTILE, ...ANIMALS,
  ]);
  MC.KNOWN_KINDS = KNOWN_KINDS;
  MC.kindSets = { WALK, GOALK, BLOCK_DROP, ORES, ITEM_DROP, HOSTILE, ANIMALS };

  const isItem = (k) => Object.prototype.hasOwnProperty.call(ITEM_DROP, k);
  const isWalk = (k) => WALK.has(k) || isItem(k);
  const isBlock = (k) => Object.prototype.hasOwnProperty.call(BLOCK_DROP, k);
  const failAct = (k) => ENTER_FAIL[k] || (HOSTILE.has(k) ? 'caught' : null);

  // ---------------------------------------------------------------- atoms / palette metadata
  const A = (label, note, group, mode, extra) => Object.assign({ label, say: label, note, group, mode }, extra || {});
  MC.atoms = {
    U: A('Yukarı', 'G4', 'move', 'abs', { dir: 'U' }),
    D: A('Aşağı', 'C4', 'move', 'abs', { dir: 'D' }),
    L: A('Sola', 'D4', 'move', 'abs', { dir: 'L' }),
    R: A('Sağa', 'E4', 'move', 'abs', { dir: 'R' }),
    MU: A('Yukarıyı kaz', 'G3', 'mine', 'abs', { dir: 'U' }),
    MD: A('Aşağıyı kaz', 'C3', 'mine', 'abs', { dir: 'D' }),
    ML: A('Solu kaz', 'D3', 'mine', 'abs', { dir: 'L' }),
    MR: A('Sağı kaz', 'E3', 'mine', 'abs', { dir: 'R' }),
    PU: A('Yukarı koy', 'G5', 'place', 'abs', { dir: 'U' }),
    PD: A('Aşağı koy', 'C5', 'place', 'abs', { dir: 'D' }),
    PL: A('Sola koy', 'D5', 'place', 'abs', { dir: 'L' }),
    PR: A('Sağa koy', 'E5', 'place', 'abs', { dir: 'R' }),
    F: A('İleri', 'E4', 'move', 'rel'),
    TL: A('Sola dön', 'D4', 'turn', 'rel'),
    TR: A('Sağa dön', 'G4', 'turn', 'rel'),
    MF: A('Önünü kaz', 'E3', 'mine', 'rel'),
    PF: A('Önüne koy', 'E5', 'place', 'rel'),
    A: A('Tarif A', 'A4', 'call', 'any'),
    B: A('Tarif B', 'B4', 'call', 'any'),
  };
  for (const k of Object.keys(MC.atoms)) MC.atoms[k].icon = 'cmd.' + k;

  // Palette entries = atoms + compound makers.
  MC.paletteInfo = Object.assign({}, MC.atoms, {
    rep: { label: 'Tekrarla', say: 'Tekrarla', icon: 'cmd.rep', group: 'rep', mode: 'any' },
    until: { label: 'Olana kadar', say: 'Olana kadar tekrarla', icon: 'cmd.until', group: 'until', mode: 'any' },
    if: { label: 'Eğer', say: 'Eğer', icon: 'cmd.if', group: 'if', mode: 'any' },
    ifelse: { label: 'Eğer / Değilse', say: 'Eğer, değilse', icon: 'cmd.ifelse', group: 'if', mode: 'any' },
  });

  // ---------------------------------------------------------------- conditions
  MC.condKinds = ['free', 'block', 'ore', 'liquid', 'water', 'lava', 'hazard', 'item', 'target', 'wall'];
  const COND_DIRS = ['U', 'D', 'L', 'R', 'F'];

  function parseCond(cond) {
    let s = String(cond || '');
    let neg = false;
    if (s[0] === '!') { neg = true; s = s.slice(1); }
    if (s === 'goal') return { neg, dir: null, kind: 'goal' };
    const m = /^([UDLRF]):([a-z]+)$/.exec(s);
    if (!m || !MC.condKinds.includes(m[2])) return null;
    return { neg, dir: m[1], kind: m[2] };
  }
  MC.parseCond = parseCond;

  function testKind(kind, what) {
    switch (what) {
      case 'free': return isWalk(kind);
      case 'block': return isBlock(kind);
      case 'ore': return ORES.has(kind);
      case 'liquid': return kind === 'water' || kind === 'lava';
      case 'water': return kind === 'water';
      case 'lava': return kind === 'lava';
      case 'hazard': return kind === 'lava' || kind === 'cactus' || kind === 'void' || HOSTILE.has(kind);
      case 'item': return isItem(kind);
      case 'target': return kind === 'target';
      case 'wall': return kind === 'wall' || kind === 'bedrock' || kind === 'out' || kind === 'filled' || ANIMALS.has(kind);
      default: return false;
    }
  }

  const NOUN = { U: 'Yukarı', D: 'Aşağı', L: 'Sol', R: 'Sağ', F: 'Ön' };
  const LOC = { U: 'Yukarıda', D: 'Aşağıda', L: 'Solda', R: 'Sağda', F: 'Önünde' };
  const THING = { block: 'blok', ore: 'maden', liquid: 'sıvı', water: 'su', lava: 'lav', hazard: 'tehlike', item: 'hazine', target: 'işaret', wall: 'duvar' };
  // Spoken/label text for a condition. mode 'if' → "Sağda su varsa", mode 'until' → "Sağda su olana kadar".
  MC.condSay = function (cond, mode) {
    const c = parseCond(cond);
    if (!c) return String(cond);
    const until = mode === 'until';
    if (c.kind === 'goal') {
      if (until) return c.neg ? 'Hedeften çıkana kadar' : 'Hedefe varana kadar';
      return c.neg ? 'Hedefte değilsen' : 'Hedefteysen';
    }
    if (c.kind === 'free') {
      if (until) return c.neg ? `${NOUN[c.dir]} kapanana kadar` : `${NOUN[c.dir]} açılana kadar`;
      return c.neg ? `${NOUN[c.dir]} kapalıysa` : `${NOUN[c.dir]} açıksa`;
    }
    const t = THING[c.kind];
    if (until) return c.neg ? `${LOC[c.dir]} ${t} kalmayana kadar` : `${LOC[c.dir]} ${t} olana kadar`;
    return c.neg ? `${LOC[c.dir]} ${t} yoksa` : `${LOC[c.dir]} ${t} varsa`;
  };

  // ---------------------------------------------------------------- registry
  MC.worlds = MC.worlds || [];
  MC.levels = MC.levels || [];
  MC.world = function (w) {
    MC.worlds = MC.worlds.filter((x) => x.n !== w.n).concat([w]).sort((a, b) => a.n - b.n);
    return w;
  };
  MC.level = function (lv) {
    MC.levels = MC.levels.filter((x) => x.n !== lv.n).concat([lv]).sort((a, b) => a.n - b.n);
    return lv;
  };
  MC.getLevel = (n) => MC.levels.find((l) => l.n === n) || null;
  MC.getWorld = (n) => MC.worlds.find((w) => w.n === n) || null;

  // ---------------------------------------------------------------- programs
  MC.norm = function (p) {
    if (!p) return { main: [] };
    if (Array.isArray(p)) return { main: p };
    const out = { main: p.main || [] };
    if (p.A) out.A = p.A;
    if (p.B) out.B = p.B;
    return out;
  };
  function sizeNodes(nodes) {
    let s = 0;
    for (const n of nodes || []) {
      if (typeof n === 'string') s += 1;
      else s += 1 + sizeNodes(n.do) + sizeNodes(n.else);
    }
    return s;
  }
  MC.size = function (p) {
    const q = MC.norm(p);
    return sizeNodes(q.main) + sizeNodes(q.A) + sizeNodes(q.B);
  };
  // Flat token list (for edit distance, display, hashing). Compound → '[rep3', …, ']'.
  MC.flatten = function (p) {
    const out = [];
    const walk = (nodes) => {
      for (const n of nodes || []) {
        if (typeof n === 'string') out.push(n);
        else if (n.rep != null) { out.push('[rep' + n.rep); walk(n.do); out.push(']'); }
        else if (n.until != null) { out.push('[until ' + n.until); walk(n.do); out.push(']'); }
        else if (n.if != null) {
          out.push('[if ' + n.if); walk(n.do);
          if (n.else) { out.push('|else'); walk(n.else); }
          out.push(']');
        }
      }
    };
    const q = MC.norm(p);
    walk(q.main);
    if (q.A) { out.push('{A'); walk(q.A); out.push('}'); }
    if (q.B) { out.push('{B'); walk(q.B); out.push('}'); }
    return out;
  };
  MC.progKey = (p) => MC.flatten(p).join(' ');

  // Which atoms / constructs a program uses (for validation + curriculum metrics).
  MC.uses = function (p) {
    const set = new Set();
    const walk = (nodes) => {
      for (const n of nodes || []) {
        if (typeof n === 'string') set.add(n);
        else if (n.rep != null) { set.add('rep'); walk(n.do); }
        else if (n.until != null) { set.add('until'); walk(n.do); }
        else if (n.if != null) { set.add(n.else ? 'ifelse' : 'if'); walk(n.do); walk(n.else); }
      }
    };
    const q = MC.norm(p);
    walk(q.main); walk(q.A); walk(q.B);
    return set;
  };

  // ---------------------------------------------------------------- parse
  const parsedCache = typeof WeakMap !== 'undefined' ? new WeakMap() : null;
  MC.kindOf = function (ch, legend) {
    return (legend && legend[ch]) || LEGEND[ch] || null;
  };

  MC.parse = function (level) {
    if (level && level.__parsed) return level;
    if (parsedCache && parsedCache.has(level)) return parsedCache.get(level);
    const legend = Object.assign({}, LEGEND, level.legend || {});
    const maps = level.maps || (level.map ? [level.map] : []);
    const grids = maps.map((rows) => {
      const h = rows.length;
      const w = h ? rows[0].length : 0;
      const cells = rows.map((r) => r.split(''));
      let start = null;
      for (let y = 0; y < h; y++) for (let x = 0; x < cells[y].length; x++) {
        if (cells[y][x] === '@') { start = start || { x, y }; cells[y][x] = '.'; }
      }
      return { w, h, cells, start: start || { x: 0, y: 0 }, dir: level.dir || 'R' };
    });
    // default goals from the maps
    let hasGoal = false, hasItem = false, hasTarget = false;
    for (const g of grids) for (const row of g.cells) for (const ch of row) {
      const k = legend[ch];
      if (GOALK.has(k)) hasGoal = true;
      if (isItem(k)) hasItem = true;
      if (k === 'target') hasTarget = true;
    }
    const gl = level.goal || {};
    const goal = {
      reach: gl.reach != null ? !!gl.reach : hasGoal,
      gems: gl.gems != null ? !!gl.gems : hasItem,
      fill: gl.fill != null ? !!gl.fill : hasTarget,
      mine: Array.isArray(gl.mine) ? gl.mine.slice() : [],
    };
    const solution = level.solution != null ? MC.norm(level.solution) : null;
    const out = Object.assign({}, level, {
      __parsed: true,
      type: level.type || 'build',
      legendMap: legend,
      grids,
      w: Math.max(0, ...grids.map((g) => g.w)),
      h: Math.max(0, ...grids.map((g) => g.h)),
      goal,
      palette: level.palette || [],
      conds: level.conds || [],
      funcs: level.funcs || [],
      par: level.par != null ? level.par : solution ? MC.size(solution) : null,
      max: level.max != null ? level.max : null,
    });
    if (parsedCache) parsedCache.set(level, out);
    return out;
  };

  // ---------------------------------------------------------------- machine
  const MAX_ACTIONS = 200;
  const MAX_UNTIL = 40;
  const MAX_EVENTS = 4000;
  MC.limits = { MAX_ACTIONS, MAX_UNTIL, MAX_EVENTS };

  const STOP = { __stop: true };
  function stop(ok, reason, path) {
    const s = Object.create(STOP);
    s.ok = ok; s.reason = reason; s.path = path;
    return s;
  }

  // A machine state (cloneable for the solver).
  function initState(L, gi) {
    const g = L.grids[gi];
    const legend = L.legendMap;
    const st = { x: g.start.x, y: g.start.y, dir: g.dir, cells: g.cells.map((r) => r.slice()), inv: {}, actions: 0, done: false, items: 0, targets: 0, mine: 0 };
    const mineSet = new Set(L.goal.mine);
    for (const row of st.cells) for (const ch of row) {
      const k = legend[ch];
      if (isItem(k)) st.items++;
      if (k === 'target') st.targets++;
      if (mineSet.has(ch)) st.mine++;
    }
    return st;
  }
  function cloneState(st) {
    return { x: st.x, y: st.y, dir: st.dir, cells: st.cells.map((r) => r.slice()), inv: Object.assign({}, st.inv), actions: st.actions, done: st.done, items: st.items, targets: st.targets, mine: st.mine };
  }
  MC._initState = initState;
  MC._cloneState = cloneState;

  function kindAt(L, st, x, y) {
    if (y < 0 || y >= st.cells.length || x < 0 || x >= st.cells[y].length) return 'out';
    return L.legendMap[st.cells[y][x]] || 'wall';
  }
  MC._kindAt = kindAt;

  function goalsMet(L, st) {
    const g = L.goal;
    if (g.reach && !GOALK.has(kindAt(L, st, st.x, st.y))) return false;
    if (g.gems && st.items > 0) return false;
    if (g.fill && st.targets > 0) return false;
    if (g.mine.length && st.mine > 0) return false;
    return g.reach || g.gems || g.fill || g.mine.length > 0;
  }
  function missingGoals(L, st) {
    const g = L.goal;
    const m = [];
    if (g.reach && !GOALK.has(kindAt(L, st, st.x, st.y))) m.push('reach');
    if (g.gems && st.items > 0) m.push('gems');
    if (g.fill && st.targets > 0) m.push('fill');
    if (g.mine.length && st.mine > 0) m.push('mine');
    return m;
  }
  MC._goalsMet = goalsMet;

  function evalCond(L, st, cond) {
    const c = parseCond(cond);
    if (!c) return false;
    let v;
    if (c.kind === 'goal') v = GOALK.has(kindAt(L, st, st.x, st.y));
    else {
      const d = c.dir === 'F' ? st.dir : c.dir;
      const [dx, dy] = DIRS[d];
      v = testKind(kindAt(L, st, st.x + dx, st.y + dy), c.kind);
    }
    return c.neg ? !v : v;
  }
  MC._evalCond = evalCond;

  // Execute one atom on state. Returns an event object. Throws STOP on failure/success.
  function doAtom(ctx, op, path) {
    const { L, st } = ctx;
    if (++st.actions > MAX_ACTIONS) throw stop(false, 'steps', path);
    const ev = { path, op, from: { x: st.x, y: st.y } };
    if (ctx.call) ev.call = ctx.call;
    if (op === 'TL' || op === 'TR') {
      st.dir = op === 'TL' ? TURN_L[st.dir] : TURN_R[st.dir];
      ev.act = 'turn';
      ev.to = { x: st.x, y: st.y };
      ev.dir = st.dir;
      emit(ctx, ev);
      return;
    }
    let verb, dir;
    if (op === 'U' || op === 'D' || op === 'L' || op === 'R') { verb = 'move'; dir = op; }
    else if (op === 'F') { verb = 'move'; dir = st.dir; }
    else if (op === 'MF') { verb = 'mine'; dir = st.dir; }
    else if (op === 'PF') { verb = 'place'; dir = st.dir; }
    else if (op.length === 2 && (op[0] === 'M' || op[0] === 'P') && DIRS[op[1]]) { verb = op[0] === 'M' ? 'mine' : 'place'; dir = op[1]; }
    else throw stop(false, 'end', path); // unknown atom: treat as a stop (validation catches it)
    st.dir = dir;
    ev.dir = dir;
    const tx = st.x + DIRS[dir][0];
    const ty = st.y + DIRS[dir][1];
    const k = kindAt(L, st, tx, ty);
    ev.to = { x: tx, y: ty };
    if (verb === 'move') {
      if (isWalk(k)) {
        st.x = tx; st.y = ty;
        ev.act = 'move';
        if (isItem(k)) {
          const ch = st.cells[ty][tx];
          ev.got = ch;
          ev.drop = ITEM_DROP[k];
          ev.cell = { x: tx, y: ty, before: ch, after: '.' };
          st.cells[ty][tx] = '.';
          st.inv[ev.drop] = (st.inv[ev.drop] || 0) + 1;
          st.items--;
        }
        emit(ctx, ev);
        checkGoal(ctx, ev, path);
        return;
      }
      const fa = failAct(k);
      ev.act = fa || 'bump';
      emit(ctx, ev);
      throw stop(false, ev.act, path);
    }
    if (verb === 'mine') {
      if (isBlock(k)) {
        const ch = st.cells[ty][tx];
        ev.act = 'mine';
        ev.drop = BLOCK_DROP[k];
        ev.cell = { x: tx, y: ty, before: ch, after: '.' };
        st.cells[ty][tx] = '.';
        st.inv[ev.drop] = (st.inv[ev.drop] || 0) + 1;
        if (L.goal.mine.includes(ch)) st.mine--;
        emit(ctx, ev);
        checkGoal(ctx, ev, path);
        return;
      }
      ev.act = 'mine-miss';
      emit(ctx, ev);
      throw stop(false, 'miss', path);
    }
    // place
    let after = null;
    if (k === 'water' || k === 'void') after = '=';
    else if (k === 'lava') after = '_';
    else if (k === 'target') { after = 'Y'; st.targets--; }
    else if (k === 'floor' || k === 'path' || k === 'bridge' || k === 'lavabridge' || k === 'start') after = 'X';
    if (after) {
      const ch = st.cells[ty][tx];
      st.cells[ty][tx] = after;
      ev.act = 'place';
      ev.cell = { x: tx, y: ty, before: ch, after };
      emit(ctx, ev);
      checkGoal(ctx, ev, path);
      return;
    }
    ev.act = 'place-miss';
    emit(ctx, ev);
    throw stop(false, 'nospace', path);
  }

  function emit(ctx, ev) {
    if (!ctx.events) return;
    if (ctx.events.length >= MAX_EVENTS) throw stop(false, 'steps', ev.path);
    ctx.events.push(ev);
  }
  function checkGoal(ctx, ev, path) {
    if (goalsMet(ctx.L, ctx.st)) {
      ev.done = true;
      ctx.st.done = true;
      throw stop(true, 'goal', path);
    }
  }
  function note(ctx, ev) {
    if (ctx.call) ev.call = ctx.call;
    if (ctx.events) emit(ctx, ev);
    else if (++ctx.meta > MAX_EVENTS) throw stop(false, 'steps', ev.path);
  }

  function execNodes(ctx, nodes, path) {
    for (let i = 0; i < (nodes || []).length; i++) {
      const node = nodes[i];
      const p = path.concat(i);
      if (typeof node === 'string') {
        if (node === 'A' || node === 'B') {
          const body = ctx.prog[node];
          note(ctx, { path: p, op: node, act: 'call' });
          if (ctx.call || !body) continue; // no calls inside functions; missing body = nothing
          ctx.call = p;
          try { execNodes(ctx, body, [node]); } finally { ctx.call = null; }
        } else doAtom(ctx, node, p);
      } else if (node && node.rep != null) {
        const n = node.rep | 0;
        for (let k = 1; k <= n; k++) {
          note(ctx, { path: p, op: 'rep', act: 'loop', iter: k });
          execNodes(ctx, node.do, p.concat('do'));
        }
      } else if (node && node.until != null) {
        let k = 0;
        for (;;) {
          const v = evalCond(ctx.L, ctx.st, node.until);
          note(ctx, { path: p, op: 'until', act: 'check', cond: node.until, val: v, iter: k + 1 });
          if (v) break;
          if (++k > MAX_UNTIL) throw stop(false, 'loop', p);
          execNodes(ctx, node.do, p.concat('do'));
        }
      } else if (node && node.if != null) {
        const v = evalCond(ctx.L, ctx.st, node.if);
        note(ctx, { path: p, op: node.else ? 'ifelse' : 'if', act: 'check', cond: node.if, val: v });
        if (v) execNodes(ctx, node.do, p.concat('do'));
        else if (node.else) execNodes(ctx, node.else, p.concat('else'));
      }
    }
  }
  MC._execNodes = execNodes;

  // Run nodes on an existing state (solver use): returns {ok:true|false|null, reason, st}
  // ok=true → goals met; ok=false → failed; ok=null → finished nodes without meeting goals.
  MC._apply = function (L, st, nodes, prog) {
    const ctx = { L, st, events: null, prog: prog || {}, call: null, meta: 0 };
    try {
      execNodes(ctx, nodes, ['main']);
      return { ok: null, st };
    } catch (e) {
      if (e && e.__stop) return { ok: e.ok, reason: e.reason, st };
      throw e;
    }
  };

  MC.run = function (level, program, opts) {
    const L = MC.parse(level);
    const gi = (opts && opts.map) || 0;
    const prog = MC.norm(program);
    const st = initState(L, gi);
    const ctx = { L, st, events: [], prog, call: null, meta: 0 };
    let ok = false, reason = 'end', failPath = null;
    if (goalsMet(L, st)) { ok = true; reason = 'goal'; }
    else {
      try {
        execNodes(ctx, prog.main, ['main']);
      } catch (e) {
        if (!(e && e.__stop)) throw e;
        ok = e.ok; reason = e.reason; failPath = e.ok ? null : e.path;
      }
    }
    const missing = ok ? [] : missingGoals(L, st);
    const out = {
      ok, reason, failPath,
      missing,
      events: ctx.events,
      final: { x: st.x, y: st.y, dir: st.dir, inv: st.inv, grid: st.cells.map((r) => r.join('')), actions: st.actions },
    };
    // extra detail for the spoken failure line (additive; reason codes unchanged):
    // hit = kind of the cell a failing bump / mine / place aimed at; left = what is still waiting (item / block kinds)
    if (!ok) {
      const last = ctx.events[ctx.events.length - 1];
      if (last && last.to && (reason === 'bump' || reason === 'miss' || reason === 'nospace')) out.hit = kindAt(L, st, last.to.x, last.to.y);
      if (missing.includes('gems') || missing.includes('mine')) {
        const items = new Set(), blocks = new Set();
        for (const row of st.cells) for (const ch of row) {
          const k = L.legendMap[ch];
          if (isItem(k)) items.add(ITEM_DROP[k]);
          if (L.goal.mine.includes(ch) && k) blocks.add(k);
        }
        out.left = { items: [...items], blocks: [...blocks] };
      }
    }
    return out;
  };

  MC.runAll = function (level, program) {
    const L = MC.parse(level);
    const results = L.grids.map((_, i) => MC.run(L, program, { map: i }));
    return { ok: results.every((r) => r.ok), results };
  };

  // ---------------------------------------------------------------- stars
  // info: { solved, size, solutionShown, firstTry }
  MC.stars = function (level, info) {
    if (!info || !info.solved) return 0;
    const L = MC.parse(level);
    let s = 1;
    if (!info.solutionShown) s++;
    if (L.type === 'build' || L.type === 'fix') { if (info.size != null && L.par != null && info.size <= L.par) s++; }
    else if (info.firstTry) s++;
    return s;
  };

  // Human-readable failure line (spoken after a failed run). Short, neutral, Turkish.
  const ITEM_TR = { diamond: 'Elmas', emerald: 'Zümrüt', apple: 'Elma', gold: 'Altın', key: 'Anahtar' };
  const BLOCK_TR = { log: 'Ağaç', stone: 'Taş', coal: 'Kömür', iron: 'Demir', gold: 'Altın', diamond: 'Elmas', emerald: 'Zümrüt', redstone: 'Kızıltaş', dirt: 'Toprak', placed: 'Taş' };
  MC.itemSay = ITEM_TR;
  MC.blockSay = BLOCK_TR;
  const lower = (s) => s.replace(/^İ/, 'i').replace(/^I/, 'ı').toLowerCase();
  const nameList = (names) => (names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} ve ${lower(names[1])}` : null);
  MC.failSay = function (result) {
    if (!result || result.ok) return '';
    switch (result.reason) {
      case 'bump': return 'Emir çarptı. Yolu kontrol et.';
      case 'splash': return 'Suya düştü! Köprü lazım.';
      case 'burn': return 'Lav çok sıcak! Başka yol bul.';
      case 'ouch': return 'Kaktüs batar! Başka yol bul.';
      case 'boom': return 'Creeper patladı! Ondan uzak dur.';
      case 'caught': return 'Canavar yakaladı! Başka yol bul.';
      case 'fall': return 'Boşluğa düştü! Köprü kur.';
      case 'steps': return 'Çok uzun sürdü. Programı kısalt.';
      case 'loop': return 'Döngü hiç bitmedi. Şartı kontrol et.';
      case 'miss': {
        const k = result.hit;
        if (k === 'wall' || k === 'bedrock' || k === 'out' || k === 'filled') return 'Bu blok kırılmaz. Başka yol bul.';
        if (k && !isWalk(k)) return 'Bunu kazamazsın. Başka yol bul.';
        return 'Orada kazılacak blok yok.';
      }
      case 'nospace': return 'Oraya blok konmaz.';
      default: {
        const m = result.missing || [];
        const left = result.left || {};
        if (m.includes('gems')) {
          const names = nameList((left.items || []).map((i) => ITEM_TR[i]).filter(Boolean));
          return names ? `${names} kaldı. Hepsini topla.` : 'Hazine kaldı. Hepsini topla.';
        }
        if (m.includes('mine')) {
          const bl = left.blocks || [];
          const names = nameList(bl.map((b) => BLOCK_TR[b]).filter(Boolean));
          if (!names) return 'Kazılacak blok kaldı.';
          return `${names} kaldı. Hepsini ${bl.length === 1 && bl[0] === 'log' ? 'kes' : 'kaz'}.`;
        }
        if (m.includes('fill')) return 'Boş işaret kaldı.';
        return 'Hedefe varamadı. Biraz daha ekle.';
      }
    }
  };
})();

/* ==== core/20-solver.js ==== */
// Blokcraft solver + level validation (CONTRACT.md §6). Used by tests, audit and the parent corner.
// MC.solver.search(level, opts) — Dijkstra over machine states; edges are program nodes (atoms, loops,
//   conditionals) with cost = block count. Finds the cheapest program in a restricted grammar.
// MC.validateLevel(level, {deep}) → { errors: [], warnings: [], info: {} }
(function () {
  const MC = globalThis.MC;

  const ABS = new Set(['U', 'D', 'L', 'R', 'MU', 'MD', 'ML', 'MR', 'PU', 'PD', 'PL', 'PR']);
  const REL = new Set(['F', 'TL', 'TR', 'MF', 'PF']);
  const COMPOUND = new Set(['rep', 'until', 'if', 'ifelse']);
  const TYPES = new Set(['build', 'fix', 'predict', 'choose', 'order']);

  function stateKey(L, st, rel) {
    if (st.done) return 'D';
    return st.x + ',' + st.y + (rel ? st.dir : '') + '|' + st.cells.map((r) => r.join('')).join('/');
  }
  function multiKey(L, sts, rel) {
    return sts.map((s) => stateKey(L, s, rel)).join('#');
  }

  // Apply nodes to every not-done map state. Returns {fail} | {sts, allDone}.
  function applyAll(L, sts, nodes) {
    const out = [];
    let allDone = true;
    for (const s of sts) {
      if (s.done) { out.push(s); continue; }
      const c = MC._cloneState(s);
      const r = MC._apply(L, c, nodes, {});
      if (r.ok === false) return { fail: r.reason };
      if (r.ok === true) c.done = true;
      if (!c.done) allDone = false;
      out.push(c);
    }
    return { sts: out, allDone };
  }

  // Enumerate sequences (arrays of elements) of total size exactly `size` from `elems` [{node, size}].
  function* seqs(elems, size) {
    if (size === 0) { yield []; return; }
    for (const e of elems) {
      if (e.size > size) continue;
      for (const rest of seqs(elems, size - e.size)) yield [e.node].concat(rest);
    }
  }

  /**
   * opts: { rep=true, ifs=true, until=true, calls=false, bodyMax=3, limit (search costs < limit),
   *         budget=250000 (node applications) }
   * returns { size, program } when found, { size: null, exhausted: bool } otherwise.
   */
  function search(level, opts) {
    const L = MC.parse(level);
    const o = Object.assign({ rep: true, ifs: true, until: true, bodyMax: 3, budget: 250000 }, opts || {});
    const pal = new Set(L.palette);
    const atoms = [...pal].filter((a) => ABS.has(a) || REL.has(a));
    const rel = atoms.some((a) => REL.has(a));
    const conds = L.conds || [];
    const useRep = o.rep && pal.has('rep');
    const useIf = o.ifs && (pal.has('if') || pal.has('ifelse')) && conds.length > 0;
    const useElse = o.ifs && pal.has('ifelse') && conds.length > 0;
    const useUntil = o.until && pal.has('until') && conds.length > 0;
    const limit = o.limit != null ? o.limit : Infinity;
    const multi = L.grids.length > 1;

    // body elements for loops: atoms, small ifs
    const bodyElems = atoms.map((a) => ({ node: a, size: 1 }));
    if (useIf) {
      for (const c of conds) for (const a of atoms) bodyElems.push({ node: { if: c, do: [a] }, size: 2 });
      if (useElse) for (const c of conds) for (const a of atoms) for (const b of atoms) {
        if (a !== b) bodyElems.push({ node: { if: c, do: [a], else: [b] }, size: 3 });
      }
    }
    const bodies = [];
    for (let s = 1; s <= o.bodyMax; s++) for (const b of seqs(bodyElems, s)) bodies.push({ nodes: b, size: s });

    // top-level edges (except rep, which is applied incrementally)
    const edges = atoms.map((a) => ({ nodes: [a], size: 1 }));
    if (useUntil) for (const c of conds) for (const b of bodies) edges.push({ nodes: [{ until: c, do: b.nodes }], size: 1 + b.size });
    if (useIf && multi) {
      for (const c of conds) for (let s = 1; s <= 2; s++) for (const b of seqs(atoms.map((a) => ({ node: a, size: 1 })), s)) {
        edges.push({ nodes: [{ if: c, do: b }], size: 1 + s });
      }
      if (useElse) for (const c of conds) for (const a of atoms) for (const b of atoms) if (a !== b) edges.push({ nodes: [{ if: c, do: [a], else: [b] }], size: 3 });
    }

    const start = L.grids.map((_, i) => MC._initState(L, i));
    const startKey = multiKey(L, start, rel);
    const dist = new Map([[startKey, 0]]);
    const node = new Map([[startKey, { sts: start, prev: null, via: null }]]);
    const buckets = [[startKey]];
    let spent = 0;

    const reconstruct = (key, lastNodes) => {
      const parts = [lastNodes];
      let k = key;
      while (node.get(k).prev) { parts.push(node.get(k).via); k = node.get(k).prev; }
      return parts.reverse().flat();
    };

    for (let g = 0; g < buckets.length; g++) {
      if (g >= limit) break;
      const bucket = buckets[g];
      if (!bucket) continue;
      for (const key of bucket) {
        if (dist.get(key) !== g) continue;
        const cur = node.get(key);
        const relax = (res, nodes, size) => {
          const ng = g + size;
          if (ng >= limit) return null;
          if (res.allDone) return { size: ng, program: reconstruct(key, nodes) };
          const k2 = multiKey(L, res.sts, rel);
          if (k2 === key) return null;
          const old = dist.get(k2);
          if (old != null && old <= ng) return null;
          dist.set(k2, ng);
          node.set(k2, { sts: res.sts, prev: key, via: nodes });
          (buckets[ng] = buckets[ng] || []).push(k2);
          return null;
        };
        for (const e of edges) {
          if (g + e.size >= limit) continue;
          if (++spent > o.budget) return { size: null, exhausted: true };
          const res = applyAll(L, cur.sts, e.nodes);
          if (res.fail) continue;
          const f = relax(res, e.nodes, e.size);
          if (f) return f;
        }
        if (useRep) {
          for (const b of bodies) {
            if (g + 1 + b.size >= limit) continue;
            let sts = cur.sts;
            for (let n = 1; n <= 9; n++) {
              if (++spent > o.budget) return { size: null, exhausted: true };
              const res = applyAll(L, sts, b.nodes);
              if (res.fail) break;
              sts = res.sts;
              if (n >= 2) {
                const f = relax(res, [{ rep: n, do: b.nodes }], 1 + b.size);
                if (f) return f;
              }
              if (res.allDone) break;
            }
          }
        }
      }
    }
    return { size: null, exhausted: false };
  }

  // Levenshtein over token arrays.
  function editDistance(a, b) {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => [i].concat(new Array(n).fill(0)));
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return d[m][n];
  }

  function loopDepth(nodes, depth) {
    let max = depth;
    for (const n of nodes || []) {
      if (typeof n === 'string') continue;
      const inner = n.rep != null || n.until != null ? depth + 1 : depth;
      max = Math.max(max, loopDepth(n.do, inner), loopDepth(n.else, inner));
    }
    return max;
  }

  function checkProgramShape(p, pal, where, errors, L) {
    const q = MC.norm(p);
    const used = MC.uses(q);
    for (const u of used) {
      if (!MC.paletteInfo[u]) errors.push(`${where}: unknown node ${u}`);
      else if (!pal.has(u)) errors.push(`${where}: uses ${u} which is not in the palette`);
    }
    const walk = (nodes, inFunc) => {
      for (const n of nodes || []) {
        if (typeof n === 'string') {
          if ((n === 'A' || n === 'B') && inFunc) errors.push(`${where}: function calls inside a function`);
          continue;
        }
        if (n.rep != null && !(Number.isInteger(n.rep) && n.rep >= 2 && n.rep <= 9)) errors.push(`${where}: rep count ${n.rep} not in 2..9`);
        const c = n.until != null ? n.until : n.if;
        if (c != null) {
          if (!MC.parseCond(c)) errors.push(`${where}: bad condition ${c}`);
          else if (L && L.conds.length && !L.conds.includes(c)) errors.push(`${where}: condition ${c} not in level.conds`);
        }
        if (!Array.isArray(n.do)) errors.push(`${where}: compound node without do[]`);
        walk(n.do, inFunc);
        walk(n.else, inFunc);
      }
    };
    walk(q.main, false);
    walk(q.A, true);
    walk(q.B, true);
    if (loopDepth(q.main, 0) > 2 || loopDepth(q.A, 0) > 2 || loopDepth(q.B, 0) > 2) errors.push(`${where}: loops nested deeper than 2`);
  }

  function validateLevel(level, opts) {
    const deep = !opts || opts.deep !== false;
    const errors = [];
    const warnings = [];
    const info = {};
    const id = `L${String(level.n).padStart(3, '0')}`;
    const E = (m) => errors.push(`${id}: ${m}`);
    const W = (m) => warnings.push(`${id}: ${m}`);

    if (!Number.isInteger(level.n) || level.n < 1 || level.n > 100) E('n must be 1..100');
    if (level.world !== Math.ceil(level.n / 10)) E(`world ${level.world} does not match n (expected ${Math.ceil(level.n / 10)})`);
    const type = level.type || 'build';
    if (!TYPES.has(type)) E(`unknown type ${type}`);
    if (!level.name || MC.words(level.name) > 3) E(`name must be 1-3 words: "${level.name}"`);
    if (!level.say || MC.words(level.say) > 8) E(`say must be 1-8 words: "${level.say}"`);
    if (type !== 'order' && (!level.hint || MC.words(level.hint) > 10)) E(`hint must be 1-10 words: "${level.hint}"`);
    if (/\boku/i.test(level.say + ' ' + (level.hint || ''))) W('avoid the verb "oku" in say/hint');

    if (type === 'order') {
      const cards = level.cards || [];
      if (cards.length < 3 || cards.length > 6) E('order: 3..6 cards');
      for (const c of cards) {
        if (!c || !c.icon || !c.say) E('order: every card needs icon + say');
        else if (MC.words(c.say) > 5) E(`order: card say ≤ 5 words: "${c.say}"`);
      }
      info.par = cards.length;
      return { errors, warnings, info };
    }

    // maps
    const maps = level.maps || (level.map ? [level.map] : null);
    if (!maps || !maps.length) { E('no map'); return { errors, warnings, info }; }
    if (maps.length > 3) E('at most 3 maps');
    const legend = Object.assign({}, MC.legend, level.legend || {});
    for (const [ch, k] of Object.entries(level.legend || {})) {
      if (!MC.KNOWN_KINDS.has(k)) E(`legend ${ch} → unknown kind ${k}`);
      if (ch === 'X' || ch === 'Y' || ch === '_') E('X, Y and _ are reserved');
    }
    maps.forEach((rows, mi) => {
      const tag = maps.length > 1 ? `map ${mi + 1}: ` : '';
      if (!Array.isArray(rows) || !rows.length) { E(tag + 'empty map'); return; }
      const w = rows[0].length;
      if (rows.length > 8 || w > 8) E(tag + `grid ${w}×${rows.length} exceeds 8×8`);
      if (rows.some((r) => r.length !== w)) E(tag + 'map rows have different lengths');
      let starts = 0;
      for (const r of rows) for (const ch of r) {
        if (ch === '@') starts++;
        if (ch === 'X' || ch === 'Y' || ch === '_') E(tag + `reserved char ${ch} in map`);
        else if (!legend[ch]) E(tag + `unknown map char "${ch}"`);
      }
      if (starts !== 1) E(tag + `needs exactly one @ (found ${starts})`);
    });
    if (errors.length) return { errors, warnings, info };

    const L = MC.parse(level);
    info.grid = `${L.w}×${L.h}`;
    info.maps = L.grids.length;

    // palette
    const pal = new Set(L.palette);
    for (const p of pal) if (!MC.paletteInfo[p]) E(`unknown palette entry ${p}`);
    const hasAbs = [...pal].some((p) => ABS.has(p));
    const hasRel = [...pal].some((p) => REL.has(p));
    if (hasAbs && hasRel) E('palette mixes absolute and relative commands');
    if (!hasAbs && !hasRel && type !== 'predict' && type !== 'choose') E('palette has no movement/action atoms');
    if ((pal.has('if') || pal.has('ifelse') || pal.has('until')) && !L.conds.length) E('palette has if/until but level.conds is empty');
    for (const c of L.conds) if (!MC.parseCond(c)) E(`bad condition in conds: ${c}`);
    if (hasAbs && L.conds.some((c) => /^!?F:/.test(c))) E('F: conditions need relative mode');
    if (hasRel && L.conds.some((c) => /^!?[UDLR]:/.test(c))) W('absolute-direction conditions in a relative level');
    if ((pal.has('A') || pal.has('B')) && L.type !== 'predict') {
      // fine: funcs implied
    }

    const g = L.goal;
    if (!(g.reach || g.gems || g.fill || g.mine.length) && type !== 'predict') E('level has no goal (H/P, items, + or goal.mine)');
    L.grids.forEach((_, i) => {
      if (MC._goalsMet(L, MC._initState(L, i))) E(`goals are already met at the start (map ${i + 1})`);
    });

    const sol = level.solution != null ? MC.norm(level.solution) : null;
    const needsSolution = type === 'build' || type === 'fix';
    if (needsSolution && !sol) E('missing solution');
    if (sol) {
      checkProgramShape(sol, pal, 'solution', errors, L);
      const r = MC.runAll(L, sol);
      if (!r.ok) E(`solution fails: ${r.results.map((x) => x.reason + (x.missing.length ? '(' + x.missing + ')' : '')).join(', ')}`);
      info.par = L.par;
      info.size = MC.size(sol);
      info.steps = Math.max(...r.results.map((x) => x.final.actions));
      if (level.par != null && level.par < info.size) E(`par ${level.par} smaller than the solution size ${info.size}`);
      if (L.max != null && L.max < info.size) E(`max ${L.max} < solution size ${info.size}`);
    }
    if (level.start) checkProgramShape(level.start, pal, 'start', errors, L);
    if (L.max != null && level.start && MC.size(level.start) > L.max) E('start is longer than max');

    if (type === 'fix') {
      if (!level.start) E('fix: missing start');
      else {
        const r = MC.runAll(L, level.start);
        if (r.ok) E('fix: start already succeeds');
        if (sol) {
          const dist = editDistance(MC.flatten(level.start), MC.flatten(sol));
          info.edits = dist;
          const allowed = level.world >= 5 ? 2 : 1;
          if (dist > allowed) W(`fix: start and solution differ by ${dist} token edits (target ≤ ${allowed})`);
          if (dist === 0) E('fix: start equals solution');
        }
      }
    }
    if (type === 'predict') {
      if (!level.start) E('predict: missing start');
      else {
        const r = MC.run(L, level.start);
        if (!(r.reason === 'end' || r.reason === 'goal')) E(`predict: start must not fail (got ${r.reason})`);
        const ch = level.choices || [];
        if (ch.length !== 3) E('predict: needs exactly 3 choices');
        const keys = new Set(ch.map((c) => c.join(',')));
        if (keys.size !== ch.length) E('predict: duplicate choices');
        for (const c of ch) {
          const k = MC._kindAt(L, MC._initState(L, 0), c[0], c[1]);
          if (!(MC.kindSets.WALK.has(k) || MC.kindSets.ITEM_DROP[k] || k === 'floor')) E(`predict: choice ${c} is not a walkable cell (${k})`);
        }
        const hits = ch.filter((c) => c[0] === r.final.x && c[1] === r.final.y).length;
        if (hits !== 1) E(`predict: final cell (${r.final.x},${r.final.y}) matches ${hits} choices`);
        info.par = MC.size(level.start);
      }
    }
    if (type === 'choose') {
      const ops = level.options || [];
      if (ops.length !== 3) E('choose: needs exactly 3 options');
      ops.forEach((p, i) => checkProgramShape(p, pal, `option ${i + 1}`, errors, L));
      const oks = ops.map((p) => MC.runAll(L, p).ok);
      if (oks.filter(Boolean).length !== 1) E(`choose: ${oks.filter(Boolean).length} options succeed (need exactly 1)`);
      info.par = Math.max(0, ...ops.map((p) => MC.size(p)));
    }

    if (type === 'build' && sol && L.max != null && !pal.has('rep') && !pal.has('until') && !pal.has('if') && !pal.has('ifelse') && !pal.has('A') && !pal.has('B') && L.max < info.size + 1) {
      W(`max ${L.max} leaves no room for one mistake (solution ${info.size})`);
    }

    if (deep && needsSolution && sol && !errors.length) {
      // 1) is there a shorter program than par?
      const par = L.par;
      const s = search(L, { limit: par, budget: opts && opts.budget ? opts.budget : 250000 });
      if (s.size != null) E(`shorter program exists (size ${s.size} < par ${par}): ${JSON.stringify(s.program)}`);
      else if (s.exhausted) W(`par ${par} not proven optimal (search budget exhausted)`);
      // 2) concept necessity
      const seq = search(L, { rep: false, ifs: false, until: false, limit: (L.max != null ? L.max : par) + 1, budget: 200000 });
      info.seqMin = seq.size;
      if (pal.has('rep') && L.max != null && seq.size != null && seq.size <= L.max) {
        W(`loop not required: a plain sequence of ${seq.size} fits in max ${L.max}`);
      }
      if ((pal.has('A') || pal.has('B')) && L.max != null) {
        const nf = search(L, { limit: L.max + 1, budget: 200000 });
        if (nf.size != null && nf.size <= L.max) W(`function not required: ${nf.size} blocks without functions fit in max ${L.max}`);
      }
      if ((pal.has('if') || pal.has('ifelse') || pal.has('until')) && L.max != null) {
        const nc = search(L, { ifs: false, until: false, limit: L.max + 1, budget: 200000 });
        if (nc.size != null && nc.size <= L.max) W(`condition not required: ${nc.size} blocks without if/until fit in max ${L.max}`);
      }
    }
    return { errors, warnings, info };
  }

  MC.solver = { search, editDistance };
  MC.validateLevel = validateLevel;
})();

/* ==== core/30-art.js ==== */
// Pixel-art registry (pure data; no DOM). Art files in src/art/ call MC.art.pal / sprite / alias.
// The app's renderer (src/app/30-gfx.js) and tools/sheet.mjs both read sprites through MC.art.pixels.
(function () {
  const MC = globalThis.MC;
  const art = (MC.art = MC.art || {});
  art.PAL = art.PAL || {};
  art.sprites = art.sprites || {};
  art.aliases = art.aliases || {};
  art.skins = art.skins || [];

  // Add colours to the shared palette: { char: '#rrggbb' | '#rrggbbaa' }. '.' and ' ' are transparent.
  art.pal = function (map) {
    for (const [k, v] of Object.entries(map)) {
      if (k.length !== 1) throw new Error(`palette key must be one char: ${k}`);
      if (k === '.' || k === ' ') throw new Error('"." and " " are reserved for transparent');
      art.PAL[k] = v;
    }
  };

  // def: { w, h, frames: [[rows…], …] } or { w, h, rows: [...] }; optional fps, pal (local overrides), ax, ay (anchor)
  art.sprite = function (name, def) {
    const frames = def.frames || [def.rows];
    art.sprites[name] = Object.assign({}, def, { name, frames, w: def.w || frames[0][0].length, h: def.h || frames[0].length });
    return art.sprites[name];
  };
  art.alias = function (name, target) {
    art.aliases[name] = target;
  };
  art.get = function (name) {
    let n = name;
    for (let i = 0; i < 8 && !art.sprites[n] && art.aliases[n]; i++) n = art.aliases[n];
    return art.sprites[n] || null;
  };
  art.has = (name) => !!art.get(name);

  // Colour grid of one frame: array of rows, each an array of CSS colours or null (transparent).
  // overrides: { char: colour } (skins, tints). Unknown chars → magenta so mistakes are visible.
  art.pixels = function (name, frame, overrides) {
    const s = art.get(name);
    if (!s) return null;
    const rows = s.frames[(frame || 0) % s.frames.length];
    const local = s.pal || {};
    const ov = overrides || {};
    return rows.map((row) => row.split('').map((ch) => {
      if (ch === '.' || ch === ' ') return null;
      return ov[ch] || local[ch] || art.PAL[ch] || '#ff00ff';
    }));
  };

  // Validate every sprite: row lengths, frame sizes, unknown palette chars.
  art.check = function () {
    const errs = [];
    for (const s of Object.values(art.sprites)) {
      s.frames.forEach((rows, fi) => {
        if (rows.length !== s.h) errs.push(`${s.name} frame ${fi}: ${rows.length} rows, expected ${s.h}`);
        rows.forEach((r, ri) => {
          if (r.length !== s.w) errs.push(`${s.name} frame ${fi} row ${ri}: ${r.length} chars, expected ${s.w}`);
          for (const ch of r) {
            if (ch !== '.' && ch !== ' ' && !(s.pal && s.pal[ch]) && !art.PAL[ch]) { errs.push(`${s.name}: unknown palette char "${ch}"`); break; }
          }
        });
      });
    }
    for (const [a, t] of Object.entries(art.aliases)) if (!art.get(a)) errs.push(`alias ${a} → ${t} does not resolve`);
    return errs;
  };

  // Which sprites draw a board cell. Returns { floor, top, raised } (sprite names; top may be null).
  const ITEM_ICON = { item_diamond: 'it.diamond', item_emerald: 'it.emerald', item_apple: 'it.apple', item_gold: 'it.gold', item_key: 'it.key' };
  const ORE = { coal: 'ore.coal', iron: 'ore.iron', gold: 'ore.gold', diamond: 'ore.diamond', emerald: 'ore.emerald', redstone: 'ore.redstone' };
  art.cellSprites = function (kind, biome) {
    const floor = 'floor.' + biome;
    switch (kind) {
      case 'floor': case 'start': return { floor, top: null, raised: false };
      case 'path': return { floor: 'path.' + biome, top: null, raised: false };
      case 'bridge': return { floor, top: 'bridge', raised: false };
      case 'lavabridge': return { floor: 'lava', top: art.has('bridge.lava') ? 'bridge.lava' : 'bridge', raised: false };
      case 'goal': return { floor, top: 'goal.' + biome, raised: false };
      case 'target': return { floor, top: 'target', raised: false };
      case 'portal': return { floor, top: 'portal', raised: false };
      case 'wall': return { floor, top: 'wall.' + biome, raised: true };
      case 'bedrock': return { floor, top: 'bedrock', raised: true };
      case 'stone': return { floor, top: 'stone', raised: true };
      case 'log': return { floor, top: 'log', raised: true };
      case 'dirt': return { floor, top: 'dirt', raised: true };
      case 'placed': case 'filled': return { floor, top: 'placed', raised: true };
      case 'water': return { floor: 'water', top: null, raised: false };
      case 'lava': return { floor: 'lava', top: null, raised: false };
      case 'void': return { floor: 'void', top: null, raised: false };
      case 'cactus': return { floor, top: 'cactus', raised: true };
      case 'out': return { floor: null, top: null, raised: false };
      default:
        if (ORE[kind]) return { floor, top: ORE[kind], raised: true };
        if (ITEM_ICON[kind]) return { floor, top: ITEM_ICON[kind], raised: false, item: true };
        return { floor, top: kind, raised: false, mob: true }; // mobs + animals use their own name
    }
  };
})();

/* ==== art/00-palette.js ==== */
// Shared pixel palette (lead-owned). One char → one colour. '.' and ' ' are transparent.
// Art files may add colours with sprite-local `pal: {…}` overrides; do not redefine these chars.
// Hero skin chars 1-7 are recoloured by skins (MC.art.skins[i].map); defaults = Emir's own look.
(function () {
  const MC = globalThis.MC;
  MC.art.pal({
    // outlines + greys (stone, bedrock, iron)

  const md = (a, n) => ((a % n) + n) % n;

      set(x, y, c) {
        if (o.wrap) { x = md(x, w); y = md(y, h); } else if (x < 0 || y < 0 || x >= w || y >= h) return o;
        p[y][x] = c; return o;

        return p[y][x];

      hl(x, y, n, c) { return o.rect(x, y, n, 1, c); },
      vl(x, y, n, c) { return o.rect(x, y, 1, n, c); },

      o.rect(10, 27, 28, 3, 'V'); o.hl(10, 27, 28, 'X'); o.rect(10, 30, 28, 2, 'O'); o.hl(10, 31, 28, 'J');
      [[12, 30], [19, 30], [33, 30], [36, 28], [11, 28]].forEach(([x, y]) => o.set(x, y, 'j'));
      // head + neck: light from the top-left → lit top (2 rows on the snout), lit left faces, shaded right/bottom

      L: '#76768a', M: '#56566a', D: '#3a3a48', B: '#262630', P: '#c77dff', p: '#7a34d0', w: '#f6e6ff', W: '#ecebe0', T: '#aeac9e',

  (function () {

      '..---+..',

  (function () {

      E: ['XXXX', 'X...', 'XXX.', 'X...', 'XXXX'],

      L: ['X...', 'X...', 'X...', 'X...', 'XXXX'],
      O: ['.XX.', 'X..X', 'X..X', 'X..X', '.XX.'],

    const width = letterX(word.length) - GAP + PAD + 1;
    const height = PAD * 2 + 5 * UY + DEPTH;

    for (let y = 0; y < height; y++) { face.push(new Array(width).fill(false)); owner.push(new Array(width).fill(-1)); }
    word.split('').forEach((ch, li) => {
      const x0 = letterX(li);
      GL[ch].forEach((row, gy) => {
        for (let gx = 0; gx < row.length; gx++) if (row[gx] === 'X') {
          for (let j = 0; j < UY; j++) for (let i = 0; i < U; i++) { face[PAD + gy * UY + j][x0 + gx * U + i] = true; owner[PAD + gy * UY + j][x0 + gx * U + i] = li; }

    const F = (x, y) => x >= 0 && y >= 0 && x < width && y < height && face[y][x];
    const tex = [
      'SSlSSSSS',
      'SllSSSSl',
      'SSSSsSll',
      'SSSlSSSS',
      'SSlllSSS',
      'SsSSSSsS',

    const off = (d) => (d >= 2 ? 1 : 0); // extrusion steps right as it goes down

        let k = 0; while (k < DEPTH && !F(x - off(k + 1), y - k - 1)) k++;

      }
    }
    const gem = (li, gx, gy, c) => li < word.length && o.stamp(letterX(li) + gx, PAD + gy, ['.' + c + '.', c + 'W' + c, '.' + c + '.']);

    });

/* ==== app/10-store.js ==== */
// Blokcraft — MC.store: progress, settings, skin, chest, intros (CONTRACT §9b).
// Saved on the device under localStorage "blokcraft-v1" (versioned JSON). Every storage access is
// wrapped in try/catch; when storage is blocked the game keeps working from memory.
// No DOM work at load time (only localStorage, which may be absent → memory).
(function () {
  const MC = globalThis.MC;
  const KEY = 'blokcraft-v1';
  const VERSION = 1;
  const LEVEL_COUNT = 100;
  const DEFAULT_SETTINGS = { sound: true, music: true, voice: true, fast: false, unlockAll: false };

  const isObj = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
  const num = (x, d) => (typeof x === 'number' && isFinite(x) ? x : d);

  function fresh(settings) {
    return {
      v: VERSION,
      levels: {}, // n → { done, stars, size, program, plays, at }
      settings: Object.assign({}, DEFAULT_SETTINGS, settings || {}),
      skin: null,
      chest: {}, // item → count
      intros: {}, // intro key → true
      extra: {}, // free key/value space for UI modules (e.g. map unlock animation memory)
    };
  }

  // ------------------------------------------------------------------ storage (safe)
  let memCopy = null; // last JSON written (used when localStorage is unavailable)
  function lsGet() {
    try {
      const ls = globalThis.localStorage;
      if (!ls) return memCopy;
      const v = ls.getItem(KEY);
      return v == null ? memCopy : v;
    } catch (e) {
      return memCopy;
    }
  }
  function lsSet(json) {
    memCopy = json;
    try {
      const ls = globalThis.localStorage;
      if (ls) ls.setItem(KEY, json);
      return true;
    } catch (e) {
      return false;
    }
  }
  function lsRemove() {
    memCopy = null;
    try {
      const ls = globalThis.localStorage;
      if (ls) ls.removeItem(KEY);
    } catch (e) {
      /* storage blocked: memory only */
    }
  }

  // Accept anything (old versions, hand-edited, corrupt) and return a clean state.
  function sanitize(raw) {
    const s = fresh();
    if (!isObj(raw)) return s;
    if (isObj(raw.settings)) {
      for (const k of Object.keys(DEFAULT_SETTINGS)) if (typeof raw.settings[k] === 'boolean') s.settings[k] = raw.settings[k];
    }
    if (isObj(raw.levels)) {
      for (const [k, v] of Object.entries(raw.levels)) {
        const n = Number(k);
        if (!(n >= 1 && n <= LEVEL_COUNT) || !isObj(v)) continue;
        s.levels[n] = {
          done: v.done !== false,
          stars: MC.clamp(Math.round(num(v.stars, 0)), 0, 3),
          size: v.size == null ? null : num(v.size, null),
          program: v.program == null ? null : v.program,
          plays: Math.max(0, Math.round(num(v.plays, 1))),
          at: num(v.at, 0),
        };
      }
    }
    if (typeof raw.skin === 'string') s.skin = raw.skin;
    if (isObj(raw.chest)) {
      for (const [k, v] of Object.entries(raw.chest)) {
        const c = Math.round(num(v, 0));
        if (c > 0) s.chest[k] = c;
      }
    }
    if (isObj(raw.intros)) for (const k of Object.keys(raw.intros)) if (raw.intros[k]) s.intros[k] = true;
    if (isObj(raw.extra)) s.extra = MC.clone(raw.extra);
    return s;
  }

  function load() {
    const txt = lsGet();
    if (!txt) return fresh();
    try {
      return sanitize(JSON.parse(txt));
    } catch (e) {
      return fresh();
    }
  }

  let state = load();
  const listeners = new Set();

  function save(what, detail) {
    try {
      lsSet(JSON.stringify(state));
    } catch (e) {
      /* unserialisable program? keep memory state */
    }
    for (const fn of Array.from(listeners)) {
      try {
        fn(what, detail, state);
      } catch (e) {
        if (globalThis.console) console.error(e);
      }
    }
  }

  // ------------------------------------------------------------------ helpers
  const entry = (n) => state.levels[n] || null;
  const isDone = (n) => !!(state.levels[n] && state.levels[n].done);

  function addItems(items) {
    if (!items) return {};
    const added = {};
    const add = (k, c) => {
      c = Math.round(num(c, 0));
      if (!k || c <= 0) return;
      state.chest[k] = (state.chest[k] || 0) + c;
      added[k] = (added[k] || 0) + c;
    };
    if (Array.isArray(items)) for (const k of items) add(k, 1);
    else if (isObj(items)) for (const [k, c] of Object.entries(items)) add(k, c);
    else if (typeof items === 'string') add(items, 1);
    return added;
  }

  const store = {
    /** The result of the latest record() call ({n, newStars, firstClear, prevStars, added, at}); not persisted. */
    lastRecord: null,
    KEY,
    LEVEL_COUNT,
    DEFAULT_SETTINGS,

    /** Current state object (treat as read-only; use the methods to change it). */
    get state() {
      return state;
    },
    get settings() {
      return state.settings;
    },
    get chest() {
      return state.chest;
    },

    /** Best record for level n → { stars, size, program } or null. */
    best(n) {
      const e = entry(n);
      if (!e || !e.done) return null;
      return { stars: e.stars, size: e.size, program: e.program, plays: e.plays };
    },
    done: isDone,

    /**
     * Record a solved level. Keeps the best (more stars, then smaller size).
     * On the first clear the collected `items` ({item: count} or [item…]) go into the chest.
     * Returns { newStars, firstClear, prevStars, added }.
     */
    record(n, info) {
      n = Number(n);
      info = info || {};
      if (!(n >= 1 && n <= LEVEL_COUNT)) return { newStars: 0, firstClear: false, prevStars: 0, added: {} };
      const prev = entry(n);
      const firstClear = !prev || !prev.done;
      const prevStars = prev && prev.done ? prev.stars : 0;
      const stars = MC.clamp(Math.round(num(info.stars, 1)), 0, 3);
      const size = info.size == null ? null : num(info.size, null);
      const e = prev ? Object.assign({}, prev) : { done: false, stars: 0, size: null, program: null, plays: 0, at: 0 };
      const better = firstClear || stars > prevStars || (stars === prevStars && size != null && (e.size == null || size < e.size));
      e.done = true;
      e.stars = Math.max(prevStars, stars);
      if (better) {
        e.size = size;
        e.program = info.program == null ? null : MC.clone(info.program);
      }
      e.plays = (e.plays || 0) + 1;
      e.at = Date.now();
      state.levels[n] = e;
      let items = info.items;
      // the level's prize (shown on the win screen) goes into the chest too, once, unless it was collected anyway
      const lv = firstClear && typeof MC.getLevel === 'function' ? MC.getLevel(n) : null;
      const reward = lv && typeof lv.reward === 'string' ? lv.reward : null;
      if (reward) {
        const has = Array.isArray(items) ? items.includes(reward) : isObj(items) ? num(items[reward], 0) > 0 : items === reward;
        if (!has) items = Array.isArray(items) ? items.concat(reward) : isObj(items) ? Object.assign({}, items, { [reward]: 1 }) : typeof items === 'string' ? [items, reward] : { [reward]: 1 };
      }
      const added = firstClear ? addItems(items) : {};
      const newStars = Math.max(0, e.stars - prevStars);
      const res = { newStars, firstClear, prevStars, added };
      store.lastRecord = Object.assign({ n, at: e.at }, res);
      save('record', { n, newStars, firstClear });
      return res;
    },

    totalStars() {
      let t = 0;
      for (const e of Object.values(state.levels)) if (e.done) t += e.stars;
      return t;
    },
    levelsDone() {
      let t = 0;
      for (const e of Object.values(state.levels)) if (e.done) t++;
      return t;
    },
    /** { stars, done, max: 30, count: 10 } for world w (levels 10w-9 … 10w). */
    worldProgress(w) {
      let stars = 0, done = 0;
      for (let n = (w - 1) * 10 + 1; n <= w * 10; n++) {
        const e = entry(n);
        if (e && e.done) { done++; stars += e.stars; }
      }
      return { stars, done, max: 30, count: 10 };
    },
    /** A world is finished when its boss (level 10·w) is finished. */
    worldDone(w) {
      return isDone(w * 10);
    },

    /** Level 1 is always open; finishing N opens N+1; the parent corner can open everything. */
    isUnlocked(n) {
      n = Number(n);
      if (!(n >= 1 && n <= LEVEL_COUNT)) return false;
      if (n === 1 || state.settings.unlockAll) return true;
      return isDone(n) || isDone(n - 1);
    },
    /** First unfinished level that is open (the one the hero stands on). */
    currentLevel() {
      for (let n = 1; n <= LEVEL_COUNT; n++) if (!isDone(n) && store.isUnlocked(n)) return n;
      for (let n = 1; n <= LEVEL_COUNT; n++) if (!isDone(n)) return n;
      return LEVEL_COUNT;
    },

    set(key, val) {
      if (!(key in DEFAULT_SETTINGS)) return;
      const v = !!val;
      if (state.settings[key] === v) return;
      state.settings[key] = v;
      save('settings', { key, val: v });
    },
    toggle(key) {
      store.set(key, !state.settings[key]);
      return state.settings[key];
    },

    /** Current skin id (falls back to the first skin = Emir). */
    skin() {
      const skins = (MC.gfx && MC.gfx.skins && MC.gfx.skins()) || (MC.art && MC.art.skins) || [];
      if (state.skin && skins.some((s) => s.id === state.skin)) return state.skin;
      return (skins[0] && skins[0].id) || state.skin || 'emir';
    },
    setSkin(id) {
      if (!id || state.skin === id) return;
      state.skin = String(id);
      save('skin', { id: state.skin });
    },

    addItems(items) {
      const added = addItems(items);
      if (Object.keys(added).length) save('chest', { added });
      return added;
    },

    introSeen(key) {
      return !!state.intros[key];
    },
    markIntro(key) {
      if (!key || state.intros[key]) return;
      state.intros[key] = true;
      save('intro', { key });
    },

    /** Free key/value space for UI modules: extra(key) reads, extra(key, val) writes. */
    extra(key, val) {
      if (arguments.length < 2) return state.extra[key];
      state.extra[key] = val;
      save('extra', { key });
      return val;
    },

    /** Wipe progress (levels, chest, skin, intros). Sound/voice settings are kept; "unlock all" is turned off. */
    reset() {
      const keep = Object.assign({}, state.settings, { unlockAll: false });
      state = fresh(keep);
      lsRemove();
      save('reset', {});
    },

    /** Re-read from storage (tests, other tabs). */
    reload() {
      state = load();
      save('reload', {});
    },

    onChange(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
  };

  MC.store = store;
})();

/* ==== app/20-audio.js ==== */
// Blokcraft — MC.audio: WebAudio-synthesised chiptune sound effects + gentle procedural music.
// Nothing is created before a user gesture: 90-boot.js calls MC.audio.unlock() on the first tap.
// All sound is silent when settings.sound is off; music also needs settings.music.
// The music is original: slow pentatonic arpeggios, a soft bass and sparse melody notes, with a
// different key / tempo / timbre per biome and rests between phrases so it never nags.
(function () {
  const MC = globalThis.MC;

  let ctx = null;
  let master = null, sfxBus = null, musicBus = null, echoIn = null;
  let noiseBuf = null;
  let unlocked = false;
  let paused = false;
  let wantMusic = false;
  let biome = 'plains';

  const settings = () => (MC.store && MC.store.settings) || { sound: true, music: true };
  const soundOn = () => !!settings().sound;

  // ------------------------------------------------------------------ graph
  function ensure() {
    if (ctx) return ctx;
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 4;
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.55;
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0;
      musicBus.connect(master);
      // soft echo for the music (feedback delay) — makes the arpeggios feel spacious
      echoIn = ctx.createGain();
      echoIn.gain.value = 0.32;
      const delay = ctx.createDelay(1.5);
      delay.delayTime.value = 0.42;
      const fb = ctx.createGain();
      fb.gain.value = 0.34;
      const damp = ctx.createBiquadFilter();
      damp.type = 'lowpass';
      damp.frequency.value = 2200;
      echoIn.connect(delay);
      delay.connect(damp);
      damp.connect(fb);
      fb.connect(delay);
      damp.connect(musicBus);
      // white noise (seeded, deterministic) for crunches, splashes and swishes
      const r = MC.rng(20260927);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.2), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = r.next() * 2 - 1;
    } catch (e) {
      ctx = null;
    }
    return ctx;
  }

  // ------------------------------------------------------------------ voices
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freqOf(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(String(n || '').trim());
    if (!m) return 440;
    const semi = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    const midi = 12 * (Number(m[3]) + 1) + semi;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  const midiF = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // One enveloped oscillator. o: {type, f, f2 (glide target), t, dur, gain, attack, bus, detune, vib}
  function tone(o) {
    const c = ctx;
    const t = o.t;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.glide || o.dur));
    if (o.detune) osc.detune.value = o.detune;
    if (o.vib) {
      const lfo = c.createOscillator();
      const lg = c.createGain();
      lfo.frequency.value = o.vib[0];
      lg.gain.value = o.vib[1];
      lfo.connect(lg);
      lg.connect(osc.frequency);
      lfo.start(t);
      lfo.stop(t + o.dur + 0.1);
    }
    const peak = o.gain == null ? 0.2 : o.gain;
    const a = o.attack == null ? 0.005 : o.attack;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g);
    g.connect(o.bus || sfxBus);
    if (o.send) g.connect(echoIn);
    osc.start(t);
    osc.stop(t + o.dur + 0.05);
  }

  // Filtered noise burst. o: {t, dur, gain, type, f, f2, q, attack, bus}
  function noise(o) {
    const c = ctx;
    const t = o.t;
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    const flt = c.createBiquadFilter();
    flt.type = o.type || 'bandpass';
    flt.frequency.setValueAtTime(o.f || 1200, t);
    if (o.f2) flt.frequency.exponentialRampToValueAtTime(o.f2, t + o.dur);
    flt.Q.value = o.q == null ? 1 : o.q;
    const g = c.createGain();
    const peak = o.gain == null ? 0.3 : o.gain;
    const a = o.attack == null ? 0.004 : o.attack;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(o.bus || sfxBus);
    src.start(t, (o.offset || 0) % 0.8);
    src.stop(t + o.dur + 0.05);
  }

  // ------------------------------------------------------------------ sound effects
  // Each effect is (t0, opt) → schedules voices. Kept short, soft and never buzzer-like.
  const FX = {
    tap: (t) => tone({ type: 'square', f: 1320, t, dur: 0.045, gain: 0.05 }),
    step: (t) => {
      noise({ t, dur: 0.07, gain: 0.16, type: 'lowpass', f: 700, q: 0.7 });
      tone({ type: 'triangle', f: 150, f2: 90, t, dur: 0.07, gain: 0.12 });
    },
    mine: (t) => {
      noise({ t, dur: 0.07, gain: 0.35, type: 'bandpass', f: 1800, q: 1.4 });
      noise({ t: t + 0.08, dur: 0.09, gain: 0.3, type: 'bandpass', f: 1100, q: 1.2, offset: 0.3 });
      tone({ type: 'square', f: 220, f2: 140, t, dur: 0.06, gain: 0.05 });
    },
    place: (t) => {
      tone({ type: 'sine', f: 220, f2: 70, t, dur: 0.14, gain: 0.5, glide: 0.08 });
      noise({ t, dur: 0.05, gain: 0.25, type: 'lowpass', f: 900 });
    },
    pickup: (t) => {

      tone({ type: 'sine', f: 2637, t: t + 0.16, dur: 0.3, gain: 0.08 });
    },
    bump: (t) => {
      tone({ type: 'triangle', f: 260, f2: 120, t, dur: 0.12, gain: 0.35, glide: 0.1 });
      noise({ t, dur: 0.04, gain: 0.2, type: 'lowpass', f: 1500 });
    },
    splash: (t) => {
      noise({ t, dur: 0.45, gain: 0.35, type: 'bandpass', f: 2600, f2: 500, q: 0.8, attack: 0.01 });
      tone({ type: 'sine', f: 600, f2: 180, t, dur: 0.2, gain: 0.15 });
      noise({ t: t + 0.12, dur: 0.35, gain: 0.12, type: 'highpass', f: 3000, offset: 0.5 });
    },
    burn: (t) => {
      noise({ t, dur: 0.6, gain: 0.3, type: 'highpass', f: 2500, f2: 5000, q: 0.5, attack: 0.02 });
      for (let i = 0; i < 5; i++) noise({ t: t + 0.05 + i * 0.09, dur: 0.03, gain: 0.25, type: 'bandpass', f: 900 + i * 180, q: 3, offset: i * 0.13 });

    ouch: (t) => {

      tone({ type: 'square', f: 390, t: t + 0.1, dur: 0.14, gain: 0.07 });
    },
    boom: (t) => {
      noise({ t, dur: 0.5, gain: 0.18, type: 'highpass', f: 1800, f2: 4200, attack: 0.35 });
      noise({ t: t + 0.5, dur: 0.7, gain: 0.55, type: 'lowpass', f: 900, f2: 120, q: 0.6 });
      tone({ type: 'sine', f: 90, f2: 35, t: t + 0.5, dur: 0.6, gain: 0.5 });
    },
    caught: (t) => {
      tone({ type: 'triangle', f: 392, t, dur: 0.16, gain: 0.2 });
      tone({ type: 'triangle', f: 330, t: t + 0.17, dur: 0.24, gain: 0.18 });
    },
    win: (t) => {

      tone({ type: 'triangle', f: 1318.5, t: t + 0.44, dur: 0.6, gain: 0.12 });
      tone({ type: 'sine', f: 2093, t: t + 0.6, dur: 0.5, gain: 0.05 });
    },
    star: (t, o) => {
