        if (ci.portal) {
          sfx(V, 'portal');
          V.fx.push({ type: 'swirl', x: V.hx, y: V.hy, t0: t, dur: 1500 });
          V.fx.push({ type: 'glow', x: V.hx, y: V.hy, color: GLOW_PORTAL, t0: t, dur: 1100, under: 1 });
          burst(V, hx, hy, 12, VOIDC, 40, -10, 800, 2, 10);
        } else {
          sfx(V, 'door');
          V.goalOpen = true;
          V.staticDirty = true;
          V.fx.push({ type: 'glow', x: V.hx, y: V.hy, color: GLOW_GOAL, t0: t, dur: 1000, under: 1 });
          burst(V, hx, hy - 6, 14, SPARK, 55, -15, 900, 2, 25);
        }
      } else {
        // gems / fill / mine goals: a sparkle burst where the last action happened
        V.fx.push({ type: 'glow', x: V.hx, y: V.hy, color: GLOW_TARGET, t0: t, dur: 900, under: 1 });
        burst(V, hx, hy - 6, 12, SPARK, 50, -15, 850, 2, 25);
      }
      celebrate();
    }
    function finishAct(a, ok) {
      if (V.act !== a) return;
      clearTimeout(a.timer);
      V.act = null;
      const ev = a.ev;
      if (ev) {
        switch (a.kind) {
          case 'move':
            V.hx = a.tx;
            V.hy = a.ty;
            commitCell(a);
            break;
          case 'mine':
          case 'place':
            commitCell(a);
            a.broke = a.landed = true;
            break;
          case 'turn':
            V.dir = a.newDir;
            break;
          case 'boom':
            if (a.ti >= 0 && !V.gone[a.ti]) V.gone[a.ti] = now() - BOOM_BACK - BOOM_FADE; // snapped: back at once
            break;
        }
        if (!IDLE_ACTS[ev.act]) dirty = true;
        applied.add(ev);
        if (TERMINAL[ev.act] || ev.done) runEnded = true;
      } else if (a.kind === 'done' && !V.cart) {
        V.dir = 'D';
      }
      needDraw = true;
      try {
        a.resolve(ok);
      } catch (e) {
        /* ignore */
      }
    }

    function runEvent(ev, T, my) {
      return new Promise((resolve) => {
        if (!alive || my !== gen || !ev) return resolve(false);
        const k = ev.act || 'wait';
        startAct(k, ev, durFor(k, T), resolve);
      });
    }
    function runCelebration(T, my) {
      return new Promise((resolve) => {
        if (!alive || my !== gen) return resolve(false);
        startAct('done', null, durFor('done', T), resolve);
      });
    }
    function shouldReset(list) {
      if (!dirty) return false;
      if (runEnded) return true;
      const first = list.find((e) => e && e.from);
      if (!first) return true;
      if (applied.has(first)) return true;
      return first.from.x !== V.hx || first.from.y !== V.hy;
    }

    // -------------------------------------------------- observers
    if (typeof ResizeObserver === 'function') {
      ro = new ResizeObserver(() => scheduleLayout());
      ro.observe(canvas);
    }

      io = new IntersectionObserver((entries) => {
        for (const en of entries) visible = en.isIntersecting;

    }

    if (typeof window !== 'undefined') window.addEventListener('resize', scheduleLayout);

      if (!tapFns.size) return;
      const cell = api.cellAt(e.clientX, e.clientY);
      if (!cell) return;
      for (const fn of tapFns) {
        try {
          fn(cell, e);
        } catch (err) {
          console.error(err);
        }
      }
    }
    canvas.addEventListener('pointerup', onPointerUp);

    // -------------------------------------------------- public API
    const api = {
      canvas,
      get level() {
        return V.L;
      },
      get map() {
        return V.gi;
      },
      get tile() {
        return V.T / (V.dpr || 1);
      },
      reset() {
        halt();
        resetState();
        draw();
      },
      play(events, opts2) {
        const po = opts2 || {};
        halt();
        const my = gen;
        const T = speedMs(po.speed);
        const list = Array.isArray(events) ? events : [];
        if (po.reset === true || (po.reset !== false && shouldReset(list))) resetState();
        const run = (async () => {
          for (let i = 0; i < list.length; i++) {
            if (!alive || my !== gen) return false;
            const ev = list[i];
            if (po.onEvent) {
              try {
                po.onEvent(ev, i);
              } catch (e) {
                console.error(e);
              }
            }
            if (!(await runEvent(ev, T, my))) return false;
            if (ev && ev.done && !(await runCelebration(T, my))) return false;
          }
          if (my === gen) runEnded = true;
          return true;
        })();
        queue = run.catch(() => false);
        return run;
      },
      step(ev, opts2) {
        const po = opts2 || {};
        const my = gen;
        const T = speedMs(po.speed);
        const p = queue.then(() => {
          if (!alive || my !== gen) return false;
          if (po.onEvent) {
            try {
              po.onEvent(ev, -1);
            } catch (e) {
              console.error(e);
            }
          }
          return runEvent(ev, T, my).then((ok) => (ok && ev && ev.done ? runCelebration(T, my) : ok));
        });
        queue = p.catch(() => false);
        return p;
      },
      stop() {
        halt();
        V.shakeUntil = 0;
        V.cheerUntil = 0;
        V.hop = null;
        needDraw = true;
        wake();
      },
      setMap(i) {
        halt();
        loadGrid(V, i);
        resetState();
        layout();
        draw();
      },
      mark(cells) {
        V.marks = normMarks(cells);
        needDraw = true;
        wake();
      },
      pulse(x, y, opts2) {
        if (x == null) V.pulses.length = 0;
        else V.pulses.push({ x: x | 0, y: y | 0, t0: now(), dur: (opts2 && opts2.ms) || 2600 });
        needDraw = true;
        wake();
      },
      celebrate() {
        celebrate();
      },
      resize() {
        if (layout()) draw();
      },
      destroy() {
        if (!alive) return;
        halt();
        alive = false;
        if (raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(raf);
        raf = 0;
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = 0;
        if (ro) ro.disconnect();
        if (io) io.disconnect();
        if (typeof document !== 'undefined') document.removeEventListener('visibilitychange', onVis);
        if (typeof window !== 'undefined') window.removeEventListener('resize', scheduleLayout);
        canvas.removeEventListener('pointerup', onPointerUp);
        tapFns.clear();
        V.staticCv = null;
      },
      cellAt(clientX, clientY) {
        const r = canvas.getBoundingClientRect();
        if (!r.width || !r.height) return null;
        const px = ((clientX - r.left) * canvas.width) / r.width - V.ox;
        const py = ((clientY - r.top) * canvas.height) / r.height - V.oy;
        const x = Math.floor(px / V.T), y = Math.floor(py / V.T);
        return x >= 0 && y >= 0 && x < V.w && y < V.h ? { x, y } : null;
      },
      cellRect(x, y) {
        const r = canvas.getBoundingClientRect();
        const kx = r.width / (canvas.width || 1), ky = r.height / (canvas.height || 1);
        return { left: r.left + (V.ox + cellX(V, x)) * kx, top: r.top + (V.oy + cellX(V, y)) * ky, width: V.T * kx, height: V.T * ky };
      },
      onCell(fn) {
        tapFns.add(fn);
        return () => tapFns.delete(fn);
      },
      hero() {
        return { x: V.hx, y: V.hy, dir: V.dir };
      },
      busy() {
        return !!V.act;
      },
      _view: V, // review pages / tests only
    };

    function celebrate() {
      const t = now();
      if (t - V.lastConfetti < 2600) return; // one shower at a time (auto on success + a manual call)
      V.lastConfetti = t;
      V.cheerUntil = t + 2400; // the hero cheers (hero.cheer) while the blocks rain
      if (V.boss && !V.bossFly) V.bossFly = t; // the boss flies away
      const n = V.rm ? 14 : 46;
      const top = -V.oy / V.m - 4;
      const W = Math.max(48, V.w * 16);
      const x0 = (V.w * 16 - W) / 2;
      for (let k = 0; k < n; k++) {
        const cc = CONFETTI[k % CONFETTI.length];
        emit(V, x0 + rnd(0, W), top - rnd(0, 40), rnd(-16, 16), rnd(15, 55), 70, rnd(1800, 2600), 3, cc[0], cc[1], V.rm ? 0 : rnd(3, 9));
      }
      needDraw = true;
      wake();
    }

    layout();
    draw();
    wake();
    if (!canvas.clientWidth) scheduleLayout();
    return api;
  };

  // pure helpers for tests (no DOM)
  board._internal = {
    durFor, speedMs, decorMask, isCart: (level, o) => isCart(MC.parse(level), o), TERMINAL, spr, fcv, tinted, render,
    // a DOM-free view of one map (cells, sprites, decor, head-room) for logic tests
    view(level, gi, o) {
      const V = newView(level, o || {});
      loadGrid(V, gi || 0);
      return V;
    },
  };
})();

    if (!raw) {
      const miss = h('div', { class: 'lv lv--missing' }, h('div', { class: 'lv-say-text' }, 'Bu bölüm henüz hazır değil.'));
      root.append(miss);
      S = { n, el: miss, root, cleanup: [], token: ++TOK };
      miss.append(btn({ icon: 'ui.home', label: 'Harita', onTap: () => go('map') }));
      return;
    }
    const L = MC.parse(raw);
    const world = MC.getWorld(L.world) || {};
    let biome = world.biome;
    if (!biome && MC.gfx && MC.gfx.biomeOf) { try { biome = MC.gfx.biomeOf(L.world); } catch (e) { biome = null; } }
    biome = biome || 'plains';
    S = {
      n, raw, L, world, biome, root,
      token: ++TOK, running: false, step: null, stepBusy: false, busy: false, done: false, revealing: false,
      fails: 0, tries: 0, solutionShown: false, hintUsed: false,
      board: NULL_BOARD, ed: null, hlEd: null, palBtns: {}, tabs: [], tab: 0,
      tut: null, hand: null, handTarget: null, cleanup: [],
    };
    const el = h('div', { class: `lv lv--${L.type} biome-${biome}${L.grids.length > 1 ? ' lv--multi' : ''}`, 'data-level': String(n) });
    S.el = el;
    root.append(el);
    setBackdrop();
    el.append(topBar(), sayRow());
    if (L.type === 'order') buildOrder();
    else {
      el.append(stageEl());
      if (L.type === 'predict') buildPredict();
      else if (L.type === 'choose') buildChoose();
      else buildEditor();
    }
    el.addEventListener('pointerup', onCapture, true);
    el.addEventListener('click', onCapture, true);
    if (L.type !== 'order') createBoard();
    try { if (MC.audio && MC.audio.setBiome) MC.audio.setBiome(biome); } catch (e) { /* optional */ }
    const onResize = () => refreshHand();
    window.addEventListener('resize', onResize);
    S.cleanup.push(() => window.removeEventListener('resize', onResize));
    const key = L.intro;
    if (key && MC.intros[key] && !store.introSeen(key)) showIntro(key, true);
    else begin();
  }

  function unmount() {
    if (!S) return;
    const s = S;
    S = null;
    TOK++;
    try { if (s.board && s.board.stop) s.board.stop(); } catch (e) { /* ignore */ }
    try { if (s.board && s.board.destroy) s.board.destroy(); } catch (e) { /* ignore */ }
    if (s.introCtl) { try { s.introCtl.close(); } catch (e) { /* ignore */ } }
    if (s.demo) s.demo.stop();
    if (s.ed) s.ed.destroy();
    for (const c of s.cards || []) c.ed.destroy();
    for (const f of s.cleanup) { try { f(); } catch (e) { /* ignore */ } }
    try { if (MC.speech && MC.speech.stop) MC.speech.stop(); } catch (e) { /* ignore */ }
    cancelAnimationFrame(s.handRaf);
    if (s.el) s.el.remove();
  }

  function setBackdrop() {
    const name = 'map.' + S.biome;
    if (!has(name) || !MC.gfx || typeof MC.gfx.url !== 'function') return;
    try {
      const url = MC.gfx.url(name, 4);
      if (url) S.el.style.setProperty('--lv-backdrop', `url("${url}")`);
    } catch (e) { /* cosmetic */ }
  }

  function begin() {
    if (!S) return;
    speakStart();
    tutStart();
  }
  function introLine() {
    const base = S.L.say || '';
    return S.L.type === 'fix' ? 'Köylü bunu yazdı, bir yerde karışmış. ' + base : base;
  }
  function speakStart() {
    const tok = S.token;
    const go1 = () => { if (S && S.token === tok) say(introLine()); };
    const ua = typeof navigator !== 'undefined' ? navigator.userActivation : null;
    if (ua && !ua.hasBeenActive) {
      const once = () => { document.removeEventListener('pointerdown', once, true); go1(); };
      document.addEventListener('pointerdown', once, true);
      S.cleanup.push(() => document.removeEventListener('pointerdown', once, true));
    } else setTimeout(go1, 200);
  }

  // ------------------------------------------------------------------ top bar + instruction row
  function topBar() {
    const L = S.L;
    const home = btn({ icon: 'ui.home', aria: 'Harita', cls: 'lv-top-btn lv-home', onTap: () => { sfx('tap'); go('map', { focus: S.n }); } });
    const title = h('div', { class: 'lv-title' },
      h('span', { class: 'lv-num', role: 'img', 'aria-label': 'Bölüm ' + S.n }, num(S.n, 21, { color: '#4a3200', shadow: '#fff2a0' })),
      h('span', { class: 'lv-titles' },
        h('span', { class: 'lv-world' }, S.world.name || ''),
        h('span', { class: 'lv-name' }, L.name || '')));
    const listen = btn({ icon: 'ui.listen', aria: 'Dinle', cls: 'lv-top-btn lv-listen needs-speech', onTap: () => say(introLine()) });
    if (MC.ui && typeof MC.ui.soundToggle === 'function') {
      try {
        const t = MC.ui.soundToggle({ size: 'sm' });
        t.classList.add('lv-top-btn', 'lv-sound');
        return h('div', { class: 'lv-top' }, home, title, listen, t);
      } catch (e) { /* fall back to our own toggle */ }
    }
    const snd = btn({ icon: store.settings().sound === false ? 'ui.mute' : 'ui.sound', aria: 'Ses', cls: 'lv-top-btn lv-sound' });
    snd.addEventListener('click', () => {
      const on = store.settings().sound === false;
      store.set('sound', on);
      setBtn(snd, on ? 'ui.sound' : 'ui.mute', null);
      snd.setAttribute('aria-label', on ? 'Ses açık' : 'Ses kapalı');
      if (on) sfx('tap');
    });
    return h('div', { class: 'lv-top' }, home, title, listen, snd);
  }

  function sayRow() {
    const L = S.L;
    const text = h('button', { type: 'button', class: 'lv-say', 'aria-label': 'Görevi dinle' }, h('span', { class: 'lv-say-text' }, L.say || ''));
    text.addEventListener('click', () => say(introLine()));
    const row = h('div', { class: 'lv-sayrow' }, text);
    if (L.intro && MC.intros[L.intro]) {
      S.introBtn = btn({ aria: 'Nasıl oynanır?', cls: 'lv-help lv-q', onTap: () => { if (!S.revealing) showIntro(L.intro, false); } });
      S.introBtn.append(num('?', 28));
      row.append(S.introBtn);
    }
    S.hintBtn = btn({ icon: has('ui.hint') ? 'ui.hint' : 'villager', label: 'Hmm!', aria: 'İpucu', cls: 'lv-help lv-hint is-hidden', onTap: onHint });
    S.solBtn = btn({ icon: 'ui.solution', label: 'Çözüm', aria: 'Çözümü göster', variant: 'gold', cls: 'lv-help lv-sol is-hidden', onTap: onSolution });
    row.append(S.hintBtn, S.solBtn);
    return row;
  }

  // ------------------------------------------------------------------ board + map tabs
  function stageEl() {
    const stage = h('div', { class: 'lv-stage' });
    S.stage = stage;
    if (S.L.grids.length > 1) { S.tabsRow = tabsEl(); stage.append(S.tabsRow); }
    const canvas = h('canvas', { class: 'lv-canvas', 'aria-label': 'Oyun alanı' });
    const wrap = h('div', { class: 'lv-boardwrap' }, canvas);
    S.canvas = canvas;
    S.boardWrap = wrap;
    stage.append(wrap);
    return stage;
  }

  function createBoard() {
    const B = MC.board;
    if (!B || typeof B.create !== 'function') {
      S.boardWrap.classList.add('is-missing');
      return;
    }
    try { S.board = B.create(S.canvas, S.L, { map: 0 }) || NULL_BOARD; } catch (e) { console.error('[level] board.create', e); S.board = NULL_BOARD; }
    if (S.L.type === 'predict') {
      placeMarks();
      if (typeof S.board.onCell === 'function') {
        const off = S.board.onCell((c) => {
          const k = S.choices.findIndex((q) => q.cell.x === c.x && q.cell.y === c.y);
          if (k >= 0) onPredict(k);
        });
        if (typeof off === 'function') S.cleanup.push(off);
      }
    }
    layoutStage();
    if (typeof ResizeObserver !== 'undefined') {
      let raf = 0;
      const ro = new ResizeObserver(() => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => { bcall('resize'); refreshHand(); });
      });
      ro.observe(S.boardWrap);
      let raf2 = 0;
      const ro2 = new ResizeObserver(() => {
        cancelAnimationFrame(raf2);
        raf2 = requestAnimationFrame(() => { layoutStage(); updateMore(); });
      });
      ro2.observe(S.el);
      S.cleanup.push(() => { ro.disconnect(); ro2.disconnect(); });
    }
  }

  // The board keeps a real share of the screen: it asks for ~44 CSS px tiles (less only when the map is too wide),
  // and the program area gives way (it scrolls) — but never so much that the palette / actions leave the screen.
  function layoutStage() {
    if (!S || !S.stage || !S.el || !S.L.grids.length) return;
    const el = S.el;
    const cs = getComputedStyle(el);
    const H = el.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    if (!H) return;
    let fixed = 0;
    for (const c of el.children) {
      if (c === S.stage || c === S.progWrap) continue;
      const st = getComputedStyle(c);
      if (st.position === 'absolute' || st.position === 'fixed' || st.display === 'none') continue;
      fixed += c.getBoundingClientRect().height;
    }
    let progMin = 0;
    if (S.progWrap) {
      const ed = S.progWrap.firstElementChild;
      const content = ed ? ed.getBoundingClientRect().height + 4 : 0;
      progMin = Math.min(content, S.L.type === 'predict' ? 76 : 88);
    }
    const g = S.L.grids[S.tab || 0] || S.L.grids[0];
    const tabsH = S.tabsRow ? S.tabsRow.getBoundingClientRect().height : 0;
    const w = S.boardWrap.clientWidth || el.clientWidth - 24;
    const tile = Math.min(w / g.w, 44);
    const bossRows = S.L.boss ? 1.5 : 0; // the boss hovers above the top row (45-board)
    const want = Math.ceil(tile * (g.h + 1.25 + bossRows) + tabsH + 8);
    const avail = Math.floor(H - fixed - progMin);
    const min = Math.max(90, Math.min(want, avail));
    S.stage.style.setProperty('--stage-min', min + 'px');
  }

  // "There is more below" cue on the program area when it scrolls.
  function updateMore() {
    if (!S || !S.progWrap || !S.progMore) return;
    const p = S.progWrap;
    const more = p.scrollHeight - p.clientHeight - p.scrollTop > 6;
    S.progMore.classList.toggle('is-on', more);
  }

  function tabsEl() {
    const row = h('div', { class: 'lv-tabs', role: 'tablist' });
    S.tabs = S.L.grids.map((g, i) => {
      const b = h('button', { type: 'button', role: 'tab', class: 'lv-tab' + (i === 0 ? ' is-on' : ''), 'aria-label': `Harita ${i + 1}` });
      let th = null;
      try {
        if (MC.board && MC.board.thumb) th = MC.board.thumb(S.L, 40, { map: i });
        else if (MC.gfx && MC.gfx.thumb) th = MC.gfx.thumb(S.L, 40, { map: i });
      } catch (e) { th = null; }
      if (th) { th.classList.add('lv-tab-thumb'); b.append(th); }
      b.append(h('span', { class: 'lv-tab-num' }, num(i + 1, 21, { color: '#1d1d22', shadow: null })), h('span', { class: 'lv-tab-st', 'aria-hidden': 'true' }));
      b.addEventListener('click', () => {
        if (S.revealing || S.busy) return;
        stopRun(false);
        selectTab(i);
        sfx('tap');
      });
      row.append(b);
      return b;
    });
    return row;
  }
  function selectTab(i) {
    S.tab = i;
    S.tabs.forEach((t, k) => { t.classList.toggle('is-on', k === i); t.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
    bcall('setMap', i);
    if (S.L.type === 'predict') placeMarks();
    layoutStage();
  }
  function tabState(i, st) {
    const t = S.tabs[i];
    if (!t) return;
    t.classList.remove('is-ok', 'is-bad');
    const s = t.querySelector('.lv-tab-st');
    s.textContent = '';
    if (st) t.classList.add('is-' + st);
    if (st === 'ok') s.append(icon('ui.check', 16));
  }
  const clearTabStates = () => S.tabs.forEach((t, i) => tabState(i, null));
  function resetBoard() {
    if (S.tabs.length) bcall('setMap', S.tab || 0);
    else bcall('reset');
    if (S.L.type === 'predict') placeMarks();
  }

  // ------------------------------------------------------------------ build / fix
  function buildEditor() {
    const L = S.L;
    const progWrap = h('div', { class: 'lv-prog' });
    S.progWrap = progWrap;
    S.el.append(progWrap);
    S.ed = MC.editor.create(progWrap, {
      level: S.raw,
      program: L.start || [],
      onChange: onEdit,
      onRender: () => { refreshHand(); requestAnimationFrame(updateMore); },
    });
    S.hlEd = S.ed;
    progMoreEl(progWrap);
    S.el.append(paletteEl(), actionsEl());
  }
  function progMoreEl(progWrap) {
    S.progMore = h('div', { class: 'lv-prog-more', 'aria-hidden': 'true' }, h('span', { class: 'lv-prog-more-arrow' }));
    progWrap.append(S.progMore);
    progWrap.addEventListener('scroll', updateMore, { passive: true });
  }
  function onEdit() {
    if (!S) return;
    if (S.running || S.step || S.dirtyBoard) stopRun(true);
    S.dirtyBoard = false;
    clearTabStates();
  }

  // Palette rows (≤ 5 per row): arrows on one row, the pickaxes / blocks of the same directions under them (in
  // the arrows' order), loops / conditions / recipes after that. Falls back to plain rows of 5 when grouping
  // would need more rows than the plain layout.
  function paletteRows(ops) {
    const PER = 5;
    const grp = (op) => (MC.paletteInfo[op] || {}).group;
    const moves = ops.filter((op) => grp(op) === 'move' || grp(op) === 'turn');
    // 4–5 entries mixing arrows with Kaz / Koy: still two rows, so 'Kaz ←' never sits among the arrows
    const split = ops.length >= 4 && moves.length >= 2 && ops.some((op) => grp(op) === 'mine' || grp(op) === 'place');
    if (ops.length <= PER && !split) return [ops];
    const minRows = Math.max(Math.ceil(ops.length / PER), split ? 2 : 1);
    const col = (op) => { const i = moves.findIndex((m) => m.slice(-1) === op.slice(-1)); return i < 0 ? 99 : i; };
    const byDir = (list) => list.map((op, i) => [op, i]).sort((a, b) => col(a[0]) - col(b[0]) || a[1] - b[1]).map((x) => x[0]);
    const mine = byDir(ops.filter((op) => grp(op) === 'mine'));
    const place = byDir(ops.filter((op) => grp(op) === 'place'));
    const rest = ops.filter((op) => !moves.includes(op) && !mine.includes(op) && !place.includes(op));
    let rows = [moves, mine, place, rest].filter((r) => r.length);
    if (rows.some((r) => r.length > PER)) rows = null;
    while (rows && rows.length > minRows) {
      let best = -1;
      for (let i = 0; i + 1 < rows.length; i++) {
        const s = rows[i].length + rows[i + 1].length;
        if (s <= PER && (best < 0 || s < rows[best].length + rows[best + 1].length)) best = i;
      }
      if (best < 0) { rows = null; break; }
      rows.splice(best, 2, rows[best].concat(rows[best + 1]));
    }
    if (rows) return rows;
    const out = [];
    for (let i = 0; i < ops.length; i += PER) out.push(ops.slice(i, i + PER));
    return out;
  }
  function paletteEl() {
    const pal = h('div', { class: 'lv-palette', role: 'toolbar', 'aria-label': 'Bloklar' });
    const ops = S.L.palette.filter((op) => MC.paletteInfo[op]);
    const rows = paletteRows(ops);
    const cols = Math.max(...rows.map((r) => r.length));
    if (rows.length > 1) {
      // a grid keeps the columns aligned: '←' sits right above 'Kaz ←'
      pal.classList.add('lv-palette--grid');
      pal.style.setProperty('--cols', String(cols));
    }
    for (const row of rows) {
      for (const op of row) {
        const info = MC.paletteInfo[op];
        const b = h('button', { type: 'button', class: `lv-pal g-${info.group}`, 'data-op': op, 'aria-label': info.label, title: info.label }, icon(info.icon, 48));
        b.addEventListener('click', () => onPalette(op));
        S.palBtns[op] = b;
        pal.append(b);
      }
      if (rows.length > 1) for (let k = row.length; k < cols; k++) pal.append(h('span', { class: 'lv-pal-gap', 'aria-hidden': 'true' }));
    }
    if (ops.length > 5) pal.classList.add('lv-palette--many');
    return pal;
  }
  function onPalette(op) {
    if (!S || S.revealing || S.done) return;
    const info = MC.paletteInfo[op];
    const r = S.ed.insertAtom(op);
    if (r === true) {
      say(info.say);
      if (info.note && info.group !== 'call') note(info.note);
      else sfx('tap');
    } else if (r === 'full') {
      sfx('tap');
      nudge(S.delBtn);
    } else sfx('tap');
  }

  function actionsEl() {
    S.delBtn = btn({ icon: 'ui.delete', label: 'Sil', cls: 'lv-act lv-del', onTap: onDelete });
    S.stepBtn = btn({ icon: 'ui.step', label: 'Adım adım', cls: 'lv-act lv-step', onTap: onStep });
    S.runBtn = btn({ icon: 'ui.play', label: 'Çalıştır', variant: 'primary', cls: 'lv-act lv-run', onTap: onRun });
    return h('div', { class: 'lv-actions' }, S.delBtn, S.stepBtn, S.runBtn);
  }
  function setRunUI(on) {
    if (!S || !S.runBtn) return;
    S.runBtn.classList.toggle('is-running', !!on);
    setBtn(S.runBtn, on ? 'ui.reset' : 'ui.play', on ? 'Dur' : 'Çalıştır');
  }
  function onDelete() {
    if (!S || S.revealing || S.done) return;
    if (S.L.type === 'order') return orderUndo();
    const ok = S.ed.del();
    sfx(ok ? 'whoosh' : 'tap');
  }
  function onRun() {
    if (!S || S.revealing || S.done) return;
    if (S.running) { stopRun(true); return; }
    runProgram();
  }

  function stopRun(reset) {
    if (!S) return;
    S.token = ++TOK;
    S.running = false;
    S.step = null;
    S.stepBusy = false;
    bcall('stop');
    if (reset !== false) resetBoard();
    if (S.hlEd) S.hlEd.highlight(null, { kind: 'run' });
    setRunUI(false);
  }

  function onRunEvent(ev) {
    if (!S) return;
    if (S.hlEd) S.hlEd.highlight(ev.path, { kind: 'run', call: ev.call });
  }

  async function runProgram() {
    const prog = S.ed.program();
    if (!prog.main.length) {
      say('Önce bir blok ekle.');
      nudge(S.el.querySelector('.lv-palette'));
      return;
    }
    stopRun(false);
    const tok = S.token;
    S.running = true;
    S.tries++;
    setRunUI(true);
    S.ed.highlight(null);
    clearTabStates();
    const all = MC.runAll(S.L, prog);
    for (let i = 0; i < all.results.length; i++) {
      const r = all.results[i];
      if (S.tabs.length) selectTab(i);
      else bcall('reset');
      await wait(i ? 250 : 80);
      if (!S || tok !== S.token) return;
      await playOn(S.board, r.events, (ev) => { if (S && tok === S.token) onRunEvent(ev); }, () => S && tok === S.token);
      if (!S || tok !== S.token) return;
      S.ed.highlight(null, { kind: 'run' });
      if (!r.ok) {
        S.running = false;
        S.dirtyBoard = true;
        setRunUI(false);
        tabState(i, 'bad');
        failed(r, i, prog);
        return;
      }
      tabState(i, 'ok');
      if (i < all.results.length - 1) {
        await wait(650);
        if (!S || tok !== S.token) return;
      }
    }
    S.running = false;
    setRunUI(false);
    succeed({ program: prog, all, celebrated: true });
  }

  async function onStep() {
    if (!S || S.revealing || S.done || S.stepBusy) return;
    if (S.running) stopRun(true);
    if (!S.step) {
      const prog = S.ed.program();
      if (!prog.main.length) {
        say('Önce bir blok ekle.');
        nudge(S.el.querySelector('.lv-palette'));
        return;
      }
      stopRun(false);
      S.tries++;
      S.step = { all: MC.runAll(S.L, prog), map: 0, idx: 0, prog, tok: S.token };
      if (S.tabs.length) selectTab(0);
      else bcall('reset');
      clearTabStates();
      S.ed.highlight(null);
    }
    const st = S.step;
    const tok = st.tok;
    const r = st.all.results[st.map];
    S.stepBusy = true;
    while (st.idx < r.events.length) {
      const ev = r.events[st.idx++];
      onRunEvent(ev);
      await stepOn(S.board, ev);
      if (!S || tok !== S.token) return;
      if (ATOMIC.has(ev.act)) break;
    }
    S.stepBusy = false;
    if (st.idx < r.events.length) return;
    // this map is finished
    if (!r.ok) {
      S.step = null;
      S.dirtyBoard = true;
      S.ed.highlight(null, { kind: 'run' });
      tabState(st.map, 'bad');
      failed(r, st.map, st.prog);
    } else if (st.map < st.all.results.length - 1) {
      tabState(st.map, 'ok');
      st.map++;
      st.idx = 0;
      await wait(500);
      if (!S || tok !== S.token) return;
      selectTab(st.map);
      S.ed.highlight(null, { kind: 'run' });
    } else {
      tabState(st.map, 'ok');
      S.step = null;
      S.ed.highlight(null, { kind: 'run' });
      succeed({ program: st.prog, all: st.all, celebrated: true });
    }
  }

  // ------------------------------------------------------------------ outcome
  // "Biraz daha ekle" is only true when more steps in one direction would reach the goal; after a wrong arrow
  // (the hero ended off the straight path) he should check his blocks instead of adding more.
  // True when appending plain moves (one straight run, or one turn: →→ then ↓↓) reaches the goal within the
  // level's size limit — i.e. his blocks so far are fine and he only has to continue.
  function moreWouldReach(r, mapIndex, prog) {
    if (!r || r.ok || r.failPath || !prog) return false;
    const moves = S.L.palette.filter((op) => ['U', 'D', 'L', 'R', 'F'].includes(op));
    const limit = S.L.max != null ? S.L.max : (S.L.par || MC.size(prog)) + 3;
    const base = MC.size(prog);
    const tryRun = (tail) => {
      if (base + tail.length > limit) return null;
      try { return MC.run(S.L, Object.assign({}, prog, { main: prog.main.concat(tail) }), { map: mapIndex || 0 }); } catch (e) { return null; }
    };
    for (const a of moves) {
      for (let k = 1; k <= 8; k++) {
        const t1 = Array(k).fill(a);
        const r1 = tryRun(t1);
        if (!r1) break;
        if (r1.ok) return true;
        if (r1.reason !== 'end') break; // bumped / fell: this direction does not lead there
        for (const b of moves) {
          if (b === a) continue;
          for (let j = 1; j <= 8; j++) {
            const r2 = tryRun(t1.concat(Array(j).fill(b)));
            if (!r2) break;
            if (r2.ok) return true;
            if (r2.reason !== 'end') break;
          }
        }
      }
    }
    return false;
  }
  function failLine(r, mapIndex, prog) {
    const line = MC.failSay(r);
    if (r.reason !== 'end' || (r.missing || []).some((m) => m !== 'reach')) return line;
    if (S.L.type === 'choose') return 'Bu program hedefe varamadı.';
    if (moreWouldReach(r, mapIndex, prog)) return 'Hedefe varamadı. Biraz daha ekle.';
    const arrows = S.L.palette.some((op) => ['U', 'D', 'L', 'R'].includes(op));
    return arrows ? 'Hedefe varamadı. Okları kontrol et.' : 'Hedefe varamadı. Blokları kontrol et.';
  }

  function failed(r, mapIndex, prog) {
    S.fails++;
    S.lastFail = { r, map: mapIndex };
    sfx('fail');
    const line = failLine(r, mapIndex, prog);
    say(S.L.grids.length > 1 ? `Harita ${mapIndex + 1}. ${line}` : line);
    if (r.failPath && S.hlEd) S.hlEd.highlight(r.failPath, { kind: 'fail' });
    else if (!r.failPath && S.L.grids[mapIndex || 0]) {
      // the program simply ran out: show what is still waiting (the door, the last gem, the empty target)
      const c = goalCell(r, mapIndex);
      if (c) bcall('pulse', c.x, c.y);
    }
    updateHelp();
  }

  function updateHelp() {
    if (!S) return;
    // each helper announces itself once, after the failure line (queued, not interrupting)
    if (S.fails >= 2 && S.hintBtn.classList.contains('is-hidden')) {
      S.hintBtn.classList.remove('is-hidden');
      S.hintBtn.classList.add('is-attn');
      say('Hmm! Köylü yardım edebilir.', { interrupt: false });
    }
    if (S.fails >= 3 && !S.solutionShown && S.solBtn.classList.contains('is-hidden')) {
      S.solBtn.classList.remove('is-hidden');
      S.solBtn.classList.add('is-new');
      setTimeout(() => { if (S && S.solBtn) S.solBtn.classList.remove('is-new'); }, 4000);
      say('İstersen çözüme bakabilirsin.', { interrupt: false });
    }
    refreshHand();
    layoutStage();
  }

  async function succeed(info) {
    if (!S || S.done) return;
    S.done = true;
    const tok = S.token;
    const L = S.L;
    const size = info.program ? MC.size(info.program) : null;
    const firstTry = S.tries <= 1;
    const stars = MC.stars(S.raw, { solved: true, size, solutionShown: S.solutionShown, firstTry, hintUsed: S.hintUsed });
    const prevBest = store.best(S.n);
    const prev = prevBest ? prevBest.stars || 0 : 0;
    const items = {};
    if (info.all) {
      for (const r of info.all.results) {
        for (const k of Object.keys(r.final.inv || {})) items[k] = (items[k] || 0) + r.final.inv[k];
      }
    }
    const rec = store.record(S.n, { stars, size, program: info.program || null, items }) || {};
    S.el.classList.add('is-won');
    if (S.ed && S.ed.lock) S.ed.lock(true);
    endTut();
    S.handTarget = null;
    refreshHand();
    if (!info.celebrated) bcall('celebrate');
    sfx('win');
    if (!MC.screens.win) say(PRAISE[S.n % PRAISE.length]); // the shell's win screen speaks its own praise
    await wait(1400);
    if (!S || tok !== S.token) return;
    const params = { n: S.n, stars, prev, firstClear: !!rec.firstClear, newStars: rec.newStars || 0, reward: L.reward || null, size, par: L.par, items: rec.added || items, solutionShown: S.solutionShown, firstTry };
    if (MC.screens.win && MC.ui && typeof MC.ui.show === 'function') MC.ui.show('win', params);
    else localWin(params);
  }

  function localWin(p) {
    const stars = h('div', { class: 'lv-win-stars' }, [0, 1, 2].map((i) => icon(i < p.stars ? 'ui.star' : 'ui.star.empty', 48)));
    const next = MC.getLevel(p.n + 1);
    const box = h('div', { class: 'lv-win' },
      h('div', { class: 'lv-win-title' }, 'Başardın!'),
      stars,
      p.reward && has('it.' + p.reward) ? h('div', { class: 'lv-win-reward' }, icon('it.' + p.reward, 48)) : null,
      h('div', { class: 'lv-win-btns' },
        next ? btn({ icon: 'ui.next', label: 'Devam', variant: 'primary', onTap: () => go('level', { n: p.n + 1 }) }) : null,
        btn({ icon: 'ui.reset', label: 'Tekrar', onTap: () => go('level', { n: p.n }) }),
        btn({ icon: 'ui.home', label: 'Harita', onTap: () => go('map') })));
    overlay(box, {});
  }

  // ------------------------------------------------------------------ hint + solution
  function goalCell(r, map) {
    const g = S.L.grids[map || 0];
    const rows = r && r.final && r.final.grid ? r.final.grid : g.cells.map((row) => row.join(''));
    const find = (test) => {
      for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) if (test(MC.kindOf(rows[y][x], S.L.legendMap))) return { x, y };
      }
      return null;
    };
    const m = (r && r.missing) || [];
    if (m.includes('gems')) return find((k) => /^item_/.test(k));
    if (m.includes('fill')) return find((k) => k === 'target');
    if (m.includes('mine')) return find((k) => S.L.goal.mine.some((ch) => MC.kindOf(ch, S.L.legendMap) === k));
    return find((k) => k === 'goal' || k === 'portal');
  }

  function onHint() {
    if (!S || S.revealing || S.done) return;
    S.hintUsed = true;
    S.hintBtn.classList.remove('is-attn');
    sfx('tap');
    const L = S.L;
    say('Hmm! ' + (L.hint || DEFAULT_HINT[L.type] || DEFAULT_HINT.build));
    if (L.type === 'build' || L.type === 'fix') {
      stopRun(true);
      const prog = S.ed.program();
      const all = MC.runAll(L, prog);
      const bad = all.results.findIndex((r) => !r.ok);
      if (bad < 0) return;
      const r = all.results[bad];
      if (S.tabs.length && bad !== S.tab) selectTab(bad);
      if (r.failPath) {
        S.ed.highlight(r.failPath, { kind: 'hint' });
        const ev = r.events[r.events.length - 1];
        const g = L.grids[bad];
        const inside = (c) => c && c.x >= 0 && c.y >= 0 && c.x < g.w && c.y < g.h;
        const cell = ev && (inside(ev.to) ? ev.to : ev.from);
        if (cell) bcall('pulse', cell.x, cell.y);
      } else {
        // the program ran out: point at the end of the main program (where more blocks would go) only when more
        // steps really lead to the goal; otherwise glow the last block ("check from here").
        const last = prog.main.length - 1;
        if (moreWouldReach(r, bad, prog)) {
          S.ed.activate('main', true);
          const f = S.ed.target('frame');
          if (f) f.classList.add('is-hint');
          else if (last >= 0) S.ed.highlight(['main', last], { kind: 'hint' });
        } else if (last >= 0) S.ed.highlight(['main', last], { kind: 'hint' });
        const c = goalCell(r, bad);
        if (c) bcall('pulse', c.x, c.y);
      }
    } else if (L.type === 'predict') {
      S.ed.highlight(['main', 0], { kind: 'hint' });
    } else if (L.type === 'order') {
      const o = S.order;
      const wrong = o.slots.findIndex((ci, i) => ci != null && ci !== i);
      if (wrong >= 0) {
        const sl = S.orderEls.slots.querySelector(`[data-slot="${wrong}"]`);
        if (sl) sl.classList.add('is-hint');
      } else {
        const next = o.slots.findIndex((ci) => ci == null);
        const p = o.pool.indexOf(next);
        const card = p >= 0 ? S.orderEls.pool.querySelector(`[data-pool="${p}"]`) : null;
        if (card) card.classList.add('is-hint');
      }
    }
  }

  function onSolution() {
    if (!S || S.revealing || S.done) return;
    const now = Date.now();
    if (!S.solArm || now - S.solArm > 5000) {
      S.solArm = now;
      S.solBtn.classList.add('is-armed');
      say('Çözümü görmek için bir daha dokun.');
      return;
    }
    S.solArm = 0;
    S.solBtn.classList.remove('is-armed');
    revealSolution();
  }

  async function revealSolution() {
    const L = S.L;
    S.solutionShown = true;
    S.revealing = true;
    S.solBtn.classList.add('is-hidden');
    stopRun(true);
    endTut();
    const tok = S.token;
    const alive = () => S && S.token === tok;
    if (L.type === 'build' || L.type === 'fix') {
      const funcs = (L.funcs || []).filter((f) => f === 'A' || f === 'B');
      const steps = MC.editor.revealSteps(L.solution, funcs);
      S.ed.lock(true);
      S.el.classList.add('is-revealing');
      const empty = { main: [] };
      for (const f of funcs) empty[f] = [];
      S.ed.set(empty);
      say('Birlikte bakalım.');
      await wait(1300);
      for (const st of steps) {
        if (!alive()) return;
        S.ed.set(st.prog);
        S.ed.activate(st.path[0], true); // the strip being written is the active one (outline + frame)
        S.ed.highlight(st.path, { kind: 'hint' });
        say(MC.editor.nodeSay(st.node));
        sfx('tap');
        await wait(1150);
      }
      if (!alive()) return;
      S.ed.highlight(null);
      S.ed.activate('main', true);
      S.ed.lock(false);
      S.el.classList.remove('is-revealing');
      S.revealing = false;
      say('Şimdi Çalıştır’a bas.');
      pointAt(S.runBtn);
    } else if (L.type === 'predict') {
      const r = MC.run(L, L.start, { map: 0 });
      const k = S.choices.findIndex((c) => c.cell.x === r.final.x && c.cell.y === r.final.y);
      S.revealing = false;
      say('Emir burada durur.');
      bcall('pulse', r.final.x, r.final.y);
      if (k >= 0) { S.choiceBtns[k].classList.add('is-hint'); pointAt(S.choiceBtns[k]); }
    } else if (L.type === 'choose') {
      const k = S.cards.findIndex((c) => MC.runAll(L, c.prog).ok);
      S.revealing = false;
      say('Bu program çalışır.');
      if (k >= 0) { S.cards[k].card.classList.add('is-hint'); pointAt(S.cards[k].card); }
    } else if (L.type === 'order') {
      const o = S.order;
      o.slots = o.slots.map(() => null);
      o.pool = o.perm.slice();
      renderOrder();
      await wait(600);
      for (let i = 0; i < o.slots.length; i++) {
        if (!alive()) return;
        const p = o.pool.indexOf(i);
        o.pool[p] = null;
        o.slots[i] = i;
        renderOrder();
        say(o.cards[i].say);
        sfx('place');
        await wait(1100);
      }
      if (!alive()) return;
      S.revealing = false;
      say('Şimdi Kontrol et.');
      pointAt(S.checkBtn);
    }
  }

  // ------------------------------------------------------------------ predict
  function buildPredict() {
    const L = S.L;
    const progWrap = h('div', { class: 'lv-prog lv-prog--ro lv-prog--trace', role: 'button', 'aria-label': 'Programı oku' });
    S.progWrap = progWrap;
    S.el.append(progWrap);
    S.ed = MC.editor.create(progWrap, { program: L.start || [], readonly: true, size: 'lg' });
    S.hlEd = S.ed;
    progMoreEl(progWrap);
    progWrap.addEventListener('click', tracePredict);
    const ch = L.choices || [];
    const order = seededOrder(S.n, ch.length);
    S.choices = order.map((ci, k) => ({ cell: { x: ch[ci][0], y: ch[ci][1] }, sprite: MARKS[k] }));
    const row = h('div', { class: 'lv-choices' });
    S.choiceRow = row;
    S.choiceBtns = S.choices.map((c, k) => {
      const b = h('button', { type: 'button', class: 'lv-choice', 'aria-label': MARK_NAMES[k] }, icon(c.sprite, 48));
      b.addEventListener('click', () => onPredict(k));
      row.append(b);
      return b;
    });
    S.el.append(row);
  }
  // Tapping the read-only program reads it aloud block by block, glowing each one (a tracing aid: the hero does
  // not move), then the hand points at the shape buttons.
  async function tracePredict() {
    if (!S || S.busy || S.done || S.revealing || S.tracing) return;
    S.tracing = true;
    const tok = S.token;
    const funcs = (S.L.funcs || []).filter((f) => f === 'A' || f === 'B');
    const steps = MC.editor.revealSteps(S.L.start || [], funcs);
    sfx('tap');
    await wait(150);
    for (const st of steps) {
      if (!S || S.token !== tok) { if (S) S.tracing = false; return; }
      S.ed.highlight(st.path, { kind: 'run' });
      say(MC.editor.nodeSay(st.node));
      if (typeof st.node === 'string') note((MC.atoms[st.node] || {}).note || DIR_NOTE[st.node]);
      await wait(850);
    }
    if (!S || S.token !== tok) { if (S) S.tracing = false; return; }
    S.ed.highlight(null, { kind: 'run' });
    S.tracing = false;
    if (S.done) return;
    say('Emir nerede durur? Şekle dokun.', { interrupt: false });
    pointAt(S.choiceRow);
  }
  function placeMarks() {
    if (S && S.choices) bcall('mark', S.choices.map((c, k) => ({ x: c.cell.x, y: c.cell.y, sprite: c.sprite, dim: S.choiceBtns && S.choiceBtns[k].classList.contains('is-tried') })));
  }
  async function onPredict(k) {
    if (!S || S.busy || S.done || S.revealing) return;
    S.busy = true;
    S.tries++;
    S.handTarget = null;
    S.choiceBtns.forEach((b, i) => b.classList.toggle('is-picked', i === k));
    sfx('tap');
    say(MARK_NAMES[k]);
    stopRun(true);
    const tok = S.token;
    const r = MC.run(S.L, S.L.start || [], { map: 0 });
    await wait(450);
    if (!S || tok !== S.token) return;
    await playOn(S.board, r.events, (ev) => { if (S && tok === S.token) onRunEvent(ev); }, () => S && tok === S.token);
    if (!S || tok !== S.token) return;
    S.ed.highlight(null, { kind: 'run' });
    const c = S.choices[k].cell;
    if (r.final.x === c.x && r.final.y === c.y) {
      S.busy = false;
      succeed({ program: null });
      return;
    }
    S.fails++;
    S.choiceBtns[k].classList.remove('is-picked');
    S.choiceBtns[k].classList.add('is-tried');
    placeMarks();
    sfx('fail');
    say('Emir başka yerde durdu. Tekrar dene.');
    bcall('pulse', r.final.x, r.final.y);
    S.busy = false;
    updateHelp();
  }

  // ------------------------------------------------------------------ choose
  function buildChoose() {
    const L = S.L;
    const opts = L.options || [];
    const order = seededOrder(S.n, opts.length);
    const list = h('div', { class: 'lv-cards' });
    S.cards = order.map((oi, k) => {
      const card = h('button', { type: 'button', class: 'lv-optcard', 'aria-label': 'Program ' + LETTERS[k] });
      const body = h('div', { class: 'lv-optcard-prog' });
      card.append(h('span', { class: 'lv-optcard-let' }, LETTERS[k]), body);
      const ed = MC.editor.create(body, { program: opts[oi], readonly: true, size: 'md' });
      card.addEventListener('click', () => onChoose(k));
      list.append(card);
      return { card, ed, prog: MC.norm(opts[oi]) };
    });
    S.el.append(list);
  }
  async function onChoose(k) {
    if (!S || S.busy || S.done || S.revealing) return;
    const c = S.cards[k];
    S.busy = true;
    S.tries++;
    S.handTarget = null;
    S.cards.forEach((x, i) => { x.card.classList.toggle('is-picked', i === k); x.ed.highlight(null); });
    sfx('tap');
    say('Program ' + LETTERS[k]);
    stopRun(true);
    S.hlEd = c.ed;
    const tok = S.token;
    const all = MC.runAll(S.L, c.prog);
    clearTabStates();
    await wait(450);
    for (let i = 0; i < all.results.length; i++) {
      if (!S || tok !== S.token) return;
      const r = all.results[i];
      if (S.tabs.length) selectTab(i);
      else bcall('reset');
      await wait(i ? 250 : 60);
      await playOn(S.board, r.events, (ev) => { if (S && tok === S.token) onRunEvent(ev); }, () => S && tok === S.token);
      if (!S || tok !== S.token) return;
      c.ed.highlight(null, { kind: 'run' });
      if (!r.ok) {
        tabState(i, 'bad');
        c.card.classList.remove('is-picked');
        c.card.classList.add('is-tried');
        S.busy = false;
        failed(r, i, c.prog);
        return;
      }
      tabState(i, 'ok');
      if (i < all.results.length - 1) await wait(600);
    }
    S.busy = false;
    succeed({ program: null, all, celebrated: true });
  }

  // ------------------------------------------------------------------ order (crafting table)
  function buildOrder() {
    const L = S.L;
    const cards = L.cards || [];
    const perm = orderPerm(S.n, cards.length);
    S.order = { cards, perm, slots: cards.map(() => null), pool: perm.slice() };
    const slots = h('div', { class: 'lv-craft-slots' });
    const table = h('div', { class: 'lv-craft' },
      // header: this recipe's first card → its goal (the last card), not always wood → pickaxe
      h('div', { class: 'lv-craft-head', 'aria-hidden': 'true' },
        icon(cards.length ? cards[0].icon : 'it.wood', 24, { fit: true }), h('span', { class: 'lv-craft-line' }),
        icon(cards.length ? cards[cards.length - 1].icon : 'ui.check', 24, { fit: true })),
      slots);
    const pool = h('div', { class: 'lv-pool' });
    S.orderEls = { slots, pool, table };
    S.el.append(h('div', { class: 'lv-stage lv-stage--craft' }, table, pool));
    S.delBtn = btn({ icon: 'ui.delete', label: 'Sil', cls: 'lv-act lv-del', onTap: onDelete });
    S.checkBtn = btn({ icon: 'ui.check', label: 'Kontrol et', variant: 'primary', cls: 'lv-act lv-run lv-check', onTap: onCheck });
    S.el.append(h('div', { class: 'lv-actions lv-actions--order' }, S.delBtn, S.checkBtn));
    renderOrder();
  }
  function cardFace(c) {
    // fit: tall / wide sprites (20×28 iron golem, portal) scale by their longest side into the 48 px box
    return [icon(c.icon, 48, { fit: true }), h('span', { class: 'lv-card-say' }, c.say || '')];
  }
  function renderOrder() {
    const { cards, slots, pool } = S.order;
    const { slots: sEl, pool: pEl } = S.orderEls;
    sEl.textContent = '';
    slots.forEach((ci, i) => {
      if (i) sEl.append(h('span', { class: 'lv-craft-arrow', 'aria-hidden': 'true' }));
      const slot = h('button', { type: 'button', class: 'lv-slot' + (ci == null ? ' is-empty' : ''), 'data-slot': String(i), 'aria-label': ci == null ? `${i + 1}. boş` : `${i + 1}. ${cards[ci].say}` },
        h('span', { class: 'lv-slot-num' }, ci == null ? num(i + 1, 28, { color: 'rgba(255,255,255,0.6)', shadow: null }) : num(i + 1, 14, { color: '#4a3200', shadow: null })),
        ci == null ? null : h('span', { class: 'lv-card lv-card--in' }, cardFace(cards[ci])));
      slot.addEventListener('click', () => onSlot(i));
      sEl.append(slot);
    });
    pEl.textContent = '';
    pool.forEach((ci, p) => {
      const b = h('button', { type: 'button', class: 'lv-card' + (ci == null ? ' is-gone' : ''), 'data-pool': String(p), 'aria-label': ci == null ? 'boş' : cards[ci].say, tabindex: ci == null ? '-1' : null },
        ci == null ? null : cardFace(cards[ci]));
      b.addEventListener('click', () => onPool(p));
      pEl.append(b);
    });
    if (S.checkBtn) S.checkBtn.classList.toggle('is-ready', slots.every((x) => x != null));
    refreshHand();
  }
  // Crafting moment: the finished item (the last card's picture) pops out of the table.
  function craftPop() {
    const o = S.order;
    const last = o.cards[o.cards.length - 1];
    if (!last || !S.orderEls.table) return;
    const out = h('div', { class: 'lv-craft-out', 'aria-hidden': 'true' }, h('span', { class: 'lv-craft-out-in' }, icon(last.icon, 80, { fit: true })));
    S.orderEls.table.append(out);
    sfx('pickup');
  }
  function orderBusy() { return !S || S.done || S.revealing || S.busy; }
  function onPool(p) {
    if (orderBusy()) return;
    const o = S.order;
    const ci = o.pool[p];
    if (ci == null) return;
    const s = o.slots.indexOf(null);
    if (s < 0) return;
    o.pool[p] = null;
    o.slots[s] = ci;
    say(o.cards[ci].say);
    sfx('place');
    renderOrder();
  }
  function onSlot(i) {
    if (orderBusy()) return;
    const o = S.order;
    const ci = o.slots[i];
    if (ci == null) return;
    o.slots[i] = null;
    o.pool[o.perm.indexOf(ci)] = ci;
    sfx('whoosh');
    renderOrder();
  }
  function orderUndo() {
    if (orderBusy()) return;
    const o = S.order;
    for (let i = o.slots.length - 1; i >= 0; i--) {
      if (o.slots[i] != null) { onSlot(i); return; }
    }
    sfx('tap');
  }
  async function onCheck() {
    if (orderBusy()) return;
    const o = S.order;
    if (!o.slots.every((x) => x != null)) {
      say('Önce bütün kartları diz.');
      nudge(S.orderEls.pool);
      return;
    }
    S.busy = true;
    S.tries++;
    S.handTarget = null;
    const tok = S.token;
    const wrong = o.slots.findIndex((ci, i) => ci !== i);
    const slotEls = [...S.orderEls.slots.querySelectorAll('.lv-slot')];
    if (wrong < 0) {
      for (let i = 0; i < slotEls.length; i++) {
        slotEls[i].classList.add('is-ok');
        note(['C4', 'D4', 'E4', 'G4', 'A4', 'C5'][i % 6]);
        await wait(260);
      }
      if (!S || tok !== S.token) return;
      craftPop();
      await wait(700);
      if (!S || tok !== S.token) return;
      S.busy = false;
      succeed({ program: null });
      return;
    }
    // light up every card that is already right (they stay), shake the first card that is out of place
    for (let i = 0; i < o.slots.length; i++) {
      if (o.slots[i] === i) { slotEls[i].classList.add('is-ok'); await wait(160); }
    }
    if (!S || tok !== S.token) return;
    slotEls[wrong].classList.add('is-fail');
    nudge(slotEls[wrong]);
    S.fails++;
    sfx('fail');
    // what is wrong with that card: an authored `need` line ("Tahta ağaçtan yapılır."), else a generic one.
    // The card in the wrong slot always belongs later (all earlier cards are right).
    const c = o.cards[o.slots[wrong]] || {};
    say(c.need || (c.say ? `${c.say} daha sonra. Önce başka kart lazım.` : 'Sıra biraz karışık. Tekrar dene.'));
    await wait(2200);
    if (!S || tok !== S.token) return;
    for (let i = 0; i < o.slots.length; i++) {
      const ci = o.slots[i];
      if (ci === i || ci == null) continue;
      o.slots[i] = null;
      o.pool[o.perm.indexOf(ci)] = ci;
    }
    S.busy = false;
    renderOrder();
    updateHelp();
  }

  // ------------------------------------------------------------------ guided tutorial (level.tut)
  function tutStart() {
    const steps = Array.isArray(S.L.tut) ? S.L.tut.slice() : [];
    if (!steps.length || S.L.type === 'order') return;
    if (store.best(S.n)) return; // already cleared once: no hand-holding
    S.tut = { steps, i: 0, block: S.n <= 3 };
    S.el.classList.add('is-tut');
    refreshHand();
  }
  function endTut() {
    if (!S) return;
    S.tut = null;
    S.el.classList.remove('is-tut');
  }
  function tutTarget() {
    if (!S || !S.tut) return null;
    const t = S.tut.steps[S.tut.i];
    if (t == null) return null;
    if (t === 'run') return S.runBtn;
    if (t === 'step') return S.stepBtn;
    if (t === 'delete') return S.delBtn;
    if (t === 'choices' || t === 'mark') return S.choiceRow || null;
    if (/^tab:\d+$/.test(t)) return S.tabs[Number(t.slice(4)) - 1] || null;
    if (!S.ed) return null;
    // 'slot:main.0.do' = the faint "+" at the end of that lane (the frame is elsewhere)
    if (/^slot:/.test(t)) return S.ed.el.querySelector('[data-act="slot"][data-seq="' + t.slice(5) + '"]');
    if (t === 'count' || t === 'cond') return S.ed.target(t);
    if (t === 'main') return S.ed.target('strip:main');
    if (/^strip:/.test(t)) return S.ed.target(t);
    if (/^call:/.test(t)) return S.palBtns[t.slice(5)] || null;
    if ((t === 'A' || t === 'B') && (S.L.funcs || []).includes(t)) {
      // bare 'A': first the recipe strip (while it is empty), afterwards the palette call
      const body = S.ed.program()[t] || [];
      if (S.ed.active() !== t && !body.length) return S.ed.target('strip:' + t);
    }
    return S.palBtns[t] || null;
  }
  function pointAt(el) {
    if (!S) return;
    S.handTarget = el || null;
    refreshHand();
  }
  function refreshHand() {
    if (!S || !S.el) return;
    cancelAnimationFrame(S.handRaf);
    S.handRaf = requestAnimationFrame(placeHand);
  }
  // A tutorial step that is already done needs no tap: a 'slot:' step whose lane already holds the frame (e.g. the
  // editor put the frame into the empty box of a pre-filled program).
  function tutSkipDone() {
    for (let guard = 0; S && S.tut && guard < 8; guard++) {
      const t = S.tut.steps[S.tut.i];
      let done = false;
      if (typeof t === 'string' && /^slot:/.test(t) && S.ed) {
        const f = S.ed.target('frame');
        const seq = f && f.parentElement ? f.parentElement.closest('[data-seq]') : null;
        done = !!seq && seq.dataset.seq === t.slice(5) && !S.ed.el.querySelector('[data-act="slot"][data-seq="' + t.slice(5) + '"]');
      }
      if (!done) return;
      S.tut.i++;

  }
  function placeHand() {
    if (!S || !S.el) return;
    if (!S.handTarget) tutSkipDone();
    if (!S) return;
    const tgt = S.handTarget || tutTarget();
    if (!tgt || !tgt.isConnected) {
      if (S.hand) S.hand.classList.add('is-hidden');
      return;
    }
    if (!S.hand) {
      S.hand = h('div', { class: 'lv-hand is-hidden', 'aria-hidden': 'true' }, h('div', { class: 'lv-hand-in' }, icon(has('ui.hand') ? 'ui.hand' : 'lv.hand', 48)));
      S.el.append(S.hand);
    }
    const r = tgt.getBoundingClientRect();
    const b = S.el.getBoundingClientRect();
    const size = 48;
    let x = r.left - b.left + r.width / 2 - size * 0.4;
    let y = r.top - b.top - size + 12;
    let flip = false;
    if (y < 56) { y = r.bottom - b.top - 12; flip = true; }
    x = Math.max(0, Math.min(x, b.width - size));
    S.hand.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    S.hand.classList.toggle('is-flip', flip);
    S.hand.classList.remove('is-hidden');
  }
  function onCapture(e) {
    if (!S) return;
    if (e.type === 'click') { try { if (MC.audio && MC.audio.unlock) MC.audio.unlock(); } catch (err) { /* optional */ } }
    if (S.handTarget) {
      if (e.type === 'click' && S.handTarget.contains(e.target)) {
        S.handTarget = null;
        // the same element may also be the tutorial's current target (predict: the shape row)
        const tt = S.tut && tutTarget();
        if (tt && tt.contains(e.target)) {
          S.tut.i++;
          if (S.tut.i >= S.tut.steps.length) endTut();

      }
      return;
    }
    if (!S.tut) return;
    const tgt = tutTarget();
    if (tgt && tgt.contains(e.target)) {
      if (e.type === 'click') {
        const at = S.tut.i;
        setTimeout(() => {
          if (!S || !S.tut) return;
          if (S.tut.i !== at) { refreshHand(); return; } // already moved on (a 'slot:' step completed by the tap itself)
          S.tut.i++;
          if (S.tut.i >= S.tut.steps.length) endTut();
          refreshHand();
        }, 0);
      }
      return;
    }
    if (!S.tut.block) return;
    if (e.target.closest('.lv-top, .lv-sayrow, .lv-ov')) return;

    e.preventDefault();
    if (e.type === 'click' && S.hand) {
      S.hand.classList.remove('is-wiggle');
      void S.hand.offsetWidth;
      S.hand.classList.add('is-wiggle');
    }
  }

  // ------------------------------------------------------------------ concept intro overlay
  function showIntro(key, first) {
    const I = MC.intros[key];
    if (!I) { if (first) begin(); return; }
    if (!first) stopRun(true);
    const demoWrap = h('div', { class: 'lv-intro-demo' });
    const listen = btn({ icon: 'ui.listen', aria: 'Dinle', cls: 'lv-intro-listen needs-speech', onTap: () => say(I.say) });
    const ok = btn({ icon: 'ui.play', label: 'Hadi!', variant: 'primary', cls: 'lv-intro-ok', onTap: () => close() });

      h('div', { class: 'lv-intro-sayrow' }, h('div', { class: 'lv-intro-say' }, I.say), listen),
      ok);

    const onClose = () => {

      if (S.demo) { S.demo.stop(); S.demo = null; }

    const close = () => {
      try { if (ctl && ctl.close) ctl.close(); } catch (e) { /* ignore */ }

    S.introCtl = ctlRef;

  function startDemo(d, wrap) {
    let alive = true;
    const isAlive = () => alive && !!S;
    if (d.cards) {
      const row = h('div', { class: 'lv-intro-cards' });
      wrap.append(row);
      const slots = d.cards.map((c, i) => {
        const sl = h('div', { class: 'lv-slot is-empty' }, h('span', { class: 'lv-slot-num' }, num(i + 1, 21, { color: 'rgba(255,255,255,0.6)', shadow: null })));
        if (i) row.append(h('span', { class: 'lv-craft-arrow', 'aria-hidden': 'true' }));

      });

          slots.forEach((sl, i) => { sl.classList.add('is-empty'); sl.classList.remove('is-ok'); sl.textContent = ''; sl.append(h('span', { class: 'lv-slot-num' }, num(i + 1, 21, { color: 'rgba(255,255,255,0.6)', shadow: null }))); });
          await wait(700);
          for (let i = 0; i < slots.length && isAlive(); i++) {
            slots[i].classList.remove('is-empty');
            slots[i].textContent = '';
            slots[i].append(h('span', { class: 'lv-slot-num' }, num(i + 1, 14, { color: '#4a3200', shadow: null })), h('span', { class: 'lv-card lv-card--in' }, icon(d.cards[i], 40, { fit: true })));
            await wait(650);
          }
          slots.forEach((sl) => sl.classList.add('is-ok'));
          await wait(1400);
        }
      })();
      return { stop() { alive = false; } };
    }
    const lvl = { n: 0, world: S.L.world, name: 'Örnek', type: 'build', palette: d.palette || [], dir: d.dir || 'R', say: '', hint: '' };
    if (d.maps) lvl.maps = d.maps;
    else lvl.map = d.map || ['@.'];
    const nMaps = (d.maps || [0]).length;
    const canvas = h('canvas', { class: 'lv-intro-canvas' });
    const bw = h('div', { class: 'lv-intro-board' }, canvas);
    // board box follows the demo map's shape (one-row maps stay short, square maps get room)
    const rows = (d.maps || [lvl.map]).map((m) => m.length);
    const cols = (d.maps || [lvl.map]).map((m) => m[0].length);
    const aspect = (Math.max(...rows) + 1.3) / Math.max(...cols);
    bw.style.height = Math.round(Math.max(120, Math.min(250, 360 * aspect))) + 'px';
    const chips = nMaps > 1 ? h('div', { class: 'lv-intro-maps' }, d.maps.map((m, i) => h('span', { class: 'lv-intro-chip' }, num(i + 1, 14, { shadow: null })))) : null;
    const pw = h('div', { class: 'lv-intro-prog' });
    wrap.append(...[chips, bw, pw].filter(Boolean));
    const progs = d.seq || [d.program || []];
    const ed = MC.editor.create(pw, { program: progs[0], readonly: true, size: 'md' });
    let board = null;
    const marks = (d.marks || []).map((c, i) => ({ x: c[0], y: c[1], sprite: MARKS[i % 3] }));
    const bc = (name, ...a) => { if (board && typeof board[name] === 'function') { try { return board[name](...a); } catch (e) { console.error('[level] demo board.' + name, e); } } return undefined; };
    requestAnimationFrame(async () => {
      if (!isAlive()) return;
      try { if (MC.board && MC.board.create) board = MC.board.create(canvas, lvl, { map: 0, muted: true }); } catch (e) { console.error('[level] demo board', e); board = null; }
      if (!board) bw.classList.add('is-missing');
      await wait(700);
      while (isAlive()) {
        for (const p of progs) {
          if (!isAlive()) break;
          ed.set(p);
          for (let m = 0; m < nMaps && isAlive(); m++) {
            if (chips) [...chips.children].forEach((c, i) => c.classList.toggle('is-on', i === m));
            if (nMaps > 1) bc('setMap', m);

            if (marks.length) bc('mark', marks);

            if (!isAlive()) break;
            const r = MC.run(lvl, p, { map: m });
            await playOn(board, r.events, (ev) => { if (isAlive()) ed.highlight(ev.path, { kind: 'run', call: ev.call }); }, isAlive);
            if (!isAlive()) break;

      stop() {

  // ------------------------------------------------------------------ public

    },
  };
})();

// Blokcraft — program editor (CONTRACT §9, §9b). Tap-only strips of bevelled command blocks.
// Public API

//                insertAtom(op) → true | 'full' | false, del() → bool, size(), isFull(), select(path),

(function () {

  function h(tag, attrs, ...kids) {

        else if (k === 'style') {

    }

  }

  // Fallback glyphs, only used while a sprite is missing (art is written in parallel).
  const GLYPH = {
    'cmd.U': '↑', 'cmd.D': '↓', 'cmd.L': '←', 'cmd.R': '→', 'cmd.F': '⇑', 'cmd.TL': '↰', 'cmd.TR': '↱',
    'cmd.MU': 'K↑', 'cmd.MD': 'K↓', 'cmd.ML': 'K←', 'cmd.MR': 'K→', 'cmd.MF': 'K⇑',
    'cmd.PU': '■↑', 'cmd.PD': '■↓', 'cmd.PL': '■←', 'cmd.PR': '■→', 'cmd.PF': '■⇑',
    'cmd.rep': '↻', 'cmd.until': '⟳', 'cmd.if': '?', 'cmd.else': '/', 'cmd.A': 'A', 'cmd.B': 'B',
    'ui.home': '⌂', 'ui.listen': '♪', 'ui.sound': '♫', 'ui.mute': '×', 'ui.play': '▶', 'ui.step': '▸|',
    'ui.delete': '⌫', 'ui.hint': '?', 'ui.solution': '★', 'ui.check': '✓', 'ui.reset': '↺', 'ui.star': '★',
    'ui.star.empty': '☆', 'ui.next': '›', 'ui.back': '‹',

  function artCanvas(name, px, overrides) {
    const s = MC.art.get(name);
    const rows = MC.art.pixels(name, 0, overrides);
    const c = document.createElement('canvas');
    c.width = s.w;
    c.height = s.h;
    const ctx = c.getContext('2d');
    rows.forEach((row, y) => row.forEach((col, x) => {

    c.style.height = Math.round((px * s.h) / s.w) + 'px';
    c.style.imageRendering = 'pixelated';
    return c;
  }

  // Pixel icon: MC.gfx.icon when available, else draw from the art registry, else a glyph.
  function icon(name, px, opts) {
    const has = MC.art && MC.art.has && MC.art.has(name);
    let el = null;
    if (MC.gfx && typeof MC.gfx.icon === 'function') {
      try { el = MC.gfx.icon(name, px, opts || {}); } catch (e) { el = null; }
      if (el && el.dataset && el.dataset.missing) el = null;
    }
    if (!el && has) {
      try { el = artCanvas(name, px, opts && opts.overrides); } catch (e) { el = null; }
    }
    if (!el) {
      el = h('span', { class: 'px-glyph', style: `width:${px}px;height:${px}px;font-size:${Math.round(px * 0.55)}px;line-height:${px}px` }, GLYPH[name] || '·');

  }

  // Numbers in the shell's bitmap digit font (Pixelify draws 5 like S and 2 like Z — confusing for early readers).
  function num(text, px, opts) {

      try { return G.ptext(t, px, opts || {}); } catch (e) { /* fall back to text */ }
    }

  }

  function say(text, opts) {
    try { if (text && MC.speech && MC.speech.say) MC.speech.say(text, opts); } catch (e) { /* speech is optional */ }
  }
  function sfx(name) {
    try { if (MC.audio && MC.audio.sfx) MC.audio.sfx(name); } catch (e) { /* audio is optional */ }
  }
  function note(n) {
    try { if (n && MC.audio && MC.audio.note) MC.audio.note(n); } catch (e) { /* audio is optional */ }
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // ------------------------------------------------------------------ program helpers
  const keyOf = (path) => path.join('.');
  const parseKey = (k) => String(k).split('.').map((s) => (/^\d+$/.test(s) ? Number(s) : s));
  const sameSeq = (a, b) => a && b && a.length === b.length && a.every((x, i) => x === b[i]);
  const clone = (x) => JSON.parse(JSON.stringify(x));

  function kindOf(n) {
    if (typeof n === 'string') return n;
    if (!n) return '?';
    if (n.rep != null) return 'rep';
    if (n.until != null) return 'until';
    if (n.if != null) return n.else ? 'ifelse' : 'if';
    return '?';
  }
  // Conditions that make sense per block type: 'goal' ("Hedefteysen") is for Olana Kadar; Eğer blocks start on
  // (and cycle through) the level's other conditions, unless 'goal' is the only one.
  function condsFor(key, conds) {
    if (key === 'until') return conds;
    const c = conds.filter((x) => x !== 'goal');
    return c.length ? c : conds;
  }
  function makeNode(op, conds) {
    switch (op) {
      case 'rep': return { rep: 2, do: [] };
      case 'until': return { until: conds.includes('goal') ? 'goal' : conds[0], do: [] };
      case 'if': return { if: condsFor('if', conds)[0], do: [] };
      case 'ifelse': return { if: condsFor('if', conds)[0], do: [], else: [] };
      default: return op;
    }
  }
  // Container → container replacement keeps the children and, where it still fits, the header
  // (loop count, or the condition shared by if / ifelse / until).
  function replaceNode(node, old, conds) {
    if (!(COMPOUND[kindOf(node)] && old && typeof old === 'object')) return node;
    const repl = Object.assign({}, node, { do: clone(old.do || []) });
    if (kindOf(node) === 'ifelse') repl.else = clone(old.else || []);
    if (repl.rep != null && old.rep != null) repl.rep = old.rep;
    const oldCond = old.until != null ? old.until : old.if;
    if (oldCond != null && conds.includes(oldCond)) {

      else if (repl.if != null) repl.if = oldCond;
    }
