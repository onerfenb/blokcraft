<!doctype html>
<html lang="tr">
<head>
<title>Blokcraft</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f7a28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blokcraft">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6cb4ee">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap">
<style>/* ==== app/styles.css ==== */
/* Blokcraft — design tokens, Minecraft-GUI components and every screen except the level screen.
   Textures (--tex-*) are pixel-art data URLs published by MC.gfx.applyTheme() at boot; every rule has a
   solid colour underneath so the page is complete before/without them. One daylight theme (it is a game world). */

:root {
  /* sky + world */
  --sky-1: #4f9fe0; --sky-2: #62aee8; --sky-3: #78bcef; --sky-4: #90caf4; --sky-5: #aad8f8;
  --grass: #5d9e3a; --grass-hi: #8fd14f; --grass-lo: #2f5e1e;
  --dirt: #7a5230; --dirt-lo: #4e3620; --dirt-hi: #9a6b40;
  --plank: #b08850; --plank-hi: #d0a868; --plank-lo: #6b4a2a;
  --stone: #8b8b8b; --stone-hi: #c6c6c6; --stone-lo: #555555;
  /* Minecraft GUI panel */
  --gui: #c6c6c6; --gui-hi: #ffffff; --gui-lo: #555555; --gui-dark: #373737; --edge: #16161d;
  /* ink */
  --ink: #1d1d22; --ink-2: #3c3c44; --ink-3: #5a5a64; --on-dark: #ffffff; --on-dark-2: #e6e0cf;
  --paper: #fff6dc;
  /* accents */
  --gold: #ffd23f; --gold-hi: #fff2a0; --gold-lo: #c08000;
  --emerald: #3fa83a; --emerald-hi: #7ddc5a; --emerald-lo: #1d5a1a;
  --redstone: #b8402e; --redstone-lo: #6e1a10;
  --lapis: #2a4db0; --diamond: #62ece4;
  --focus: #ffe066;
  /* type */
  --font-ui: "Andika", "Segoe UI", "Noto Sans", system-ui, sans-serif;
  --font-px: "Pixelify Sans", "Andika", "Segoe UI", system-ui, sans-serif;
  /* layout */
  --col: 560px;
  --gutter: 16px;
  --tap: 56px;
  --tap-lg: 76px;
  --bevel: 4px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* textures (overwritten from JS) */
  --tex-stone: none; --tex-btnstone: none; --tex-dirt: none; --tex-darkdirt: none; --tex-grass: none; --tex-grassblock: none;
  --tex-plank: none; --tex-btngreen: none; --tex-btnred: none; --tex-obsidian: none; --tex-slot: none; --tex-gold: none; --tex-emerald: none;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #2d2016; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #3a2a1a;
  background-image: linear-gradient(rgba(20, 12, 6, 0.55), rgba(20, 12, 6, 0.55)), var(--tex-dirt);
  background-size: auto, 64px 64px;
  image-rendering: pixelated;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 20px;
  line-height: 1.35;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-x: none;
}
button { font: inherit; color: inherit; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.px-icon, .px-text { display: block; flex: none; image-rendering: pixelated; -webkit-user-drag: none; user-select: none; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.noscript { margin: 24px; padding: 20px; background: var(--paper); font: 20px/1.4 var(--font-ui); }
[hidden] { display: none !important; }
html[data-speech="off"] .needs-speech { display: none !important; }

.app {
  position: relative;
  max-width: var(--col);
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--sky-3);
  box-shadow: 0 0 0 4px #000, 0 0 60px rgba(0, 0, 0, 0.6);
  overflow-x: clip; /* clip, not hidden: hidden would make .app a scroll container and break sticky bars */
}
.screen-host { position: relative; min-height: 100vh; min-height: 100dvh; }
.scr { position: relative; min-height: 100vh; min-height: 100dvh; }

.boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sky-3); }
.boot-text { font: 700 40px var(--font-px); color: #fff; text-shadow: 3px 3px 0 #3f3f3f; letter-spacing: 2px; }

:focus { outline: none; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

/* ------------------------------------------------------------------ type helpers */
.px-title { font-family: var(--font-px); font-weight: 700; letter-spacing: 0.5px; }
.say-text { font-family: var(--font-ui); font-size: 24px; line-height: 1.3; font-weight: 700; margin: 0; }
.body-text { font-family: var(--font-ui); font-size: 20px; line-height: 1.4; margin: 0; }
.small-text { font-family: var(--font-ui); font-size: 20px; line-height: 1.35; margin: 0; color: var(--ink-2); }
.mixed { display: inline; }
.mixed .px-text { display: inline-block; vertical-align: -0.08em; margin: 0 0.06em; }
.mc-shadow { color: #fff; text-shadow: 2px 2px 0 #3f3f3f; }

/* ------------------------------------------------------------------ buttons (blocky Minecraft GUI) */
.btn {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-width: var(--tap);
  min-height: var(--tap);
  margin: 0;
  padding: 0 18px;
  border: 3px solid var(--edge);
  border-radius: 0;
  background-color: var(--stone);
  background-image: var(--tex-btnstone);
  background-size: 48px 48px;
  image-rendering: pixelated;
  color: #fff;
  font-family: var(--font-px);
  font-weight: 600;
  font-size: 24px;
  line-height: 1;
  text-shadow: 2px 2px 0 #3f3f3f;
  box-shadow:
    inset var(--bevel) var(--bevel) 0 rgba(255, 255, 255, 0.42),
    inset calc(-1 * var(--bevel)) calc(-1 * var(--bevel) - 1px) 0 rgba(0, 0, 0, 0.32),
    0 4px 0 rgba(0, 0, 0, 0.55);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transform: translateY(0);
  transition: transform 60ms ease-out, box-shadow 60ms ease-out, filter 80ms;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn.is-pressed, .btn:active {
  transform: translateY(3px);
  box-shadow:
    inset var(--bevel) var(--bevel) 0 rgba(0, 0, 0, 0.25),
    inset calc(-1 * var(--bevel)) calc(-1 * var(--bevel)) 0 rgba(255, 255, 255, 0.18),
    0 1px 0 rgba(0, 0, 0, 0.55);
}
.btn:disabled, .btn[aria-disabled="true"] { filter: grayscale(0.8) brightness(0.8); cursor: default; }
.btn .btn-label { display: block; padding-top: 2px; }
.btn .btn-glyph { font-size: 28px; }
.btn .btn-num { padding-top: 0; }
.btn-icon { padding: 0; width: var(--tap); }

.btn-primary {
  background-color: var(--emerald);
  background-image: var(--tex-btngreen);
  text-shadow: 2px 2px 0 var(--emerald-lo);
}
.btn-wood { background-color: var(--plank); background-image: var(--tex-plank); text-shadow: 2px 2px 0 #4e3620; }
.btn-danger { background-color: var(--redstone); background-image: var(--tex-btnred); text-shadow: 2px 2px 0 var(--redstone-lo); }
.btn-ghost {
  background: rgba(0, 0, 0, 0.28);
  border-color: rgba(0, 0, 0, 0.55);
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.18), inset -2px -2px 0 rgba(0, 0, 0, 0.18);
}
.btn-stone { background-image: linear-gradient(rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0.14)), var(--tex-btnstone); background-size: auto, 48px 48px; text-shadow: 2px 2px 0 #333; }
.btn-gold { background-color: var(--gold); background-image: var(--tex-gold); color: #4a3200; text-shadow: 1px 1px 0 var(--gold-hi); }

.btn-sm { min-height: var(--tap); font-size: 20px; padding: 0 12px; gap: 8px; }
.btn-sm.btn-icon { width: var(--tap); padding: 0; }
.btn-md { min-height: 64px; font-size: 26px; }
.btn-md.btn-icon { width: 64px; }
.btn-lg { min-height: var(--tap-lg); font-size: 34px; padding: 0 28px; gap: 14px; }
.btn-lg.btn-icon { width: var(--tap-lg); }
.btn.is-off { filter: grayscale(0.7) brightness(0.85); }

/* ------------------------------------------------------------------ panels, bars, chips, stars */
.panel {
  position: relative;
  background: var(--gui);
  border: 3px solid var(--edge);
  box-shadow: inset var(--bevel) var(--bevel) 0 var(--gui-hi), inset calc(-1 * var(--bevel)) calc(-1 * var(--bevel)) 0 var(--gui-lo);
  padding: 16px;
  color: var(--ink);
}
.panel-wood {
  background-color: var(--plank);
  background-image: linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.08)), var(--tex-plank);
  background-size: auto, 48px 48px;
  box-shadow: inset var(--bevel) var(--bevel) 0 rgba(255, 255, 255, 0.28), inset calc(-1 * var(--bevel)) calc(-1 * var(--bevel)) 0 rgba(0, 0, 0, 0.3);
  color: #fff;
  text-shadow: 2px 2px 0 #4e3620;
}
.panel-stone {
  background-color: var(--stone);
  background-image: var(--tex-stone);
  background-size: 48px 48px;
  color: #fff;
  text-shadow: 2px 2px 0 #3f3f3f;
}
.panel-dark {
  background: rgba(16, 12, 10, 0.78);
  box-shadow: inset 3px 3px 0 rgba(255, 255, 255, 0.12), inset -3px -3px 0 rgba(0, 0, 0, 0.4);
  color: #fff;
}
.panel-paper {
  background: var(--paper);
  box-shadow: inset var(--bevel) var(--bevel) 0 #fffdf3, inset calc(-1 * var(--bevel)) calc(-1 * var(--bevel)) 0 #d8c9a0;
}
.panel h2, .panel h3 { margin: 0 0 10px; font-family: var(--font-px); font-weight: 700; }
.panel h2 { font-size: 28px; }
.panel h3 { font-size: 24px; }

.bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: calc(76px + var(--safe-t));
  padding: calc(8px + var(--safe-t)) 12px 10px;
  background-color: var(--plank);
  background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), var(--tex-plank);
  background-size: auto, 48px 48px;
  border-bottom: 4px solid var(--edge);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 4px 0 rgba(0, 0, 0, 0.25);
  color: #fff;
}
.bar-side { display: flex; align-items: center; gap: 8px; flex: none; }
.bar-title {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-family: var(--font-ui); /* Andika: Pixelify's Z reads as 2 ("Zırhlar") */
  font-weight: 700;
  font-size: 27px;
  line-height: 1.1;
  color: #fff;
  text-shadow: 2px 2px 0 #4e3620;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-spacer { flex: 1; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 4px 12px 4px 8px;
  background: rgba(0, 0, 0, 0.5);
  border: 3px solid var(--edge);
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.18), inset -2px -2px 0 rgba(0, 0, 0, 0.3);
  color: #fff;
  font-family: var(--font-px);
  font-weight: 700;
  font-size: 26px;
  line-height: 1;
  text-shadow: 2px 2px 0 #000;
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
}
.chip-stars { min-height: var(--tap); }
.chip-light { background: rgba(255, 255, 255, 0.72); color: var(--ink); text-shadow: none; }
.chip-num { display: grid; place-items: center; }
.stars { display: inline-flex; align-items: center; gap: 2px; }

.slot {
  display: grid;
  place-items: center;
  position: relative;
  background: #8b8b8b;
  border: 0;
  box-shadow: inset 3px 3px 0 var(--gui-dark), inset -3px -3px 0 #fff;
}

/* ------------------------------------------------------------------ overlay, toast */
.overlay-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.overlay-layer.open { pointer-events: auto; }
.ov {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background: rgba(10, 8, 6, 0.62);
  animation: ov-in 140ms ease-out;
}
.ov.ov-out { animation: ov-out 120ms ease-in forwards; }
.ov-box { width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow: auto; animation: pop-in 180ms cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes ov-in { from { opacity: 0; } }
@keyframes ov-out { to { opacity: 0; } }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-b));
  z-index: 120;
  max-width: min(520px, calc(100% - 32px));
  padding: 14px 20px;
  background: rgba(16, 12, 10, 0.9);
  border: 3px solid #000;
  box-shadow: inset 3px 3px 0 rgba(255, 255, 255, 0.15);
  color: #fff;
  font: 700 21px/1.3 var(--font-ui);
  text-align: center;
  transform: translate(-50%, 140%);
  opacity: 0;
  transition: transform 180ms ease-out, opacity 180ms;
  pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ------------------------------------------------------------------ shared animations */
@keyframes pop-in { from { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } to { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes bob-steps { 0%, 49% { transform: translateY(0); } 50%, 100% { transform: translateY(-4px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 4px rgba(255, 230, 102, 0.95), 0 0 18px 6px rgba(255, 210, 63, 0.55); } 50% { box-shadow: 0 0 0 4px rgba(255, 230, 102, 0.6), 0 0 8px 2px rgba(255, 210, 63, 0.3); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(calc(var(--col) + 40px)); } }
@keyframes scroll-x { from { background-position-x: 0; } to { background-position-x: calc(-1 * var(--tw, 512px)); } }
@keyframes splash-pulse { 0%, 100% { transform: rotate(-14deg) scale(1); } 50% { transform: rotate(-14deg) scale(1.1); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-26px); } }
@keyframes unlock-pop { 0% { transform: scale(1); } 30% { transform: scale(1.25) rotate(-6deg); } 60% { transform: scale(0.95) rotate(3deg); } 100% { transform: scale(1); } }
.shake { animation: shake 360ms ease-in-out; }

/* ================================================================== TITLE */
.scr-title { overflow: hidden; background: var(--sky-3); }
.title-scene { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.title-sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,
    var(--sky-1) 0 14%, var(--sky-2) 14% 28%, var(--sky-3) 28% 42%, var(--sky-4) 42% 56%, var(--sky-5) 56% 100%);
}
.sun { position: absolute; top: 250px; left: 44px; width: 56px; height: 56px; background: #fff6b0; box-shadow: 0 0 0 8px rgba(255, 246, 176, 0.35); }
.cloud {
  position: absolute;
  left: 0;
  height: 22px;
  background: #fff;
  box-shadow: 0 8px 0 #e3eef8;
  opacity: 0.95;
  animation: drift linear infinite;
}
.cloud::before { content: ""; position: absolute; left: 22%; top: -14px; width: 44%; height: 14px; background: #fff; }
.hills { position: absolute; left: 0; right: 0; background-repeat: repeat-x; image-rendering: pixelated; animation: scroll-x linear infinite; }
.title-top { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: calc(12px + var(--safe-t)) 16px 0; }
.title-logo-wrap { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; margin-top: 44px; padding: 0 16px; }
.title-logo { filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.35)); }
.title-logo-text {
  font: 700 58px/1 var(--font-px);
  letter-spacing: 3px;
  color: #d8d8d8;
  text-shadow: 3px 3px 0 #555, 6px 6px 0 #222;
  -webkit-text-stroke: 2px #222;
}
.title-splash {
  position: absolute;
  right: 18px;
  bottom: -24px;
  font: 700 22px/1 var(--font-px);
  color: #ffff3c;
  text-shadow: 2px 2px 0 #3f3f00;
  transform: rotate(-14deg);
  animation: splash-pulse 900ms ease-in-out infinite;
  white-space: nowrap;
}
.title-stage { position: relative; z-index: 2; flex: 1; display: flex; align-items: flex-end; justify-content: center; min-height: 230px; }
.title-hero { position: relative; display: block; margin: 0 0 -6px; padding: 0; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
.title-hero .px-icon { animation: bob-steps 1.1s infinite; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.25)); }
.title-hero.hop .px-icon { animation: hop 420ms ease-out; }
.title-mob { position: absolute; bottom: -4px; z-index: 1; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
.title-mob .px-icon { filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.22)); }
.title-mob.hop .px-icon { animation: hop 420ms ease-out; }
.title-hero-shadow { position: absolute; left: 50%; bottom: 2px; width: 70px; height: 10px; margin-left: -35px; background: rgba(0, 0, 0, 0.22); }
.title-ground {
  position: relative;
  z-index: 3;
  padding: 44px 16px calc(28px + var(--safe-b));
  background-color: var(--dirt);
  background-image: var(--tex-grassblock), var(--tex-dirt);
  background-repeat: repeat-x, repeat;
  background-size: 64px 64px, 64px 64px;
  background-position: 0 0, 0 64px;
  border-top: 4px solid var(--grass-lo);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.title-ground::after { content: ""; position: absolute; inset: 64px 0 0; background: rgba(0, 0, 0, 0.18); pointer-events: none; }
.title-play { position: relative; z-index: 1; width: min(320px, 100%); min-height: 88px; font-size: 40px; }
.title-sub { position: relative; z-index: 1; display: flex; gap: 12px; }
.title-foot { position: relative; z-index: 1; margin: 0; font: 600 16px var(--font-px); color: rgba(255, 255, 255, 0.75); text-shadow: 1px 1px 0 #000; }

/* ================================================================== MAP */
.scr-map { background: #1a1a1a; }
.map-bar .chip-stars { cursor: pointer; }
@media (max-width: 380px) {
  .map-bar { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .map-bar .bar-side { gap: 4px; }
  .map-bar .btn-sm.btn-icon { width: 50px; min-width: 50px; min-height: 52px; }
  .map-bar .btn-sm.btn-icon .px-icon { width: 26px !important; height: 26px !important; }
  .map-bar .chip-stars { padding: 4px 6px 4px 4px; gap: 4px; min-height: 52px; }
  .map-bar .chip-stars > .px-icon { width: 22px !important; height: 22px !important; }
}
.map-bar .btn-parent { width: var(--tap); background: rgba(0, 0, 0, 0.22); border-color: rgba(0, 0, 0, 0.45); box-shadow: none; opacity: 0.8; }
.map-wrap { position: relative; width: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
.band { position: relative; width: 100%; overflow: hidden; }
.band-bg { position: absolute; left: 50%; top: 0; transform: translateX(-50%); image-rendering: pixelated; }
.map-cap { position: relative; width: 100%; image-rendering: pixelated; }
.map-cap-top { background: #0b0714; }
.map-cap-top .cap-text { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font: 700 24px var(--font-px); color: #d8c8ff; text-shadow: 2px 2px 0 #000; }

.node {
  position: absolute;
  z-index: 3;
  width: 64px;
  height: 88px;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.node-block {
  position: relative;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border: 3px solid var(--edge);
  background-color: var(--grass);
  background-image: var(--tex-grassblock);
  background-size: 58px 58px;
  box-shadow: inset 4px 4px 0 rgba(255, 255, 255, 0.35), inset -4px -4px 0 rgba(0, 0, 0, 0.35), 0 5px 0 rgba(0, 0, 0, 0.45);
  transition: transform 80ms;
}

.prog-fn { font: 700 18px var(--font-px); padding: 0 6px 0 2px; }
.prog-atom { display: grid; place-items: center; width: 34px; height: 34px; background: #e8e8e8; border: 2px solid #000; }
.prog-atom.txt { width: auto; padding: 0 6px; font: 700 15px var(--font-ui); }
.prog-box { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px; border: 2px solid #000; background: rgba(63, 168, 58, 0.22); }
.prog-box.kind-until { background: rgba(42, 77, 176, 0.18); }
.prog-box.kind-if { background: rgba(255, 159, 26, 0.22); }
.prog-head { display: flex; align-items: center; gap: 4px; font: 700 15px/1.1 var(--font-ui); padding-right: 4px; }
.prog-else { flex-basis: 100%; font: 700 15px var(--font-ui); }
.ak-choices { display: flex; flex-direction: column; gap: 8px; }
.ak-choice { display: flex; align-items: center; gap: 8px; }
.ak-choice.ok { outline: 3px solid var(--emerald); outline-offset: 2px; }
.ak-cards { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ak-cards li { display: flex; align-items: center; gap: 10px; font: 700 19px var(--font-ui); }
.set-list { display: flex; flex-direction: column; gap: 10px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 6px 0; border-bottom: 2px solid rgba(0, 0, 0, 0.15); }
.set-row:last-child { border-bottom: 0; }
.set-name { font: 700 20px/1.2 var(--font-ui); }
.set-name small { display: block; font: 600 15px/1.25 var(--font-ui); color: var(--ink-3); }
.set-toggle { min-width: 118px; }
.set-toggle.on { background-color: var(--emerald); background-image: var(--tex-btngreen); text-shadow: 2px 2px 0 var(--emerald-lo); }
.set-actions { display: flex; flex-direction: column; gap: 10px; }
.set-actions .btn { width: 100%; font-size: 22px; white-space: normal; text-align: center; line-height: 1.1; padding: 8px 12px; }
.confirm-box { display: flex; flex-direction: column; gap: 14px; text-align: center; }
.confirm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.confirm-row .btn { width: 100%; }

/* ================================================================== placeholder level */
.ph-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; color: #fff; text-align: center; }
.ph-body .say-text { text-shadow: 2px 2px 0 #000; }
.ph-board { display: grid; place-items: center; }
.ph-note { margin: 0; font: 600 17px/1.3 var(--font-ui); opacity: 0.9; }
.err-panel { margin: 40px 16px; display: flex; flex-direction: column; gap: 16px; align-items: center; }

/* ------------------------------------------------------------------ short screens */
@media (max-height: 720px) {
  .win-body { gap: 10px; padding-top: calc(12px + var(--safe-t)); }
  .win-title { font-size: 36px; }
  .win-reward { min-height: 80px; }
  .win-rays { width: 120px; height: 120px; margin: -60px 0 0 -60px; }
}

/* ------------------------------------------------------------------ narrow phones */
@media (max-width: 370px) {
  .btn-lg { font-size: 30px; }
  .title-logo-text { font-size: 46px; }
  .keypad { grid-template-columns: repeat(3, 68px); }
  .keypad .btn { width: 68px; }
  .skin-grid { gap: 8px; }
}

/* ------------------------------------------------------------------ reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .cloud, .hills, .win-rays { animation: none !important; }
  .cloud { left: var(--x, 10%); }
}

/* ==== app/level.css ==== */
/* Blokcraft — level screen, program editor, level-type UIs, intro cards (level-screen agent).
   Uses the shell tokens from styles.css (--gui, --edge, --gold, --font-px …) with fallbacks. */

.scr-level { min-height: 0; }

.lv {
  --lv-pad: 12px;
  --blk: 52px;
  --g: #8c8c90;
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background-color: #2b2118;
  background-image: linear-gradient(rgba(16, 11, 8, 0.64), rgba(16, 11, 8, 0.74)), var(--lv-backdrop, var(--tex-darkdirt, none));
  background-size: auto, 64px 64px;
  color: var(--on-dark, #fff);
  font-family: var(--font-ui, "Andika", system-ui, sans-serif);
  padding-bottom: var(--safe-b, 0px);
  -webkit-user-select: none;
  user-select: none;
}
.lv.lv--missing { display: grid; place-items: center; gap: 16px; padding: 24px; text-align: center; }

/* group accents (blocks, palette, containers) */
.g-move { --g: #3f7ee0; }
.g-turn { --g: #2fb8c8; }
.g-mine { --g: #b07a3a; }
.g-place { --g: #5d9e3a; }
.g-call { --g: #8a4fd0; }
.g-rep { --g: #e0a800; }
.g-until { --g: #e8761c; }
.g-if { --g: #2f9e4a; }

/* ------------------------------------------------------------------ buttons (on top of the shell .btn) */
.lv .lv-btn { font-size: 20px; gap: 6px; padding: 0 10px; }
.lv-btn .lv-btn-label { display: block; padding-top: 2px; }
.lv-btn.btn-primary { background-color: var(--emerald, #3fa83a); }

/* ------------------------------------------------------------------ top bar */
.lv-top {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  padding: calc(6px + var(--safe-t, 0px)) 8px 6px;
  background-color: var(--plank, #b08850);
  background-image: linear-gradient(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12)), var(--tex-plank, none);
  background-size: auto, 48px 48px;
  border-bottom: 4px solid var(--edge, #16161d);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22), 0 3px 0 rgba(0, 0, 0, 0.3);
  z-index: 5;
}
.lv .lv-top-btn { width: var(--tap, 56px); min-width: var(--tap, 56px); min-height: var(--tap, 56px); padding: 0; flex: none; }
.lv-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.lv-num {
  flex: none;
  display: grid;
  place-items: center;
  min-width: 44px;
  height: 44px;
  padding: 0 6px;
  background: var(--gold, #ffd23f);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 var(--gold-hi, #fff2a0), inset -3px -3px 0 var(--gold-lo, #c08000);
  color: #4a3200;
  font: 700 24px/1 var(--font-px, monospace);
}
.lv-titles { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.lv-world { font: 700 14px/1.1 var(--font-ui, sans-serif); color: var(--on-dark-2, #e6e0cf); text-shadow: 1px 1px 0 #2a1a0a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; /* Andika, not Pixelify: Pixelify's C, Ç and Z read as G / Q / 2 for an early reader (same as the shell's .bar-title) */
  font: 700 20px/1.08 var(--font-ui, "Andika", system-ui, sans-serif); color: #fff; text-shadow: 2px 2px 0 #4e3620; overflow-wrap: anywhere; }

/* ------------------------------------------------------------------ instruction row */
.lv-sayrow { display: flex; align-items: stretch; gap: 6px; flex: none; padding: 8px var(--lv-pad) 6px; }
.lv-say {
  appearance: none;
  flex: 1;
  min-width: 0;
  min-height: var(--tap, 56px);
  margin: 0;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  text-align: left;
  background: var(--paper, #fff6dc);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 #fffdf3, inset -3px -3px 0 #d8c9a0;
  color: var(--ink, #1d1d22);
  cursor: pointer;
  touch-action: manipulation;
}
.lv-say-text { font: 700 21px/1.22 var(--font-ui, sans-serif); }
.lv .lv-help { flex: none; flex-direction: column; gap: 0; min-width: 58px; width: 58px; min-height: var(--tap, 56px); padding: 2px 0 0; font-size: 14px; }
.lv .lv-help .lv-btn-label { font: 700 15px/1 var(--font-ui, "Andika", system-ui, sans-serif); padding: 0; }
.lv-help.is-hidden { display: none; }
.lv-hint { background-color: #7fb2f0; }
.lv-hint.is-attn { animation: lv-attn 1.1s ease-in-out infinite; }
.lv .lv-sol { color: #3a2600; text-shadow: none; }
.lv .lv-sol .lv-btn-label { color: #3a2600; text-shadow: 1px 1px 0 rgba(255, 242, 160, 0.9); }
.lv-sol.is-armed, .lv-sol.is-new { animation: lv-attn 0.9s ease-in-out infinite; }

/* ------------------------------------------------------------------ board stage */
/* the stage takes the free space and never less than --stage-min (set by 50-level from the map: ~44 px tiles,
   clamped so the palette and the action row always stay on screen); the program area gives way and scrolls */
.lv-stage { position: relative; display: flex; flex-direction: column; flex: 1 1 0; min-height: var(--stage-min, 140px); padding: 2px var(--lv-pad) 4px; }
.lv-boardwrap { position: relative; flex: 1 1 0; min-height: 60px; }
.lv-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: manipulation; }
.lv-boardwrap.is-missing::after {
  content: "…";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 700 28px var(--font-px, monospace);
  color: rgba(255, 255, 255, 0.6);
}

.lv-tabs { display: flex; justify-content: center; gap: 8px; padding: 2px 0 4px; flex: none; }
.lv-tab {
  appearance: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap, 56px);
  margin: 0;
  padding: 2px 10px 2px 3px;
  background: var(--gui, #c6c6c6);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 var(--gui-hi, #fff), inset -3px -3px 0 var(--gui-lo, #555);
  color: var(--ink, #1d1d22);
  font: 700 22px/1 var(--font-px, monospace);
  cursor: pointer;
  touch-action: manipulation;
  opacity: 0.78;
}
.lv-tab.is-on { opacity: 1; background: var(--gold-hi, #fff2a0); transform: translateY(-2px); box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 var(--gold-lo, #c08000), 0 3px 0 rgba(0, 0, 0, 0.5); }
.lv-tab-thumb { display: block; width: 36px; height: auto; max-height: 36px; object-fit: contain; image-rendering: pixelated; border: 2px solid var(--edge, #16161d); }
.lv-tab-st { position: absolute; top: -10px; right: -10px; display: grid; place-items: center; }
.lv-tab.is-ok .lv-tab-st { width: 24px; height: 24px; background: var(--emerald, #3fa83a); border: 2px solid var(--edge, #16161d); }
.lv-tab.is-bad .lv-tab-st { width: 18px; height: 18px; background: #ff9f1a; border: 2px solid var(--edge, #16161d); }

/* ------------------------------------------------------------------ program area */
.lv-prog { position: relative; flex: 0 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px var(--lv-pad) 0; overscroll-behavior: contain; scrollbar-width: thin; }
.lv-prog--ro { max-height: 30%; }
.lv-prog--trace { cursor: pointer; }
/* "more below" cue while the program area scrolls */
.lv-prog-more { position: sticky; bottom: 0; height: 30px; margin-top: -30px; pointer-events: none; opacity: 0; transition: opacity 160ms; background: linear-gradient(rgba(16, 11, 8, 0), rgba(16, 11, 8, 0.8)); display: grid; place-items: end center; }
.lv-prog-more.is-on { opacity: 1; }
.lv-prog-more-arrow { width: 0; height: 0; margin-bottom: 4px; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 12px solid var(--gold, #ffd23f); filter: drop-shadow(0 2px 0 #000); animation: lv-point-up 0.9s ease-in-out infinite; }

/* ------------------------------------------------------------------ editor (program strips) */
.ed { --blk: 56px; --gap: 6px; --ic: 32px; display: flex; flex-direction: column; gap: 6px; }
.ed--md { --blk: 44px; --gap: 4px; }
.ed--deep { --blk: 50px; --gap: 5px; }
.ed--sm { --blk: 32px; --gap: 4px; }
.ed-strip {
  position: relative;
  padding: 6px;
  background: var(--gui, #c6c6c6);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 var(--gui-hi, #fff), inset -3px -3px 0 var(--gui-lo, #555);
  color: var(--ink, #1d1d22);
}
.ed--multi .ed-strip { opacity: 0.86; }
.ed--multi .ed-strip.is-active { opacity: 1; outline: 3px solid var(--gold, #ffd23f); outline-offset: 1px; }
/* several strips: the name sits in a tap-sized column left of the blocks (saves a row per strip) */
.ed--multi .ed-strip { display: flex; align-items: flex-start; gap: 6px; }
.ed--multi .ed-strip > .ed-seq { flex: 1 1 auto; }
.ed-strip--fn { background: #d9cdea; box-shadow: inset 3px 3px 0 #f4eefc, inset -3px -3px 0 #7a5aa0; }
.ed-strip-head {
  appearance: none;
  flex: none;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 58px;
  min-height: max(56px, var(--blk));
  margin: 0;
  padding: 2px 0;
  background: rgba(255, 255, 255, 0.35);
  border: 2px solid rgba(0, 0, 0, 0.25);
  color: var(--ink-2, #3c3c44);
  font: 700 13px/1 var(--font-ui, "Andika", system-ui, sans-serif);
  cursor: pointer;
}
.ed-strip-name { white-space: nowrap; }
div.ed-strip-head { cursor: default; }
.ed-seq { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap, 4px); min-height: var(--blk); min-width: 0; }

.ed-blk, .ed-head, .ed-frame, .ed-ghost {
  appearance: none;
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: var(--blk);
  height: var(--blk);
  margin: 0;
  padding: 0;
  border-radius: 0;
  touch-action: manipulation;
}
.ed-blk, .ed-head {
  background: #e4e4e4;
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 rgba(255, 255, 255, 0.85), inset -3px -4px 0 rgba(0, 0, 0, 0.22), inset 0 -8px 0 var(--g);
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms;
}
.ed--sm .ed-blk, .ed--sm .ed-head { border-width: 2px; box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.85), inset 0 -5px 0 var(--g); }
.ed-blk .px-icon, .ed-head .px-icon { margin-top: -4px; }
.ed--sm .ed-blk .px-icon, .ed--sm .ed-head .px-icon { margin-top: -2px; }
button.ed-blk:active, button.ed-head:active { transform: translateY(2px); }
.ed--ro .ed-blk, .ed--ro .ed-head, .ed--ro .ed-count, .ed--ro .ed-cond { cursor: inherit; }

/* containers */
.ed-box {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  gap: 4px;
  max-width: 100%;
  padding: 3px;
  background: color-mix(in srgb, var(--g) 22%, transparent);
  border: 3px solid var(--g);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
}
.ed-box--rep { --g: #e0a800; }
.ed-box--until { --g: #e8761c; }
.ed-box--if, .ed-box--ifelse { --g: #2f9e4a; }
.ed-box .ed-head { background: color-mix(in srgb, var(--g) 45%, #fff); }
.ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap, 4px); min-width: 0; }
.ed-row > .ed-seq {
  flex: 1 1 auto;
  padding: 3px;
  background: rgba(255, 255, 255, 0.4);
  box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.18);
  min-height: calc(var(--blk) + 6px);
}
.ed-row--else { padding-top: 4px; border-top: 3px dashed color-mix(in srgb, var(--g) 70%, #000); }
.ed-count {
  appearance: none;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--blk);
  height: var(--blk);
  margin: 0;
  padding: 0 4px;
  background: #fff;
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset -3px -3px 0 #d8d8d8;
  color: var(--ink, #1d1d22);
  font: 700 calc(var(--blk) * 0.48)/1 var(--font-px, monospace);
  cursor: pointer;
  touch-action: manipulation;
}
.ed--sm .ed-count { border-width: 2px; }
.ed-cond {
  appearance: none;
  flex: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: calc(var(--blk) * 1.2); /* fixed: the neighbours do not shift while he cycles the condition */
  height: var(--blk);
  margin: 0;
  padding: 0 3px;
  background: #fff;
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset -3px -3px 0 #d8d8d8;
  color: var(--ink, #1d1d22);
  cursor: pointer;
  touch-action: manipulation;
}
.ed--sm .ed-cond { border-width: 2px; padding: 0 2px; }
.ed--sm .ed-count, .ed--sm .ed-cond { height: calc(var(--blk) * 0.84); }
.ed--sm .ed-count { min-width: calc(var(--blk) * 0.84); }
.ed-cond-dir, .ed-cond-kind { position: relative; display: grid; place-items: center; }
.ed-cond.is-neg .ed-cond-kind::after {
  content: "";
  position: absolute;
  left: -2px;
  right: -2px;
  top: 50%;
  height: 4px;
  margin-top: -2px;
  background: var(--ink, #1d1d22);
  transform: rotate(-45deg);
  box-shadow: 0 0 0 1px #fff;
}

/* insertion frame, empty slots */
.ed-frame {
  background: rgba(255, 255, 255, 0.45);
  border: 3px dashed var(--ink-2, #3c3c44);
  cursor: pointer;
  animation: lv-frame 1.1s ease-in-out infinite;
}
.ed-ghost {
  background: #8b8b8b;
  border: 0;
  box-shadow: inset 3px 3px 0 var(--gui-dark, #373737), inset -3px -3px 0 #fff;
  opacity: 0.5;
}
button.ed-ghost { cursor: pointer; opacity: 0.62; }
button.ed-ghost::after { content: "+"; font: 700 26px/1 var(--font-px, monospace); color: rgba(255, 255, 255, 0.85); text-shadow: 1px 1px 0 #000; }
.ed-ghost--tail { width: max(52px, calc(var(--blk) * 0.93)); background: rgba(0, 0, 0, 0.12); box-shadow: none; border: 2px dashed rgba(0, 0, 0, 0.3); opacity: 0.8; }
button.ed-ghost--tail::after { font-size: 20px; color: rgba(0, 0, 0, 0.45); text-shadow: none; }
.ed-ghost.is-off { opacity: 0.25; }
.ed-more { display: grid; place-items: center; min-height: 28px; padding: 0 6px; color: var(--ink-3, #5a5a64); }
.ed-none { width: var(--blk); height: var(--blk); }

/* states: selected, running, call, failed, hint */
/* selected (next palette tap replaces it): lifted, thick gold frame + glow, clearly different from the rest */
.ed-blk.is-sel, .ed-box.is-sel > .ed-row > .ed-head {
  z-index: 2;
  transform: translateY(-6px) scale(1.06);
  background: #fff;
  outline: 4px solid var(--gold, #ffd23f);
  outline-offset: 1px;
  box-shadow: inset 3px 3px 0 #fff, inset -3px -4px 0 rgba(0, 0, 0, 0.18), inset 0 -8px 0 var(--g), 0 0 0 7px rgba(22, 22, 29, 0.85), 0 8px 14px 6px rgba(255, 210, 63, 0.75);
}
.ed-box.is-sel { outline: 4px solid var(--gold, #ffd23f); outline-offset: 1px; }
.ed-blk.is-run, .ed-box.is-run > .ed-row:first-child > .ed-head {
  z-index: 1;
  background: var(--gold-hi, #fff2a0);
  transform: translateY(-3px);
  box-shadow: inset 3px 3px 0 #fff, inset 0 -8px 0 var(--gold, #ffd23f), 0 0 0 3px var(--gold, #ffd23f), 0 0 16px 5px rgba(255, 210, 63, 0.85);
}
.ed-box.is-run { box-shadow: 0 0 0 2px var(--gold, #ffd23f), 0 0 10px 2px rgba(255, 210, 63, 0.5); }
.ed-blk.is-call { box-shadow: inset 3px 3px 0 #fff, inset 0 -8px 0 var(--g), 0 0 0 3px rgba(255, 210, 63, 0.75); background: #fff8cc; }
.ed-blk.is-fail, .ed-box.is-fail { outline: 4px dashed #ff9f1a; outline-offset: 2px; }
.ed-blk.is-fail { background: #ffe2b8; }
.ed-blk, .ed-box, .ed-frame, .ed-row { scroll-margin: 12px; }
.ed-blk.is-hint, .ed-box.is-hint, .ed-frame.is-hint { animation: lv-hint 0.85s ease-in-out infinite; outline: 4px solid var(--gold, #ffd23f); outline-offset: 2px; }
.ed.is-locked { pointer-events: none; }

/* ------------------------------------------------------------------ palette */
.lv-palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; flex: none; padding: 8px var(--lv-pad) 0; }
/* several rows: a grid keeps the columns aligned (arrows above the pickaxes of the same direction) */
.lv-palette--grid { display: grid; grid-template-columns: repeat(var(--cols, 5), 68px); justify-content: center; }
.lv-pal-gap { width: 68px; height: 0; }
.lv-pal {
  appearance: none;
  position: relative;
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin: 0;
  padding: 0;
  background: #e4e4e4;
  border: 3px solid var(--edge, #16161d);
  border-radius: 0;
  box-shadow: inset 4px 4px 0 rgba(255, 255, 255, 0.9), inset -4px -5px 0 rgba(0, 0, 0, 0.22), inset 0 -10px 0 var(--g), 0 4px 0 rgba(0, 0, 0, 0.55);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 60ms ease-out, box-shadow 60ms;
}
.lv-pal .px-icon { margin-top: -7px; }
.lv-pal:active { transform: translateY(3px); box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.12), inset 0 -10px 0 var(--g), 0 1px 0 rgba(0, 0, 0, 0.55); }

/* ------------------------------------------------------------------ actions */
.lv-actions { display: flex; align-items: stretch; gap: 8px; flex: none; padding: 10px var(--lv-pad) 12px; }
.lv .lv-act { flex-direction: column; gap: 2px; min-height: 72px; padding: 4px 8px; font-size: 16px; }
.lv .lv-act .lv-btn-label { font-size: 16px; padding: 0; }
.lv .lv-del { width: 72px; flex: none; }
.lv .lv-step { width: 104px; flex: none; }
.lv .lv-run { flex: 1; flex-direction: row; gap: 10px; min-height: 76px; font-size: 28px; }
.lv .lv-run .lv-btn-label { font-size: 28px; }
.lv .lv-run.is-running { background-color: var(--stone, #8b8b8b); background-image: var(--tex-btnstone, none); text-shadow: 2px 2px 0 #3f3f3f; }
.lv-actions--order .lv-check.is-ready { animation: lv-attn 1.1s ease-in-out infinite; }
.lv .is-nudge { animation: shake 360ms ease-in-out; }

/* ------------------------------------------------------------------ predict */
.lv-choices { display: flex; justify-content: center; gap: 14px; flex: none; padding: 10px var(--lv-pad) 16px; }
.lv-choice {
  appearance: none;
  display: grid;
  place-items: center;
  width: 96px;
  height: 84px;
  margin: 0;
  padding: 0;
  background: var(--gui, #c6c6c6);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 4px 4px 0 #fff, inset -4px -5px 0 var(--gui-lo, #555), 0 4px 0 rgba(0, 0, 0, 0.55);

  touch-action: manipulation;
  transition: transform 80ms, opacity 200ms;
}
.lv-choice:active { transform: translateY(3px); }
.lv-choice.is-picked { background: var(--gold-hi, #fff2a0); outline: 4px solid var(--gold, #ffd23f); outline-offset: 2px; }
.lv-choice.is-tried { opacity: 0.4; filter: grayscale(0.8); }
.lv-choice.is-hint, .lv-optcard.is-hint { animation: lv-hint 0.85s ease-in-out infinite; outline: 4px solid var(--gold, #ffd23f); outline-offset: 2px; }

/* ------------------------------------------------------------------ choose */
.lv-cards { display: flex; flex-direction: column; gap: 8px; flex: none; padding: 6px var(--lv-pad) 14px; }
.lv-optcard {
  appearance: none;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 62px;
  margin: 0;
  padding: 6px 8px 6px 6px;
  text-align: left;
  background: var(--gui, #c6c6c6);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 #fff, inset -3px -4px 0 var(--gui-lo, #555), 0 4px 0 rgba(0, 0, 0, 0.5);
  color: var(--ink, #1d1d22);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 80ms, opacity 200ms;
}
.lv-optcard:active { transform: translateY(3px); }
.lv-optcard-let {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  background: var(--gold, #ffd23f);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 var(--gold-hi, #fff2a0), inset -3px -3px 0 var(--gold-lo, #c08000);
  color: #4a3200;

  font: 700 28px/1 var(--font-ui, "Andika", system-ui, sans-serif);
}
.lv-optcard-prog { flex: 1; min-width: 0; }
.lv-optcard .ed-strip { padding: 0; background: none; border: 0; box-shadow: none; }
.lv-optcard.is-picked { background: var(--gold-hi, #fff2a0); outline: 4px solid var(--gold, #ffd23f); outline-offset: 2px; }

}

.lv-craft-slots, .lv-intro-cards { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; }
.lv-craft-arrow { flex: none; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 11px solid rgba(0, 0, 0, 0.6); }

  appearance: none;
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 76px;
  height: 98px;

  padding: 0;
  background: #8b8b8b;

}

.lv-slot.is-empty .lv-slot-num { top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 0; height: auto; background: none; border: 0; font-size: 30px; color: rgba(255, 255, 255, 0.6); }
.lv-slot.is-ok { box-shadow: inset 3px 3px 0 var(--gui-dark, #373737), inset -3px -3px 0 #fff, 0 0 0 3px var(--gold, #ffd23f), 0 0 14px 4px rgba(255, 210, 63, 0.75); }
.lv-slot.is-fail { outline: 4px dashed #ff9f1a; outline-offset: 2px; }
.lv-craft-out { position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); display: grid; place-items: center; pointer-events: none; z-index: 3; }
.lv-craft-out-in { display: grid; place-items: center; width: 116px; height: 116px; background: radial-gradient(circle, rgba(255, 242, 160, 0.95) 0 38%, rgba(255, 210, 63, 0.5) 55%, rgba(255, 210, 63, 0) 72%); animation: lv-craft-pop 520ms cubic-bezier(0.3, 1.6, 0.5, 1) both; filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.5)); }

.lv-pool {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 12px 8px;
  background: rgba(0, 0, 0, 0.35);
  border: 3px solid rgba(0, 0, 0, 0.6);
  box-shadow: inset 3px 3px 0 rgba(255, 255, 255, 0.08);
}
.lv-card {
  appearance: none;
  position: relative;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 76px;
  height: 98px;
  margin: 0;
  padding: 6px 3px 4px;
  background: #f4efe2;
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 3px 3px 0 #fff, inset -3px -4px 0 #bdb29a, 0 4px 0 rgba(0, 0, 0, 0.5);
  color: var(--ink, #1d1d22);
  cursor: pointer;
  touch-action: manipulation;
  overflow: hidden;
}
.lv-card > .px-icon { flex: none; }
button.lv-card:active { transform: translateY(3px); }
.lv-card.is-gone { visibility: hidden; }
.lv-card--in { width: 68px; height: 90px; box-shadow: inset 3px 3px 0 #fff, inset -3px -4px 0 #bdb29a; cursor: inherit; }
.lv-card-say { font: 700 13px/1.1 var(--font-ui, sans-serif); text-align: center; overflow-wrap: anywhere; }

/* ------------------------------------------------------------------ pointer hand (tutorial) */
.lv-hand { position: absolute; left: 0; top: 0; z-index: 40; pointer-events: none; transition: transform 260ms cubic-bezier(0.3, 1.3, 0.5, 1); filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.55)); }
.lv-hand.is-hidden { display: none; }
.lv-hand-in { animation: lv-point 0.9s ease-in-out infinite; }
.lv-hand.is-flip .px-icon { transform: scaleY(-1); }
.lv-hand.is-flip .lv-hand-in { animation-name: lv-point-up; }
.lv-hand.is-wiggle .lv-hand-in { animation: shake 360ms ease-in-out; }

/* ------------------------------------------------------------------ intro card (inside the shell overlay) */
.lv-intro-ov { width: min(460px, 100%); }
.lv-intro {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  background: var(--gui, #c6c6c6);
  border: 3px solid var(--edge, #16161d);
  box-shadow: inset 4px 4px 0 var(--gui-hi, #fff), inset -4px -4px 0 var(--gui-lo, #555);

}
.lv-intro-title { font: 700 30px/1.1 var(--font-ui, "Andika", system-ui, sans-serif); text-align: center; color: #fff; text-shadow: 3px 3px 0 #3f3f3f; }
.lv-intro-board { position: relative; height: 200px; background: #2b2118; box-shadow: inset 3px 3px 0 var(--gui-dark, #373737), inset -3px -3px 0 #fff; }
.lv-intro-board.is-missing::after { content: "…"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 700 28px var(--font-px, monospace); }
.lv-intro-canvas { position: absolute; inset: 6px; display: block; width: calc(100% - 12px); height: calc(100% - 12px); }
.lv-intro-prog .ed-strip { background: #e4e4e4; }
.lv-intro-maps { display: flex; justify-content: center; gap: 6px; }
.lv-intro-chip { display: grid; place-items: center; width: 34px; height: 30px; background: #8b8b8b; border: 2px solid var(--edge, #16161d); color: #fff; font: 700 18px/1 var(--font-px, monospace); }
.lv-intro-chip.is-on { background: var(--gold, #ffd23f); color: #4a3200; }
.lv-intro-cards { padding: 8px 0; }
.lv-intro-cards .lv-slot { width: 64px; height: 72px; cursor: default; }
.lv-intro-cards .lv-card--in { width: 56px; height: 64px; animation: pop-in 220ms ease-out; }
.lv-intro-cards .lv-craft-arrow { border-top-width: 7px; border-bottom-width: 7px; border-left-width: 9px; }
.lv-intro-sayrow { display: flex; align-items: center; gap: 8px; }
.lv-intro-say { flex: 1; font: 700 22px/1.25 var(--font-ui, sans-serif); }
.lv .lv-intro-listen, .lv-intro .lv-intro-listen { flex: none; width: var(--tap, 56px); padding: 0; }
.lv-intro .lv-intro-ok { min-height: var(--tap-lg, 76px); font-size: 30px; }
.lv-intro .lv-btn .lv-btn-label { font-size: inherit; }

/* ------------------------------------------------------------------ local fallbacks (win overlay, overlay layer) */
.lv-ov { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 8, 6, 0.62); }
.lv-ov-box { width: min(460px, 100%); max-height: 100%; overflow: auto; }
.lv-win { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px; background: var(--gui, #c6c6c6); border: 3px solid var(--edge, #16161d); box-shadow: inset 4px 4px 0 #fff, inset -4px -4px 0 var(--gui-lo, #555); color: var(--ink, #1d1d22); }
.lv-win-title { font: 700 34px/1 var(--font-px, monospace); color: #fff; text-shadow: 3px 3px 0 #3f3f3f; }
.lv-win-stars { display: flex; gap: 6px; }
.lv-win-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* ------------------------------------------------------------------ animations */
@keyframes lv-craft-pop { 0% { transform: translateY(30px) scale(0.2); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes lv-frame { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes lv-hint { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes lv-attn { 0%, 100% { box-shadow: 0 0 0 3px rgba(255, 230, 102, 0.95), 0 0 16px 5px rgba(255, 210, 63, 0.65); filter: brightness(1.12); } 50% { box-shadow: 0 0 0 3px rgba(255, 230, 102, 0.35), 0 0 4px 1px rgba(255, 210, 63, 0.2); filter: brightness(1); } }
@keyframes lv-point { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes lv-point-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(9px); } }

/* ------------------------------------------------------------------ small / short screens */
@media (max-width: 380px) {
  .lv { --lv-pad: 8px; }
  .ed--lg { --blk: 52px; --gap: 5px; }
  .ed--deep { --blk: 48px; }
  .lv-pal { width: 60px; height: 60px; }
  .lv-palette--grid { grid-template-columns: repeat(var(--cols, 5), 60px); }
  .lv-pal-gap { width: 60px; }
  .lv-pal .px-icon { width: 40px !important; height: 40px !important; }
  .lv .lv-step { width: 92px; }
  .lv-slot, .lv-card { width: 68px; }
  .lv-card--in { width: 60px; }
}
@media (max-height: 740px) {
  .lv-sayrow { padding-top: 6px; padding-bottom: 4px; }
  .lv-say-text { font-size: 20px; }
  .lv .lv-act { min-height: 64px; }
  .lv .lv-run { min-height: 66px; }
  .lv-actions { padding-top: 8px; padding-bottom: 8px; }
  .lv-palette { gap: 6px; padding-top: 6px; }
  .lv-top { padding-top: calc(4px + var(--safe-t, 0px)); padding-bottom: 4px; }
  /* short phones: map tabs without thumbnails, so the board keeps its height */
  .lv-tab-thumb { display: none; }
  .lv-tab { min-height: 48px; padding: 2px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .lv *, .lv-intro * { animation: none !important; transition: none !important; }
  .ed-blk.is-sel { transform: none; }
  .lv-craft-out-in { animation: none; }
}

/* touch minimum for the small editable controls, also in the compact (deep) layout */
.ed:not(.ed--ro):not(.ed--sm) .ed-count, .ed:not(.ed--ro):not(.ed--sm) .ed-cond { min-height: 56px; }
.ed:not(.ed--ro):not(.ed--sm) .ed-count { min-width: 56px; }
.ed:not(.ed--ro):not(.ed--sm) .ed-cond { width: max(64px, calc(var(--blk) * 1.2)); }
