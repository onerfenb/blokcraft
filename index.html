      body.appendChild(h('p', { class: 'say-text' }, lv.say));
      body.appendChild(h('div', { class: 'panel ph-board' }, MC.gfx.thumb(lv, 300)));
      body.appendChild(h('p', { class: 'ph-note' }, 'Bölüm ekranı hazırlanıyor. Deneme için çözümü çalıştırabilirsin.'));
      body.appendChild(button({
        label: 'Çözümü çalıştır', icon: 'ui.play', variant: 'primary', size: 'lg',
        onTap: () => {
          let items = {};
          let ok = true;
          if (lv.solution) {
            const r = MC.runAll(lv, lv.solution);
            ok = r.ok;
            for (const res of r.results) for (const [k, c] of Object.entries(res.final.inv || {})) items[k] = (items[k] || 0) + c;
          }
          if (!ok) return toast('Çözüm çalışmadı.');
          const size = lv.solution ? MC.size(lv.solution) : null;
          const stars = MC.stars(lv, { solved: true, size, firstTry: true });
          const prev = MC.store.best(lv.n);
          const rec = MC.store.record(lv.n, { stars, size, program: lv.solution || null, items });
          show('win', { n: lv.n, stars, prev: prev ? prev.stars : 0, firstClear: rec.firstClear, reward: lv.reward, size, par: MC.parse(lv).par, items: rec.added });
        },
      }));
    },
  };

  // ------------------------------------------------------------------ router
  const DEPTH = { title: 0, map: 1 };
  let historyGuard = false;
  function show(name, params) {
    const p = params || {};
    let scr = MC.screens[name];
    if (!scr && name === 'level') scr = placeholderLevel;
    if (!scr) {
      console.warn('Blokcraft: unknown screen', name);
      name = 'map';
      scr = MC.screens.map;
    }
    if (current && current.screen.unmount) {
      try {
        current.screen.unmount();
      } catch (e) {
        console.error(e);
      }
    }
    closeOverlays();
    guardGhostClick();
    if (MC.speech) MC.speech.stop();
    const host = $('screen');
    const root = h('div', { class: `scr scr-${name}`, 'data-screen': name });
    host.replaceChildren(root);
    document.documentElement.dataset.screen = name;
    try {
      window.scrollTo(0, 0);
    } catch (e) {
      /* ignore */
    }
    current = { name, screen: scr, root, params: p };
    try {
      scr.mount(root, p);
    } catch (e) {
      console.error(e);
      root.replaceChildren(
        h('div', { class: 'panel err-panel' },
          h('p', { class: 'say-text' }, 'Bir şeyler ters gitti.'),
          button({ label: 'Haritaya dön', icon: 'ui.home', variant: 'primary', onTap: () => show(name === 'map' ? 'title' : 'map') }))
      );
    }
    // Android back button: keep one guard entry while away from the title screen.
    try {
      if ((DEPTH[name] == null || DEPTH[name] > 0) && !historyGuard && history.pushState) {
        history.pushState({ kc: 1 }, '');
        historyGuard = true;
      }
    } catch (e) {
      /* sandboxed history */
    }
    const focusEl = root.querySelector('[data-autofocus]') || root.querySelector('h1, h2');
    if (focusEl) {
      if (!focusEl.hasAttribute('tabindex')) focusEl.setAttribute('tabindex', '-1');
      try { focusEl.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
    return root;
  }
  /** Where "back" goes from the current screen. */
  function back() {
    const n = current && current.name;
    if (openOverlays.length) {
      const top = openOverlays[openOverlays.length - 1];
      if (top.closable) top.close();
      return;
    }
    if (!n || n === 'title') return;
    if (n === 'map') show('title');
    else show('map', { focus: current.params && current.params.n });
  }
  window.addEventListener('popstate', () => {
    historyGuard = false;
    const n = current && current.name;
    if (!n || n === 'title') return;
    back();
    if (current && current.name !== 'title') {
      try {
        history.pushState({ kc: 1 }, '');
        historyGuard = true;
      } catch (e) {
        /* ignore */
      }
    }
  });

  MC.ui = {
    show,
    back,
    current: () => (current ? { name: current.name, params: current.params, root: current.root } : null),
    h,
    tap,
    guardGhostClick,
    button,
    stars,
    topbar,
    starChip,
    soundToggle,
    overlay,
    closeOverlays,
    toast,
    say,
    icon: (name, px, opts) => MC.gfx.icon(name, px, opts),
    /** Crisp pixel-font number (digits / × + - = ? :) as a canvas; px = digit height in CSS px. */
    num: (text, px, opts) => MC.gfx.ptext(text, px, opts),
    /** Text whose numbers use the bitmap digit font ("95 yıldızda"); px = digit height. */
    mixed: (text, px, opts) => MC.gfx.mixed(text, px, opts),
  };

  // ------------------------------------------------------------------ start
  function onFirstGesture() {
    if (MC.audio) MC.audio.unlock();
  }
  function start() {
    if (started) return;
    started = true;
    try {
      MC.gfx.applyTheme();
    } catch (e) {
      console.error(e);
    }
    if (MC.speech) MC.speech.init();
    document.addEventListener('pointerdown', onFirstGesture, { capture: true });
    document.addEventListener('keydown', onFirstGesture, { capture: true });
    MC.store.onChange((what) => {
      if (what === 'settings' || what === 'reset' || what === 'reload') {
        MC.audio.sync();
        if (!MC.store.settings.voice && MC.speech) MC.speech.stop();
        document.documentElement.classList.toggle('fast', !!MC.store.settings.fast);
      }
      if (what === 'skin' || what === 'reset') MC.gfx.clearCache();
    });
    document.documentElement.classList.toggle('fast', !!MC.store.settings.fast);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        MC.audio.pause();
        if (MC.speech) MC.speech.stop();
      } else MC.audio.resume();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (openOverlays.length) {
          const top = openOverlays[openOverlays.length - 1];
          if (top.closable) top.close();
        }
      }
    });
    MC.audio.music(true);
    const splash = $('boot');
    if (splash) splash.remove();
    show('title');
  }
  MC.start = start;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
